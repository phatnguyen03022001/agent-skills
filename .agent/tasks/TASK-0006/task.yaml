acceptance_criteria:
  - id: AC-1
    requirement: "Architect micro-maintenance is explicitly defined as a narrow Architect-owned taskless exception outside the canonical lanes, with all eligibility predicates required before mutation and exact bind/refresh/mutate/verify/stop flow."
    evidence_required: "Exact architect/SKILL.md and TASK_PROTOCOL.md inspection shows the exception, its required predicates, and its fail-closed flow without naming it DIRECT."
  - id: AC-2
    requirement: "DIRECT remains exactly a canonical v3 task lane and no fourth lane, alternate schema, role, framework, or automation mechanism is introduced."
    evidence_required: "Final text and repository diff show exactly three lane names/semantics preserved and no new structural artifact beyond TASK-0006 report evidence."
  - id: AC-3
    requirement: "Any material semantic or release-critical work is excluded from micro-maintenance and falls back to normal canonical authority."
    evidence_required: "Exact exclusion text covers product/runtime/public contracts, reusable governance/protocol semantics, dependencies, branch topology, task/report/review evidence, promotion, tag, release, and authority ambiguity."
  - id: AC-4
    requirement: "Already-authorized accepted-candidate lifecycle continuation may proceed without a new implementation task solely for ceremony, but only under exact existing identity, authority, verification, ref, and capability conditions; continuation never creates authority."
    evidence_required: "Architect and protocol text explicitly separate lifecycle continuation from DIRECT/micro-maintenance and state fail-closed conditions for candidate/ref drift, missing verification/capability, and absent promotion/release authority."
  - id: AC-5
    requirement: "Protocol remains v3 and existing Git/release ownership semantics remain unchanged."
    evidence_required: "Final diff inspection confirms protocol_version 3, no modification to github-workflow/SKILL.md or templates, and no new release/promotion authority field or inferred permission."
  - id: AC-6
    requirement: "Repository deterministic verification passes on the exact final implementation state and only authorized implementation files changed before report evidence."
    evidence_required: "python3 scripts/validate_skill_library.py, python3 -m unittest scripts.test_validate_skill_library, git diff --check, and exact base-to-final changed-file inspection all pass."
  - id: AC-7
    requirement: "Git lineage stays exact: main unchanged, branches exactly {dev, main}, and report commit is the sole report-only child after final_execution_head."
    evidence_required: "Fresh remote refs plus report-commit parent/diff verification."

