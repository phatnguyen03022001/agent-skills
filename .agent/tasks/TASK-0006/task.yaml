      command_or_check: "Before mutation, resolve TASK-0006 revision 1 under pinned self-hosting authority ba9effd83169c1389590d36e7e47b1c100b6d53b; require live dev == handoff base, main == ba9effd83169c1389590d36e7e47b1c100b6d53b, branches exactly {dev, main}, clean worktree, and required EXECUTION capabilities."
      required: true
    - id: CHECK-2
      command_or_check: "Read the current architect/SKILL.md, protocols/TASK_PROTOCOL.md, and github-workflow/SKILL.md from the pinned authority. Confirm current DIRECT/task-lane and lifecycle semantics before editing. This is a prose/protocol semantic correction; do not invent a causal-TDD test for unchanged validator behavior."
      required: true
    - id: CHECK-3
      command_or_check: "Implement only the minimal authorized changes in architect/SKILL.md and protocols/TASK_PROTOCOL.md. Perform focused source inspection proving micro-maintenance is never called DIRECT, exactly three canonical lanes remain, and lifecycle continuation cannot manufacture authority."
      required: true
    - id: CHECK-4
      command_or_check: "Run python3 scripts/validate_skill_library.py and python3 -m unittest scripts.test_validate_skill_library on the exact final implementation HEAD; both must exit 0."
      required: true
    - id: CHECK-5
      command_or_check: "Run git diff --check and inspect the exact handoff-base-to-final diff. Before report creation, changed implementation files must be exactly architect/SKILL.md and protocols/TASK_PROTOCOL.md; .agent/tasks/TASK-0006/task.yaml is planning authority at the handoff base. Prove github-workflow/SKILL.md, templates/, README.md, validators/tests, other skills, historical tasks, and other repositories are unchanged."
      required: true
    - id: CHECK-6
      command_or_check: "Immediately before report creation refresh refs and require dev == final_execution_head, main unchanged at ba9effd83169c1389590d36e7e47b1c100b6d53b, branches exactly {dev, main}, clean worktree, and exact authorized diff. After committing/pushing report.yaml, verify the report commit has exactly one parent equal to final_execution_head, changes only .agent/tasks/TASK-0006/report.yaml, and main/branch set remain unchanged."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

