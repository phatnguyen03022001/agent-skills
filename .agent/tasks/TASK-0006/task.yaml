authority_sources:
  - source: "User-approved governance correction in the governing Architect session: preserve DIRECT as the canonical v3 task lane; introduce only a narrow Architect-owned taskless micro-maintenance exception for trivial reversible non-semantic maintenance; keep promotion/tag/release outside DIRECT and permit no-new-task lifecycle continuation only when exact existing accepted-candidate authority already covers the phase."
    role: user_objective
    precedence: 1
  - source: "architect/SKILL.md and protocols/TASK_PROTOCOL.md@ba9effd83169c1389590d36e7e47b1c100b6d53b. This is a self-hosting governance change executed under the pinned pre-task authority; the new semantics apply only after this task is accepted for future work."
    role: governance
    precedence: 2
  - source: "github-workflow/SKILL.md@ba9effd83169c1389590d36e7e47b1c100b6d53b for existing independent promotion/release authority, exact-candidate lineage, current-phase capability preflight, and final identity verification semantics."
    role: lifecycle_governance
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Current repository structure and user-approved smallest-sufficient correction."
  rationale: "This task changes semantics only in the existing Architect and Task Protocol owners. No new lane, schema, template, skill, framework, registry, lifecycle type, or top-level path is needed."

objective: "Remove unnecessary ceremony for truly trivial Architect-owned maintenance without redefining DIRECT or weakening canonical v3 governance, and explicitly preserve bounded Architect execution of already-authorized accepted-candidate promotion/release continuations without manufacturing new lifecycle authority."

scope:
  required_changes:
    - "Update architect/SKILL.md with a narrowly named Architect micro-maintenance exception that is explicitly NOT DIRECT and NOT a fourth execution lane. It may omit canonical task/report/review machinery only for Architect-owned mutations that are simultaneously small, bounded, reversible, low-risk, directly and clearly authorized, non-semantic for product/runtime/public contracts and reusable governance/protocol, do not modify task/report/review evidence, do not change branch topology/dependencies, do not perform or create promotion/release authority, and have cheap deterministic verification."
    - "Define the micro-maintenance flow as: explicitly bind target -> refresh canonical GitHub truth -> prove exception eligibility before mutation -> mutate only the exact bounded scope -> verify exact diff/final remote identity -> stop. Installed/known capability is not evidence; rely only on capabilities/evidence actually obtained when the operation needs them."
    - "Require fail-closed fallback to the existing canonical v3 task lanes whenever eligibility is ambiguous, any material semantics change is involved, independent execution/review adds material assurance, or the operation touches product/runtime/public contracts, reusable governance/protocol semantics, task/report/review evidence, dependencies, branch topology, promotion, tag, release, or other irreversible/release-critical behavior."
    - "Update protocols/TASK_PROTOCOL.md with the same narrow exception boundary while preserving the existing three canonical task lanes exactly: DIRECT remains small/reversible/low-risk work inside the canonical v3 task/protocol model; BOUNDED and HIGH_ASSURANCE remain unchanged. The exception is outside those lanes and must not create a fourth lane or alternate task schema."
    - "Clarify in architect/SKILL.md and TASK_PROTOCOL.md that an already-accepted lifecycle continuation is separate from the micro-maintenance exception and DIRECT. Architect may perform an already-authorized promotion/tag/release phase without creating a new implementation task solely for ceremony only when exact reviewed_report/promotion_candidate identity, explicit existing phase authority, any required exact-SHA verification, current refs, and current-phase capabilities all remain satisfied."
    - "Clarify fail-closed lifecycle behavior: candidate/ref drift, missing required verification, missing current-phase capability, or absent promotion/release authority stops the phase and requires the normal revised/revalidated authority path; continuation never manufactures authority."
    - "Produce and commit/push .agent/tasks/TASK-0006/report.yaml only after all required verification passes on the exact final implementation state."
  allowed_existing_files_or_components:
    - architect/SKILL.md
    - protocols/TASK_PROTOCOL.md
    - .agent/tasks/TASK-0006/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "The canonical execution lanes remain exactly DIRECT, BOUNDED, and HIGH_ASSURANCE."
  - "DIRECT retains its existing meaning as a lane inside the canonical v3 task/protocol model; it is never used as a synonym for taskless maintenance."
  - "The Architect micro-maintenance exception is not a lane, task schema, lifecycle, role, authority source, or reusable bypass for ordinary work."
  - "The exception grants no authority by itself. Explicit current user/target authority and fresh canonical target truth are still required before mutation."
  - "No product/runtime/public-contract, reusable governance/protocol semantic, dependency, branch-topology, task/report/review-evidence, promotion, tag, release, or release-authority mutation may use the exception."
  - "Promotion and release remain independent lifecycle phases under existing exact-candidate, verifier, authority, and capability semantics."
  - "No new implementation task is required solely to repeat authority for an already-authorized accepted-candidate continuation, but missing authority must never be inferred or backfilled by continuation."
  - "protocol_version remains 3 and all existing v3 task artifacts remain valid."
  - "This self-hosting execution remains governed by ba9effd83169c1389590d36e7e47b1c100b6d53b; the new exception cannot be used to execute or shortcut TASK-0006 itself."
  - "Long-lived branches remain exactly {dev, main}; main remains read-only during execution."

forbidden_changes:
  - "Do not redefine DIRECT, BOUNDED, or HIGH_ASSURANCE."
  - "Do not create a fourth lane, alternate task schema, micro-task artifact, new role, framework, registry, state machine, queue, daemon, or automation layer."
  - "Do not make taskless maintenance available to Executor sessions. The exception is Architect-owned only."
  - "Do not allow the exception for code behavior, runtime behavior, public contracts, reusable governance/protocol semantics, dependency changes, migrations, security-sensitive changes, branch topology, task/report/review evidence, promotion, tag, release, or release authority."
  - "Do not weaken explicit write authority, fresh GitHub truth, exact scope, deterministic verification, current-phase capability preflight, exact-candidate verification, or fail-closed drift semantics."
  - "Do not modify github-workflow/SKILL.md, templates/, validators/tests, README.md, other skills, historical tasks, agent-runtime, architect-profile, agent-documents, or agent-standards under this task."
  - "Do not create branches, mutate main, force-push, rewrite history, tag, release, promote, or mutate repository metadata."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

