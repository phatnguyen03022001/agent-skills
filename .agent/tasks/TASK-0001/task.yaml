  expected_new_files:
    - templates/continuation.yaml
    - .agent/tasks/TASK-0001/report.yaml
  unlisted_new_files:
    allowed: false
    max: 0
    within: []
    purpose: ""
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

acceptance_criteria:
  - id: AC-1
    requirement: "Protocol v3 remains supported as version 3 and legacy expanded v3 artifacts remain valid; all new controls are additive with manual/fail-closed defaults when absent."
    evidence_required: "Focused validator unit tests for backward compatibility plus exact protocol/template inspection."
  - id: AC-2
    requirement: "The protocol defines deterministic lifecycle semantics through independent acceptance, promotion, PROMOTED_NOT_RELEASED, and RELEASED without creating a shared mutable lifecycle artifact owned by multiple roles."
    evidence_required: "Protocol/contracts/templates show derived state rules, legal transitions, invalidation conditions, and canonical result vocabulary."
  - id: AC-3
    requirement: "A continuation policy supports MANUAL and AUTO_UNTIL_STOP, with explicit stop conditions and a rule that automatic continuation never crosses role/evidence/authority boundaries by implication."
    evidence_required: "Task template + Task Protocol + Architect/Executor wording and validator tests for allowed values/default behavior."
  - id: AC-4
    requirement: "Capability requirements are declared semantically by phase and observed by preflight; missing current-phase capability blocks before mutation; future-phase absence does not retroactively invalidate a completed earlier phase."
    evidence_required: "Task/report or continuation shapes, protocol semantics, GitHub workflow mapping, and negative tests for malformed capability structures."
  - id: AC-5
    requirement: "Release mutations have explicit independent authority for version tag, repository metadata, and release publication; none is inferred from commit/push/promotion authority."
    evidence_required: "Canonical task contract/template and GitHub workflow skill explicitly show independent release authority and exact-SHA requirements."
  - id: AC-6
    requirement: "A single small continuation template supports deterministic post-review handoff with exact task/report/candidate/ref identities, prior result, phase, and next action; no second task schema or orchestration subsystem is introduced."
    evidence_required: "templates/continuation.yaml plus protocol/validator coverage."
  - id: AC-7
    requirement: "Independent Architect acceptance can be agent/session-based, but Executor self-acceptance remains forbidden and external review does not require rewriting report.yaml."
    evidence_required: "Architect/Executor skills, Architect Review contract, Implementation Report contract, and review template wording."
  - id: AC-8
    requirement: "An approved exact task/handoff is treated as prior authorization for its bounded actions, preventing redundant human approval prompts unless a defined stop condition or stricter non-waivable safety gate is reached."
    evidence_required: "Task Protocol and Executor skill state this rule without weakening fail-closed behavior."
  - id: AC-9
    requirement: "Canonical task authoring is materially less repetitive without a parallel compact profile/schema and without making safety-significant per-task authority implicit."
    evidence_required: "Diff of templates/task.yaml and corresponding compatibility tests; protocol-owned defaults are explicit in contracts."
  - id: AC-10
    requirement: "README contains a concise lifecycle/identity/ownership cheat sheet and main flow reflects autonomous continuation as optional, not mandatory infrastructure."
    evidence_required: "README inspection and validator/catalog/link PASS."
  - id: AC-11
    requirement: "Validator and tests deterministically enforce the new template/semantic invariants using stdlib only, including negative cases and legacy-v3 compatibility."
    evidence_required: "Red-green evidence for focused tests followed by full validator and unittest PASS."
  - id: AC-12
    requirement: "Repository remains exactly 15 skills, no new dependency/service/runtime/workflow surface is added, and changes stay inside the restrictive file set."
    evidence_required: "Final tree/diff inspection, validator PASS, git diff --check, and changed-file inventory."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Write focused failing tests first for the new canonical template/semantic validation and legacy-v3 compatibility; run those tests and capture the expected pre-implementation failure before changing validator/production protocol surfaces."
      required: true
    - id: CHECK-2
      command_or_check: "python3 scripts/validate_skill_library.py"
      required: true
    - id: CHECK-3
      command_or_check: "python3 -m unittest scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-4
      command_or_check: "python3 -m py_compile scripts/validate_skill_library.py scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-5
      command_or_check: "git diff --check"
      required: true
    - id: CHECK-6
      command_or_check: "Inspect the exact final diff and prove: only authorized files changed; exactly 15 SKILL.md locations remain; no dependency/workflow/main/branch/tag/release mutation occurred; legacy protocol-v3 compatibility tests pass."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

blocking_decisions: []
execution_ready: true
