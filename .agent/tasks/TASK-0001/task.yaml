structure_authority:
  status: RESOLVED
  source: "Current repository tree and README at 85bf97ad5aad4a89157e83e37655b805fc8ae280. One new reusable non-skill template under existing templates/ is authorized; the Architect-owned .agent task tree is already created by the planning commit."
  rationale: "The hardening belongs in the existing protocol/contracts/templates/core skills/validator surfaces. No new skill, role, subsystem, top-level product directory, dependency, service, runtime, coordinator, registry, queue, or database is justified."

objective: "Harden protocol v3 so a user or Architect can authorize one bounded objective once and independent agent roles can continue deterministically through implementation, review, verification, promotion, and release without redundant human checkpoints, while preserving exact-SHA lineage, separation of duties, fail-closed behavior, and backward compatibility with existing v3 tasks."

scope:
  required_changes:
    - "Add an explicit, derived workflow lifecycle and canonical result vocabulary covering planning, execution, reporting, independent acceptance, promotion, the PROMOTED_NOT_RELEASED intermediate release state, and final release."
    - "Add a pre-authorized continuation policy that can express MANUAL versus AUTO_UNTIL_STOP behavior and fixed stop conditions. Automatic continuation must never create missing authority, evidence, verifier PASS, review acceptance, or capability."
    - "Add semantic execution-surface capability requirements by phase and define a fail-closed capability preflight. Keep authority and observed capability availability strictly separate."
    - "Define that a capability missing for the current phase blocks before mutation, while a capability needed only by a later phase does not block completion of an explicitly valid earlier lifecycle state."
    - "Add explicit release-level authority for version-tag creation, repository metadata mutation, and release publication without weakening the existing independence of Git capabilities."
    - "Add one small canonical continuation handoff shape for post-report/post-review phase transitions so exact task identity, reviewed report identity, promotion candidate, expected refs, prior result, and next action can be passed machine-readably across sessions."
    - "Formalize that independent Architect review may be performed by a separate agent/session and does not inherently require a human, but an Executor must never self-accept or manufacture Architect-owned judgment."
    - "Formalize that an already approved exact task/handoff is sufficient prior approval for actions inside its authorization envelope; Executor must not ask for redundant user confirmation unless a defined stop condition is reached or a stricter non-waivable safety policy applies."
    - "Clarify report state versus review state: report.yaml remains Executor evidence and is not rewritten merely because an external Architect later accepts it."
    - "Make canonical task authoring more compact without creating a second task schema/profile or duplicating authority. Remove only boilerplate that is already unconditional protocol truth or safely optional; keep all safety-significant per-task authority, scope, verification, structure, and exact-identity decisions explicit. Existing expanded v3 tasks must remain valid."
    - "Add a concise canonical identity/lifecycle cheat sheet so base_head, final_execution_head, reviewed_report.commit, promotion_candidate_head, verifier identity, lifecycle state, and ownership are not conflated."
    - "Update validator and tests with TDD so the new canonical templates/semantics are deterministic and current v3 compatibility is regression-covered."
  allowed_existing_files_or_components:
    - README.md
    - protocols/TASK_PROTOCOL.md
    - contracts/IMPLEMENTATION_CONTRACT.md
    - contracts/IMPLEMENTATION_REPORT.md
    - contracts/ARCHITECT_REVIEW.md
    - architect/SKILL.md
    - executor/SKILL.md
    - github-dev-main-workflow/SKILL.md
    - templates/task.yaml
    - templates/handoff.yaml
    - templates/report.yaml
    - templates/review.yaml
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
    - .agent/tasks/TASK-0001/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "Keep supported protocol_version exactly 3. This is an additive/backward-compatible hardening, not a protocol v4 redesign."
  - "Existing valid protocol-v3 task/handoff/report/review artifacts must remain semantically valid; absent new optional controls default fail-closed/manual, never permissive."
  - "Do not add a new agent role, skill, coordinator, orchestrator, runtime service, daemon, queue, database, registry, or shared state service."
  - "Keep exactly the current 15 top-level skills."
  - "Do not create a second compact task schema or parallel protocol. There is one canonical v3 task model."
  - "Authority and capability availability are orthogonal: authority without capability cannot execute; capability without authority never permits execution."
  - "AUTO_UNTIL_STOP authorizes continuation orchestration only. It never permits Executor self-review, self-acceptance, bypass of independent review, bypass of authoritative verification, or implicit Git/release authority."
  - "Independent review means role/session separation and exact evidence identity, not necessarily a human reviewer."
  - "Exact-SHA rules remain unchanged: base_head, final_execution_head, reviewed_report.commit, and promotion_candidate_head stay distinct; accepted lineage remains R or exactly one permitted review-artifact child."
  - "No automatic promotion or release is permitted merely because implementation, CI, review, or verification succeeded. The exact task must explicitly authorize each mutation."
  - "A current-phase required capability must be proven before the first mutation of that phase. Capability probing itself must not mutate the target."
  - "Later-phase capability absence may yield a valid intermediate lifecycle state such as PROMOTED_NOT_RELEASED when the earlier phase is independently authorized and complete."
  - "Report ownership remains Executor-only; Architect review judgment remains Architect-only."
  - "No unrelated cleanup or adjacent fixes."
  - "No undocumented scope expansion."
  - "No unauthorized dependency change."
  - "No unauthorized structural reorganization."
  - "No orphan source files."
  - "No speculative scale structure."

forbidden_changes:
  - "Do not increment or reinterpret protocol_version 3 incompatibly."
  - "Do not weaken exact-base, exact-report, exact-candidate, stale-state, or accepted-lineage checks."
  - "Do not allow one actor to self-accept its own execution report."
  - "Do not make human absence equivalent to approval. Approval must come from the exact task/authority chain."
  - "Do not make tool availability equivalent to permission."
  - "Do not make permission equivalent to tool availability."
  - "Do not introduce scores, heuristics, probabilistic acceptance, fuzzy matching, latest-branch authority, or non-exact release identity."
  - "Do not add a generic plugin system, capability registry service, scheduler, workflow engine, or cross-session messaging implementation."
  - "Do not add dependencies; validator/tests remain stdlib-only."
  - "Do not broaden or duplicate the GitHub Actions workflow."
  - "Do not modify .github/workflows/validate-skill-library.yml unless a concrete test proves the current relevant-path coverage is insufficient; if such a need appears, classify it BLOCKING because this task does not authorize workflow mutation."
  - "Do not create branches, temporary branches, backup branches, PR branches, release branches, or test branches."
  - "Do not mutate main."
  - "Do not promote dev to main."
  - "Do not create tags or GitHub Releases as part of this implementation task."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

