    role: "Current governance evidence: Architect closes WHAT/BOUNDARY/PROOF and tasks carry restrictive scope, but no pre-authorization rule requires one coherent material outcome or splits sibling outcomes that can be independently accepted/rejected."
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Existing Architect skill plus existing validator regression suite."
  rationale: "Executor-fit is Architect-local task-decomposition judgment. The smallest correction is one planning rule in architect/SKILL.md with focused regression coverage; no task schema, protocol lifecycle, planner, score, registry or service is required."

objective: "Add a minimal Architect-local Executor-fit gate that prevents authorization of materially independent sibling outcomes inside one canonical task while preserving the existing protocol-v3 task schema and lifecycle."

scope:
  required_changes:
    - "Add one concise Executor-fit/task-decomposition rule to architect/SKILL.md that is evaluated before Architect authorizes a normal canonical task."
    - "Use exactly the planning outcomes FIT, SPLIT_REQUIRED and CAPABILITY_BLOCKED as Architect-local judgment semantics, not serialized task fields or lifecycle states."
    - "Define FIT only when the intended task is one coherent material outcome, one repository/base binding, one independently reviewable candidate boundary, one coherent acceptance/evidence boundary, all required current-phase capabilities are currently satisfiable, and there is no sibling material outcome that a reviewer could independently reject while accepting the rest."
    - "Define SPLIT_REQUIRED when the intended work contains materially independent sibling outcomes or independently rejectable review/acceptance boundaries; Architect must split those outcomes before canonical task authorization. Do not split merely because implementation has multiple files, steps, components, tests or deterministic jobs when they serve one coherent outcome."
    - "Define CAPABILITY_BLOCKED when the material outcome is coherent but a required current-phase capability cannot presently be satisfied; capability unavailability must not be disguised as task splitting, scheduling or provider orchestration."
    - "State explicitly that this gate creates no complexity score, token budget, duration estimate, task points, queue, scheduler, planner service, new schema, task field, lifecycle state or additional organizational role."
    - "Add focused regression coverage in scripts/test_validate_skill_library.py that locks the three outcomes, the independently-rejectable-sibling criterion, one-repository/base/review/evidence boundary semantics, and the prohibition on numeric/scoring/task-schema machinery."
    - "Run repository-native validation, complete validator/library tests, reconciler tests, applicable compile checks and git diff --check on the exact candidate; publish candidate/report non-force to dev and stop for Governing Architect review."
  allowed_existing_files_or_components:
    - architect/SKILL.md
    - scripts/test_validate_skill_library.py
  expected_files_are_restrictive: true

invariants:
  - "Protocol version remains 3 and templates/task.yaml is unchanged; FIT/SPLIT_REQUIRED/CAPABILITY_BLOCKED are not canonical artifact fields or lifecycle states."
  - "Executor-fit governs Architect task decomposition quality only; it does not prescribe Executor-local HOW."
  - "One coherent outcome may still span multiple files/components/verification steps when those surfaces share one inseparable material acceptance boundary."
  - "Capability blocking remains current-phase runtime evidence and does not create queue/scheduler semantics."
  - "One governing Architect and one active repository binding semantics remain unchanged."
  - "Repository topology remains exactly dev/main; main is read-only and unchanged."

forbidden_changes:
  - "Do not add numerical complexity scores, token-budget scoring, duration prediction, task points or sizing scales."
  - "Do not add a queue, scheduler, task database, registry, planner service, orchestration layer, dependency engine, daemon or persistent capability state."
  - "Do not add or change task/report/review schema fields, protocol version, lifecycle states, organizational roles, continuation semantics, Git topology, release semantics or promotion semantics."
  - "Do not modify templates/task.yaml, protocols/TASK_PROTOCOL.md, contracts, executor skill, workflow, dependencies, Case Router, repository settings, tags or releases unless a contradiction discovered during execution requires Architect revision first."
  - "Do not create branches, mutate main, force-push, rewrite history, promote, tag, release or author review.yaml."

