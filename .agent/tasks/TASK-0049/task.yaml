acceptance_criteria:
  - id: AC-1
    requirement: "Architect has an explicit deterministic Executor-fit gate before normal canonical task authorization."
    evidence_required: "Exact architect/SKILL.md candidate text and regression prove the three outcomes FIT, SPLIT_REQUIRED and CAPABILITY_BLOCKED and their placement in pre-authorization planning."
  - id: AC-2
    requirement: "FIT means one coherent independently reviewable material outcome rather than arbitrary scope accumulation."
    evidence_required: "Regression proves FIT requires one repository/base binding, one candidate/review boundary, one coherent acceptance/evidence boundary, satisfiable required current-phase capabilities and no independently rejectable sibling material outcome."
  - id: AC-3
    requirement: "Material sibling outcomes are split for reviewability without splitting implementation ceremony."
    evidence_required: "Exact guidance and regression prove independently rejectable sibling outcomes yield SPLIT_REQUIRED, while multiple files/steps/components/tests alone do not require splitting when they serve one coherent outcome."
  - id: AC-4
    requirement: "Unavailable capability is represented as capability blocking rather than decomposition or orchestration."
    evidence_required: "Exact guidance and regression prove coherent work with unavailable required current-phase capability yields CAPABILITY_BLOCKED and does not introduce scheduling/provider-routing state."
  - id: AC-5
    requirement: "The rule introduces no new schema/lifecycle/scoring/control-plane machinery."
    evidence_required: "Exact diff changes only architect/SKILL.md and scripts/test_validate_skill_library.py; task template/protocol/contracts remain unchanged and focused regression rejects or explicitly guards against numeric scoring, task-field/lifecycle interpretation, queue, scheduler and planner-service semantics."
  - id: AC-6
    requirement: "Existing repository validation remains green."
    evidence_required: "Fresh exact-candidate validator PASS, complete validator/library tests PASS, reconciler tests PASS, applicable compile checks PASS and git diff --check PASS."
  - id: AC-7
    requirement: "Existing GitHub Actions validation passes for the exact candidate."
    evidence_required: "Fresh Validate skill library push run for exact candidate SHA completes SUCCESS with existing validation/test job semantics."
  - id: AC-8
    requirement: "Candidate/report publication remains bounded to dev with exact lineage and main unchanged."
    evidence_required: "Implementation candidate has exact task base as sole parent and only the two authorized changed files; report is report-only child; fresh remote/local/topology proof confirms dev closure, main unchanged, no branch creation and clean tree."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-bind TASK-0049 revision 1 at exact handoff base; require dev, local HEAD = origin/dev = handoff base, clean tree, unchanged main/topology, report absent and every required EXECUTION capability freshly available before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Reconfirm current Architect/task semantics do not already contain a one-coherent-outcome or independently-rejectable-sibling split gate; do not implement if fresh canonical truth contradicts this task premise."
      required: true
    - id: CHECK-3
      command_or_check: "Add the smallest Architect-local rule plus focused regression only; prove task schema, protocol, contracts, Executor semantics and control-plane surfaces remain untouched."
      required: true
    - id: CHECK-4
      command_or_check: "Run repository-native validator, complete validator/library and reconciler tests, applicable compile checks, exact changed-path proof and git diff --check on the candidate."
      required: true
    - id: CHECK-5
      command_or_check: "Publish candidate non-force to dev, require exact-SHA existing validation workflow SUCCESS, author/validate/publish only .agent/tasks/TASK-0049/report.yaml, fresh-prove final remote/local closure and stop for Governing Architect review."
      required: true
