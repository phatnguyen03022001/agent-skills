structure_authority:
  status: RESOLVED
  source: "repository root ignore policy"
  rationale: >-
    This task adds exactly one repository-root .gitignore plus the canonical task report. No source,
    package, directory, workflow, runtime, protocol, or repository structure is otherwise changed.

objective: >-
  Add the smallest stack-appropriate repository-root .gitignore for agent-skills so macOS metadata,
  Python local artifacts, local environment files, and the operator-local Codex environment file no longer
  create false dirty managed-mirror state, without hiding repository-owned .codex content or any tracked artifact.

scope:
  required_changes:
    - >-
      Create repository-root .gitignore containing exactly the minimal supported baseline for this repository:
      .DS_Store; __pycache__/; *.py[cod]; .venv/; venv/; .pytest_cache/; .mypy_cache/; .ruff_cache/;
      .coverage; coverage/; .env; .env.* with !.env.example and !.env.*.example exceptions; and
      .codex/environments/environment.toml.
    - >-
      Do not add broad unrelated patterns such as .cache/, node_modules/, .next/, build/, dist/, or an ignore for
      the entire .codex/ directory unless fresh repository evidence proves an exact need and the task is revised.
    - >-
      Preserve any existing operator-owned local .DS_Store and .codex/environments/environment.toml bytes exactly;
      do not delete, clean, stash, move, rewrite, or inspect their contents merely because they become ignored.
    - >-
      Publish exact .gitignore candidate and compact report-only child on dev.
  allowed_existing_files_or_components:
    - ".gitignore"
    - ".agent/tasks/TASK-0036/report.yaml"

invariants:
  - "No tracked repository file becomes ignored by the new rules."
  - "Any tracked .env.example or .env.*.example remains trackable and is not hidden by the ignore rules."
  - "Only .codex/environments/environment.toml is ignored under .codex; the .codex directory as a whole is not ignored."
  - "No existing local untracked operator-owned file is deleted or modified by this task."
  - "No source, tests, skills, protocol, Case Router, model policy, runtime, dependency, workflow, or support-repository content outside this repository is modified."
  - "Topology remains exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not delete or clean local untracked files just to obtain a clean status."
  - "Do not ignore the whole .codex/ tree."
  - "Do not add generic framework/build patterns without repository evidence."
  - "Do not modify any file other than .gitignore and .agent/tasks/TASK-0036/report.yaml."
  - "Do not create/delete/rename branches, tags, releases, repository settings, or promote main."

