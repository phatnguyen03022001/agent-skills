    requirement: >-
      Exact base-to-candidate diff adds only root .gitignore with the authorized minimal patterns and no unrelated ignore entries.
    evidence_required: "Exact diff and parsed line-set proof."
  - id: AC-2
    requirement: >-
      git ls-files -ci --exclude-standard is empty on the exact candidate, proving no tracked artifact is newly hidden.
    evidence_required: "Exact command result."
  - id: AC-3
    requirement: >-
      git check-ignore proves .DS_Store, representative Python cache/venv/env artifacts, coverage artifacts, and
      .codex/environments/environment.toml are ignored while .env.example and a representative .env.test.example are not ignored;
      a representative other .codex path is not ignored.
    evidence_required: "Deterministic synthetic check-ignore evidence without modifying operator-owned files."
  - id: AC-4
    requirement: >-
      Existing repository verification remains green as applicable and git diff --check passes; no unrelated tracked bytes change.
    evidence_required: "Repository-native verification plus diff/status evidence."
  - id: AC-5
    requirement: >-
