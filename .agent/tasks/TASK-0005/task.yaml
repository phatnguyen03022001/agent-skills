      required: true
    - id: CHECK-2
      command_or_check: "Causal TDD RED: add/revise the focused current-identity regression in scripts/test_validate_skill_library.py first; run only that focused unittest and prove it fails because the repository still has the old current github-dev-main-workflow identity before implementation."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the minimal atomic rename/current-reference migration and run the focused identity regression again; require GREEN before proceeding."
      required: true
    - id: CHECK-4
      command_or_check: "Implement the Architect structural-routing/deferred-observation semantics and the narrow protocol clarification, then perform bounded source inspection proving simplicity values were not duplicated and operator-specific observations/ path was not hard-coded."
      required: true
    - id: CHECK-5
      command_or_check: "Run python3 scripts/validate_skill_library.py, then python3 -m unittest scripts.test_validate_skill_library; both must exit 0 on the exact final implementation HEAD."
      required: true
    - id: CHECK-6
      command_or_check: "Run git diff --check; verify github-workflow/SKILL.md exists with frontmatter name github-workflow; verify github-dev-main-workflow and docs/superpowers are absent; verify nonhistorical git grep for github-dev-main-workflow returns no matches; verify exactly 15 SKILL.md files."
      required: true
    - id: CHECK-7
      command_or_check: "Against the exact handoff base, prove .agent/tasks/TASK-0001..TASK-0004, simplicity/SKILL.md, templates/, .github/workflows/, contracts/, and unrelated skills are unchanged; prove no alias, registry, extra skill, replacement design namespace, protocol bump, or cross-repo mutation occurred."
      required: true
    - id: CHECK-8
      command_or_check: "Immediately before report creation refresh refs and require dev == final_execution_head, main unchanged, branches exactly {dev, main}, clean worktree, and exact authorized implementation diff. After committing/pushing report.yaml, verify the report commit has exactly one parent equal to final_execution_head, changes only .agent/tasks/TASK-0005/report.yaml, and main/branch set remain unchanged."
      required: true
