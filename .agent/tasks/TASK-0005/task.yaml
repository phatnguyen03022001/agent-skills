  - "After implementation there is exactly one current Git workflow skill identity: github-workflow. The old github-dev-main-workflow directory/current identity is absent; no alias, deprecated wrapper, mapping table, redirect, or compatibility registry exists."
  - "Historical .agent/tasks/TASK-0001 through TASK-0004 remain byte-for-byte unchanged. Their old skill names are immutable historical truth under their pinned revisions and are not stale current references."
  - "simplicity/SKILL.md remains unchanged and remains the sole reusable owner of source-depth and language naming defaults; Architect receives only a routing trigger, not copied numeric depth/naming rules."
  - "templates/ and .github/workflows/ remain unchanged because the audited current files contain no stale skill identity requiring migration."
  - "protocol_version remains 3; no protocol v4, topology abstraction layer, migration framework, observation schema, observation validator, status machine, index, manifest, issue mirror, automatic capture, or automatic repository switching is introduced."
  - "Reusable agent-skills governance does not hard-code the operator-specific observations/<owner>__<repo>.md path; that convention belongs to the later architect-profile task."
  - "Deferred observations remain cheap-to-die continuity notes only: they are not tasks, findings with current validity, execution authority, review evidence, lifecycle state, or a cross-repository queue."
  - "main remains read-only at 1a9424fbd778472f79c152c0b42dd2bd495fbd8e and long-lived branches remain exactly {dev, main}."

