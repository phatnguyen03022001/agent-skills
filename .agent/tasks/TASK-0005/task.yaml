structure_authority:
  status: RESOLVED
  source: "User-approved smallest-sufficient design plus simplicity/SKILL.md@54aa117612112dcedc62e3dccb95bbc5410c15da."
  rationale: "The only structural changes are the atomic top-level skill rename github-dev-main-workflow -> github-workflow and removal of the temporary docs/superpowers design namespace after its material decisions are consumed. No new durable design/docs taxonomy, compatibility wrapper, alias, migration registry, or additional skill is authorized."

objective: "Perform one atomic current-identity migration from github-dev-main-workflow to github-workflow and integrate the approved Architect deferred-observation/structural-routing semantics into existing canonical owners, while preserving protocol v3, the exact 15-skill taxonomy, historical SHA-pinned authority, and the smallest sufficient repository structure."

scope:
  required_changes:
    - "Use causal TDD for the current skill-identity contract: first add or revise a focused regression in scripts/test_validate_skill_library.py that expects current canonical identity github-workflow, rejects the old current identity, and synchronizes folder/frontmatter/catalog/validator expectations; run it and record the RED failure before changing the current identity implementation."
    - "Atomically replace github-dev-main-workflow/SKILL.md with github-workflow/SKILL.md and set frontmatter name: github-workflow. Preserve the existing GitHub Workflow responsibility and MAIN_ONLY / DEV_MAIN / DEV_STAGING_MAIN semantics; this is an identity correction, not a topology redesign."
    - "Update only confirmed live stale references needed by the rename: README.md curated catalog, scripts/validate_skill_library.py EXPECTED_SKILLS, and the current-path references in scripts/test_validate_skill_library.py. Before mutation, run an exact nonhistorical grep; if another live stale reference exists outside the authorized files below, stop with NEEDS_REVISION rather than expanding scope."
    - "Update architect/SKILL.md with one explicit structural-routing trigger: when material planning introduces/moves/splits/nests/renames source directories, modules, or packages, or naming conventions are material to structure_authority, load simplicity before resolving structure_authority unless target authority already fully resolves the question. Do not duplicate source-depth or naming values."
    - "Update architect/SKILL.md with generic deferred-observation semantics: an optional explicitly configured operator-profile observation store may preserve a minimal cross-repository observation without switching the active target; the observation is non-authoritative, does not grant authority over the observed repository, and unavailable storage does not block current work."
    - "Update protocols/TASK_PROTOCOL.md only for the narrow binding clarification required by the existing core-binding language: a configured operator-profile observation write is non-authoritative continuity context, does not change the active target or grant target-repository mutation authority, and later action still requires normal explicit binding, fresh GitHub truth, and revalidation. Keep protocol_version 3."
    - "Consume the material decisions from docs/superpowers/specs/2026-08-26-architect-deferred-observations-design.md into the canonical owners above and this task authority, then delete that temporary file so docs/superpowers/ and docs/ disappear naturally if empty. Do not create a replacement docs/design, .agent/designs, plan, registry, or framework-specific durable namespace."
    - "Produce and commit/push .agent/tasks/TASK-0005/report.yaml only after all focused and full verification passes on the exact final implementation state."
  allowed_existing_files_or_components:
    - github-dev-main-workflow/SKILL.md
    - README.md
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
    - architect/SKILL.md
    - protocols/TASK_PROTOCOL.md
