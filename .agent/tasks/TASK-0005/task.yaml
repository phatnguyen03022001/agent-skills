acceptance_criteria:
  - id: AC-1
    requirement: "The current Git workflow skill identity migration is atomic: final current tree has github-workflow/SKILL.md with matching frontmatter/catalog/validator/tests, no github-dev-main-workflow current directory or alias, and exactly 15 skills."
    evidence_required: "Focused RED->GREEN regression evidence plus final validator output, exact tree/path inspection, and nonhistorical grep showing no old current identity."
  - id: AC-2
    requirement: "Only actual live stale references are migrated; historical TASK-0001..0004 and files without stale identity are not touched."
    evidence_required: "Base-to-final diff proves TASK-0001..0004, templates/, .github/workflows/, simplicity/, and unrelated files unchanged; changed-file list is restricted to task-authorized owners."
  - id: AC-3
    requirement: "Architect has an explicit structural routing trigger to load simplicity before resolving material structure_authority when target authority has not already resolved the structural question, without duplicating reusable depth/naming values."
    evidence_required: "Exact architect/SKILL.md inspection and unchanged simplicity/SKILL.md proof."
  - id: AC-4
    requirement: "Deferred observation semantics are explicitly non-authoritative and non-blocking: recording to an optional configured operator-profile observation store does not switch active target or grant authority; later action requires normal target binding, fresh GitHub truth, and revalidation."
    evidence_required: "Exact architect/SKILL.md and TASK_PROTOCOL.md inspection demonstrating the narrow semantics and preserving one-active-target/repository-local authority."
  - id: AC-5
    requirement: "Temporary Superpowers design evidence is fully consumed by canonical owners before deletion; no framework-specific durable namespace or replacement design taxonomy remains."
    evidence_required: "Final tree has no docs/superpowers/ and no replacement docs/design, .agent/designs, or Superpowers plan artifact; review maps each material design decision to architect skill, protocol, task authority, or later operator-profile ownership."
  - id: AC-6
    requirement: "Protocol remains v3 and no compatibility/migration/observation framework is added."
    evidence_required: "Protocol and final diff inspection show protocol_version 3 and absence of aliases, registries, schemas, status machines, indexes, manifests, automatic switching/capture, or new skills."
  - id: AC-7
    requirement: "The full deterministic skill-library verification passes on the exact final implementation state."
    evidence_required: "Fresh python3 scripts/validate_skill_library.py and python3 -m unittest scripts.test_validate_skill_library both return zero failures/errors on final_execution_head."
  - id: AC-8
    requirement: "Git lineage and repository boundaries remain exact: main unchanged, branches exactly {dev, main}, no unauthorized files, and the committed Executor report is the sole report commit after final_execution_head."
    evidence_required: "Fresh remote ref/branch inspection, git diff --check, base-to-final changed-file audit, and post-report single-parent/report-only lineage proof."

