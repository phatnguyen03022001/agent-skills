    precedence: 2

structure_authority:
  status: RESOLVED
  source: "Existing README, protocol, role skills, and artifact contracts."
  rationale: "The correction is subtraction/ownership clarification inside current files. No new schema, manifest, registry, skill, protocol version, generated documentation system, or ownership database is justified."

objective: "Reduce semantic drift risk and operator-specific leakage by establishing one clear owner for reusable cross-role protocol semantics, keeping role skills and contracts narrowly responsible for their local procedures/artifacts, removing duplicated normative prose where a stable link/local rule is sufficient, and making TASK LAUNCH generic governance presentation-only without prescribing operator-specific labels, ordering, language, executor choices, model, or effort presentation."

scope:
  required_changes:
    - "F-07: make protocols/TASK_PROTOCOL.md the semantic owner for reusable cross-role task-governance semantics that apply across Architect and Executor, including shared binding/lifecycle/authority/capability/continuation/promotion-release invariants. Do not create a new semantic-owner artifact."
    - "Keep architect/SKILL.md responsible for Architect-specific routing, planning, authority creation, review judgment, micro-maintenance eligibility, and role-local operating procedure. Keep executor/SKILL.md responsible for Executor-specific pre-mutation gates, restrictive execution, divergence handling, hard mutation boundaries, hygiene, and report ownership. Where either file merely restates shared protocol semantics without adding role-local behavior, replace the duplicate with the smallest sufficient local statement/link rather than another full copy."
    - "Keep contracts responsible for artifact-specific obligations and templates as example/default shapes. Remove only cross-role protocol prose duplicated in contracts when the contract can instead reference TASK_PROTOCOL.md without losing a field-specific obligation. Do not hollow contracts into meaningless link stubs."
    - "Keep README.md as discovery/overview rather than a second normative protocol. Preserve the skill catalog and useful navigation, but shorten duplicated governance sections where protocol/role owners already carry the rule. README summaries must not become alternate wording that can independently drift."
    - "F-08: generic agent-skills may state only that launch presentation is operator-facing, non-authoritative, and separate from the compact authority locator. Remove concrete operator-profile presentation requirements such as exact field labels, ordering, language-specific labels, fixed Executor option lists, or model/effort presentation from generic README/Architect guidance. Concrete presentation belongs to the operator/profile layer, not this reusable repository."
    - "Preserve the generic PROMPT TO COPY invariant: it is an authority locator, not duplicated authority, and should remain compact. Do not move target-specific task authority into presentation text."
    - "F-12 subset: achieve real subtraction as a consequence of F-07/F-08. Prefer deletion and links over paraphrasing duplicated semantics. Do not chase a numeric line-count target, but the final implementation must not increase duplicated governance prose or introduce a parallel summary schema."
    - "Preserve all TASK-0007 protocol-correctness semantics, including topology-neutral continuation, legacy v3 compatibility, phase/action relations, lifecycle consistency, and exact accepted-report identity requirements."
    - "Run repository-owned deterministic validation and unit tests plus git diff --check. Produce TASK-0008 report evidence in a separate report-only commit and stop at Governing Architect review."
  allowed_existing_files_or_components:
    - README.md
    - protocols/TASK_PROTOCOL.md
    - architect/SKILL.md
    - executor/SKILL.md
    - contracts/IMPLEMENTATION_CONTRACT.md
    - contracts/IMPLEMENTATION_REPORT.md
    - contracts/ARCHITECT_REVIEW.md
    - .agent/tasks/TASK-0008/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Protocol version remains 3; existing valid expanded v3 artifacts remain valid."
  - "TASK_PROTOCOL.md owns reusable cross-role protocol semantics; role skills own role-local behavior; contracts own artifact-specific obligations; templates remain example/default shapes; README remains discovery/overview; validator remains mechanical enforcement rather than prose authority."
  - "No user/operator profile is made mandatory. Generic governance must not hard-code concrete TASK LAUNCH field names, order, language, executor menu, model, effort, or machine/provider defaults."
  - "PROMPT TO COPY remains generic, compact, and non-authoritative except as a locator to canonical repository authority."
  - "Architect/Executor organizational roles, exact task/handoff binding, authority != capability, report/review separation, fail-closed stale state, explicit Git/release authority, current continuation semantics, and repository-local lineage remain unchanged."
  - "Role skills must retain locally actionable safety boundaries; subtraction must not force an Executor or Architect to infer a hard local prohibition from an unrelated document when the role-specific action boundary is material."
  - "F-02 architect_binding duplication remains unchanged; F-03 report confirmation booleans remain unchanged; F-04 explicit safe defaults remain unchanged; F-09 taxonomy ownership remains unchanged; F-10 remains NO_CHANGE_REQUIRED; F-11 serialized naming remains unchanged."
  - "The exact 15-skill taxonomy and README catalog remain unchanged."
  - "No historical task/report/review artifact is rewritten."
  - "Branches remain exactly {dev, main}; main remains read-only."

forbidden_changes:
  - "Do not change task/report/review/continuation schemas, template field sets, validator parsing/validation semantics, protocol version, lifecycle tokens, review states, continuation action tokens, Git/release authority fields, or compatibility behavior."
  - "Do not remove architect_binding.target_repository, report confirmation booleans, explicit template safe defaults, EXPECTED_SKILLS, the README skill catalog, or introduce a taxonomy manifest."
  - "Do not add a semantic registry, ownership manifest, generated-doc system, synchronization script, prose linter, new validator rule, new skill, new protocol artifact, or another top-level directory."
  - "Do not redesign execution lanes, micro-maintenance, continuation, promotion/release, local hygiene, deferred observations, or cross-repository PROGRAM semantics."
  - "Do not modify templates/*.yaml, scripts/*.py, .github/workflows/*, simplicity/SKILL.md, github-workflow/SKILL.md, unrelated skills, other repositories, repository metadata, tags, releases, or branch topology."
  - "Do not create branches, mutate main, force-push, rebase, rewrite history, promote, tag, release, or create review.yaml under this task."

