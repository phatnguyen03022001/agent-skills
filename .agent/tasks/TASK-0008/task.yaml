    requirement: "Reusable cross-role governance has one clear semantic owner rather than independent normative copies."
    evidence_required: "Final diff shows TASK_PROTOCOL.md explicitly owns shared protocol semantics and README/role skills/contracts contain only discovery, role-local, or artifact-local statements where duplication was removed."
  - id: AC-2
    requirement: "TASK LAUNCH generic governance no longer prescribes operator-specific presentation."
    evidence_required: "README/Architect generic guidance contains no required exact launch field list/order/language/fixed executor choices/model-effort presentation; generic non-authority/presentation and compact PROMPT TO COPY invariants remain."
  - id: AC-3
    requirement: "Subtraction is real and does not erase material local safety or artifact obligations."
    evidence_required: "Before/after review identifies deleted duplicate clusters, retained role-local hard boundaries, and retained artifact-specific contract obligations; no replacement registry/linter/generated synchronization mechanism is added."
  - id: AC-4
    requirement: "Deferred cleanup candidates are not silently expanded into schema/taxonomy work."
    evidence_required: "Exact diff confirms no templates/scripts/schema/taxonomy/catalog/manifest changes and explicitly records F-02/F-03/F-04/F-09 as NO_CHANGE_REQUIRED for this task."
  - id: AC-5
    requirement: "TASK-0007 correctness and protocol-v3 compatibility remain intact."
    evidence_required: "Repository validator and unit tests PASS on exact implementation SHA; review confirms no change to continuation/review machine semantics."
  - id: AC-6
    requirement: "Publication lineage and repository topology remain exact."
    evidence_required: "Implementation is a non-force descendant of TASK-0008 handoff base; separate report-only commit changes only .agent/tasks/TASK-0008/report.yaml; main unchanged and branches exactly {dev, main}."

