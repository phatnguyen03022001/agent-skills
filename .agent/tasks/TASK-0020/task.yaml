structure_authority:
  status: RESOLVED
  source: "Operator-closed GOV-B design plus ACCEPTED TASK-0019 GOV-A evidence."
  rationale: >-
    GOV-B is one atomic reusable-governance correction. It changes only existing Task Protocol, Architect,
    Executor, task-contract/template, validator, and validator-test ownership surfaces plus the normal task report.
    It creates no new organizational role, lifecycle, protocol version, task dialect, shared framework, or top-level structure.

objective: >-
  Correct the reusable Architect/Executor decision-ownership model so Architect owns material authority,
  material boundaries, acceptance/proof, and final judgment while Executor owns implementation judgment by default
  inside an authorized task boundary. Make materiality consequence-based rather than category-based; make semantic/
  component consequence the default scope representation; separate local structure from material structure; normalize
  omitted protocol-v3 task implementation-prescription fields through one canonical default model while preserving
  fail-closed authority and explicit historical restrictions; and prove the correction with deterministic regressions.

scope:
  required_changes:
    - >-
      Correct Task Protocol semantics so, inside an authorized task boundary, implementation judgment belongs to
      Executor by default. Uncertainty alone is not escalation. Escalation is required only when a proposed choice
      would change governing semantics, authority, acceptance, or a material trust, ownership, compatibility,
      durability, irreversibility, dependency, cost/topology, or architectural consequence.
    - >-
      Make materiality consequence-based across all categories. Implementing already-frozen API, security, data,
      migration, dependency, or structure decisions remains Executor-local HOW when material consequences do not change;
      changing their governing consequence remains Architect-owned.
    - >-
      Correct Architect procedure so it closes WHAT, material BOUNDARY, and PROOF, then stops prescribing local HOW
      unless the implementation mechanism itself is materially authoritative. Architect must not require local helper,
      internal file decomposition, SQL organization, test-helper layout, generated-companion mechanics, formatter
      invocation, or equivalent implementation detail merely to make a task executable.
    - >-
      Correct Executor procedure so it resolves exact authority, inspects current repository patterns, chooses the
      smallest sufficient repo-native implementation, implements, and proves acceptance. Executor discretion is not
      authority expansion or a creativity license.
    - >-
      Tighten LOCAL semantics: a discovered issue is LOCAL only when fixing it is necessary for current acceptance,
      stays within the authorized material/component boundary, changes no governing semantics or authority, creates no
      new material dependency/ownership boundary, and is deterministically verifiable. LOCAL needs no Architect approval.
      FOLLOW_UP and BLOCKING remain consequence-based rather than category-based.
    - >-
      Correct scope semantics so scope owns semantic/component consequence by default. A semantic/component boundary may
      be resolved by Executor to actual repository files through current repository truth. Path restrictions are optional
      aids; exact-file restrictions are hard boundaries only when explicitly and materially justified.
    - >-
      Unexpected but materially local changed surfaces required for acceptance are not automatic pre-mutation blockers.
      Executor must surface them truthfully in report evidence; Architect review may challenge whether they remained local.
    - >-
      Correct structure semantics so new-file creation is not a proxy for architectural materiality. Internal files/modules
      inside an already-authorized component are local structure owned by Executor. New or changed top-level ownership,
      service/package/component boundary, reusable shared abstraction, cross-component ownership move, or public/shared
      module contract is material structure owned by Architect.
    - >-
      Define one canonical protocol-v3 task normalization/default table as the semantic owner for omitted optional task
      controls. Validator and role procedure must consume the same normalized meaning. Sparse serialization is only an
      encoding of the same protocol-v3 semantic model, not a second task dialect or lifecycle.
    - >-
      Preserve the critical default distinction: absence of authority remains non-permissive/fail-closed; absence of an
      implementation prescription grants Executor discretion only inside an already-positive authorized material/component
      boundary. Missing exact-file policy must not normalize to denial of all unlisted local files.
    - >-
      Preserve backward semantic compatibility. Explicit expanded-v3 controls retain their exact meaning, including
      expected_files_are_restrictive: true and explicit structure restrictions. Do not reinterpret historical task artifacts,
      migrate task history, or require old tasks pinned to old agent-skills revisions to adopt new semantics.
    - >-
      Update the task template to represent the new forward default compactly without introducing task-lite/task-compact,
      protocol v4, another artifact type, or a second semantic model. Keep positive authority/boundary and acceptance explicit.
    - >-
      Update the task artifact contract only as needed to align with the corrected protocol ownership and normalized
      task semantics. Do not duplicate the full protocol into the contract.
    - >-
      Update the existing validator and its existing unit-test suite so normalization/default semantics have one
      deterministic implementation and regression coverage. Tests must cover both over-governance and under-governance:
      local implementation discretion remains allowed; material semantic/authority changes still fail closed; explicit
      old restrictive controls stay restrictive; missing authority never becomes permission.
    - >-
      Preserve protocol version 3, exactly fifteen curated skills, existing task/report/review artifact ownership,
      exact-base handoff, authority/capability separation, lifecycle, promotion/release separation, and current PROGRAM
      authority NONE semantics.
    - >-
      Produce one coherent implementation candidate, run repository-native validator and unit tests on that exact candidate,
      publish it to dev, require the existing Validate skill library GitHub Actions workflow to PASS on the exact candidate,
      then publish the canonical report and stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - protocols/TASK_PROTOCOL.md
    - architect/SKILL.md
    - executor/SKILL.md
    - contracts/IMPLEMENTATION_CONTRACT.md
    - templates/task.yaml
