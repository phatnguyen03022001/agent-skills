  expected_files_are_restrictive: true

invariants:
  - "Architect owns material authority and acceptance; Executor owns implementation judgment inside that authority by default."
  - "Executor discretion never expands task authority."
  - "Materiality is consequence-based, never category-based."
  - "Scope bounds semantic/component consequences by default; exact files are restrictive only when explicitly justified."
  - "Local structure is Executor-owned; material ownership/component/public/shared structure is Architect-owned."
  - "Sparse protocol v3 is serialization only: omitted controls normalize into one canonical semantic model."
  - "Missing authority denies; missing implementation prescription permits bounded Executor discretion."
  - "Existing explicit expanded-v3 restrictions preserve their meaning and historical pinned semantics are not rewritten."
  - "Review consequence/evidence remains distinct from implementation taste; GOV-C review sparsification is not part of this task."
  - "No new role, lifecycle, task dialect/version, registry, cache, compiler, orchestrator, state database, or PROGRAM delegation is introduced."
  - "agent-standards, agent-documents, agent-runtime, and architect-profile remain unchanged."

forbidden_changes:
  - "Do not modify report/review templates, IMPLEMENTATION_REPORT, ARCHITECT_REVIEW, operational-timing semantics, or evidence-lifecycle sparsification; those belong to GOV-C."
  - "Do not create governance eval-suite files beyond the validator regression tests necessary to prove GOV-B; broader paired model evals belong to GOV-D."
  - "Do not modify README.md, simplicity/SKILL.md, github-workflow/SKILL.md, any other skill, workflow, dependency, PROGRAM artifact, release machinery, or repository topology."
  - "Do not modify agent-standards, agent-documents, agent-runtime, architect-profile, ilets, SF, or any external repository."
  - "Do not migrate, normalize, backfill, or rewrite historical .agent task/report/review artifacts."
  - "Do not create branches, PRs, issues, tags, releases, or mutate main."
  - "Do not add a new parser library, YAML dependency, schema framework, code generator, registry, cache, or orchestration layer."

