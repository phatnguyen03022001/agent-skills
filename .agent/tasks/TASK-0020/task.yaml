acceptance_criteria:
  - id: AC-1
    requirement: "Default decision ownership is explicit, bounded, and consequence-based."
    evidence_required: >-
      Task Protocol plus Architect/Executor skills state that implementation judgment inside positive task authority defaults to
      Executor, uncertainty alone does not escalate, and escalation occurs only on governing/material consequence change.
  - id: AC-2
    requirement: "Executor discretion is safely constrained rather than converted into local architecture freedom."
    evidence_required: >-
      Executor procedure requires inspect-before-design, smallest sufficient repo-native HOW, unchanged authority, tightened LOCAL
      predicates, deterministic proof, and consequence-based FOLLOW_UP/BLOCKING behavior.
  - id: AC-3
    requirement: "Scope and structure no longer use filenames as the default proxy for material authority."
    evidence_required: >-
      Protocol/task semantics support positive semantic/component boundaries resolved to local files by Executor; unexpected local
      companion surfaces are report/review signals rather than automatic blockers; local internal files/modules do not require
      Architect structure decisions while material ownership/component/public/shared boundary changes still do.
  - id: AC-4
    requirement: "Protocol-v3 omission semantics normalize through one canonical default model without weakening authority."
    evidence_required: >-
      One canonical default table defines missing-field normalized values; validator and task template agree with it; missing
      authority remains non-permissive while missing implementation prescription permits discretion only inside positive authority.
  - id: AC-5
    requirement: "Backward semantic compatibility is preserved forward."
    evidence_required: >-
      Regression tests prove explicit expanded-v3 restrictive controls retain their prior meaning, historical artifacts are not
      rewritten, protocol version remains 3, and new sparse/omitted controls do not create a second dialect or silently relax
      explicit restrictions.
  - id: AC-6
    requirement: "GOV-B is internally coherent as one semantic adoption unit."
    evidence_required: >-
      Protocol, Architect, Executor, implementation contract, task template, validator, and validator tests agree on decision
      ownership, scope/structure, LOCAL behavior, and normalization/default semantics with no contradictory intermediate stable state.
  - id: AC-7
    requirement: "The correction is subtraction-focused and bounded to reproduced GOV-A pressure points."
    evidence_required: >-
      Exact diff contains only authorized GOV-B semantic surfaces plus report evidence; no report/review sparsification, timing
      redesign, profile changes, PROGRAM delegation, new role/lifecycle/version/framework, external-repository change, or unrelated cleanup appears.
  - id: AC-8
    requirement: "The exact candidate is deterministically verified before review."
    evidence_required: >-
      python3 scripts/validate_skill_library.py and python3 -m unittest scripts/test_validate_skill_library.py PASS on the exact
      candidate, and existing Validate skill library GitHub Actions concludes success for that same candidate SHA before report publication.

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Resolve TASK-0020 revision 1 at the exact handoff base, require topology exactly {dev, main}, require main unchanged at the pinned stable revision, resolve accepted TASK-0019 evidence, and preflight all EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect the existing protocol/role/contract/template/validator/test patterns before choosing implementation HOW; preserve protocol v3 and the closed fifteen-skill taxonomy."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest coherent correction across only authorized GOV-B surfaces; verify the exact diff has no historical-artifact rewrite or out-of-scope semantic change."
      required: true
    - id: CHECK-4
      command_or_check: "Run python3 scripts/validate_skill_library.py and python3 -m unittest scripts/test_validate_skill_library.py against the exact implementation candidate; both must PASS."
      required: true
    - id: CHECK-5
      command_or_check: "Push the exact candidate to dev and require the existing Validate skill library GitHub Actions run for that exact candidate SHA to conclude success; do not modify the workflow merely to obtain PASS."
      required: true
    - id: CHECK-6
      command_or_check: "Publish report.yaml only after exact-candidate local and authoritative verification PASS, bind the candidate/run evidence, verify final topology and unchanged main, and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "Existing .github/workflows/validate-skill-library.yml on the exact pushed implementation candidate."
    expected_signal: "Validate skill library concludes success for the exact candidate SHA after validator and unit-test steps pass."

