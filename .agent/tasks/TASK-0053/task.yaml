acceptance_criteria:
  - id: AC-1
    requirement: "A fresh Executor inspects an existing target repository and its pinned/native toolchain before acquiring, scaffolding, generating, or substituting tooling."
    evidence_required: "Executor source text and focused doctrine regression cover Git state, manifests, lockfiles, package-manager/runtime markers, scripts, framework/codegen configuration, .gitignore, and native verification, with existing pinned/native commands taking precedence over accidental global/latest tooling."
  - id: AC-2
    requirement: "For greenfield/framework bootstrap, a fresh Executor fresh-resolves the current official scaffold/generator mechanism before manually recreating equivalent boilerplate."
    evidence_required: "Executor source plus version-agnostic cold-successor regression requires current official mechanism discovery and rejects handwritten equivalent baseline without concrete task-compatible justification."
  - id: AC-3
    requirement: "Existing repository authority and pinned tooling take precedence over remembered or globally installed latest tooling unless an upgrade is explicitly authorized."
    evidence_required: "Cold-successor regression for an existing pnpm-style repository proves package-manager marker/lock/scripts govern execution rather than ambient global/latest CLI choice."
  - id: AC-4
    requirement: "Commodity functionality is evaluated through existing/native/framework/ecosystem/mature OSS options before custom implementation."
    evidence_required: "Executor source and scenario G regression preserve reuse-first search precedence and require evidence to reject an available adequate option before custom rebuilding."
  - id: AC-5
    requirement: "Executor selects the least-persistent sufficient authorized acquisition mode and never infers machine-global mutation authority from ordinary target-task execution authority."
    evidence_required: "Source and scenarios E-F distinguish REPO_LOCAL, EPHEMERAL, GLOBAL, and CONTAINERIZED intent; one-shot tooling can remain ephemeral while Homebrew/global/PATH/runtime-manager/shared-infrastructure mutation requires separate machine/operator authority."
  - id: AC-6
    requirement: "Scaffold/generated output is inspected and required framework/tool-owned baseline is preserved before pruning or reshaping."
    evidence_required: "Executor source and scenario C require generated-diff inspection and preservation of necessary companion hygiene/configuration/lock/runtime/package-manager/verification surfaces."
  - id: AC-7
    requirement: ".gitignore is an explicit, bounded repository-construction hygiene concern rather than a universal ignore template."
    evidence_required: "Source/test semantics preserve accepted official defaults when applicable, permit only justified target additions, and explicitly avoid treating generated source/migrations/codegen output as automatically ignored."
  - id: AC-8
    requirement: "Restrictive task scope conflicting with required scaffold-generated companion files fails closed instead of silently deleting, omitting, or manually reconstructing the baseline."
    evidence_required: "Scenario C regression proves an omitted required generated .gitignore or equivalent companion surface becomes an authority/blocking gap with no implicit scope expansion."
  - id: AC-9
    requirement: "Declared locked dependency hydration is distinguishable from material dependency/tool-contract mutation without a Task Protocol change."
    evidence_required: "Executor source and scenario D allow authorized execution/verification to hydrate an already-declared locked contract while requiring escalation if the operation intentionally or unexpectedly changes manifests, lock resolution, dependency ranges, lifecycle policy, or persistent tool/codegen contract."
  - id: AC-10
    requirement: "The architecture remains bounded: exactly two roles, no language skills/agents, no router/taxonomy expansion, and no acquisition/generator subsystem."
    evidence_required: "Exact candidate diff proves only executor/SKILL.md and scripts/test_validate_skill_library.py changed; reuse-first, Task Protocol, router, taxonomy, dependencies, Runtime, and sibling repositories remain untouched."
  - id: AC-11
    requirement: "All current agent-skills repository-native validators/tests pass on the candidate and report states."
    evidence_required: "python3 scripts/validate_skill_library.py, python3 -m unittest scripts/test_validate_skill_library.py, python3 -m unittest scripts.test_reconcile_env, git diff --check, canonical TASK-0053 artifact validation, and actual TASK-0053 report validation all PASS on their relevant exact states."
  - id: AC-12
    requirement: "A cold-successor Executor answers repository-construction scenarios A-G deterministically from canonical semantics without version-sensitive command memorization."
    evidence_required: "Existing doctrine regression surface explicitly covers scenarios A-G and fails against the exact pre-change selected semantics before implementation, then passes against the candidate without hard-coded mutable CLI flags or release syntax."

