structure_authority:
  status: RESOLVED
  source: "Existing executor/SKILL.md execution owner plus existing semantic doctrine regressions in scripts/test_validate_skill_library.py"
  rationale: "Repository-construction behavior must be present on the mandatory Executor hot path. reuse-first already owns build-vs-buy precedence, and Task Protocol already owns material dependency authority. Extend only Executor semantics and the existing regression surface; do not create a new skill, validator, router case, acquisition framework, or protocol layer."

objective: "Make a fresh Executor construct or extend a repository by discovering and adopting the current ecosystem-native scaffold, toolchain, codegen, and mature OSS path; preserving required generated hygiene; and using the least-persistent authorized acquisition scope before resorting to custom implementation."

scope:
  required_changes:
    - "Fresh-bind TASK-0053 revision 1 at its exact handoff base. Before mutation, prove target identity, current remote dev/main, exact selected agent-skills authority, clean/divergence-safe local state, and all required current-phase execution capabilities including Agent Runtime/native_repository_execution."
    - "Refine executor/SKILL.md with a bounded repository-construction decision loop. The durable order starts by binding authority, classifying existing-repository versus greenfield/bootstrap work, and inspecting the repository/toolchain before acquisition or generation; subsequent discovery/acquisition/reuse steps are decision gates rather than ceremonial mandatory work when not applicable."
    - "For an existing repository, require inspection of Git state, manifests, lockfiles, package-manager markers/versions, runtime pins, scripts, framework configuration, generator/codegen configuration, .gitignore, and repository-native verification surfaces before acquiring or generating anything material. Existing repository-pinned tooling, scripts, generators, and verification commands take precedence over remembered, globally installed, or merely latest external tooling unless an explicit upgrade/change is authorized."
    - "For greenfield or framework bootstrap, require fresh resolution of the current official framework/toolchain documentation and supported scaffold/generator behavior before manually recreating equivalent boilerplate. Prefer existing target primitives, standard/native platform capability, official framework scaffold/generator, maintained ecosystem standard, mature admitted OSS, small local implementation, then custom framework only as a last resort justified by evidence. Do not hard-code transient current CLI flags into generic doctrine."
    - "Make build-vs-buy operational on normal Executor work: before custom implementation of commodity capability, evaluate existing repository implementation, standard library/native platform, framework/platform capability, maintained ecosystem tooling/library, and mature admitted OSS. Fast model-generated code is not itself justification for a custom replacement."
    - "Define least-persistent sufficient acquisition semantics without creating an acquisition subsystem: REPO_LOCAL for tooling that is part of the reproducible build/test/codegen contract; EPHEMERAL for one-shot scaffold/research/codegen or exact run-owned temporary tooling when persistence is unnecessary; GLOBAL only for stable cross-repository workstation primitives under separate machine/operator authority; CONTAINERIZED when tooling is materially heavy, conflicting, service-like, or benefits from isolation/reproducibility. Ordinary target-task authority must not silently grant Homebrew installs, npm/pnpm global installs, persistent uv tool installs, persistent go installs, PATH/shell-profile changes, runtime-manager changes, Docker-engine changes, persistent service mutation, or Agent Runtime/tunnel lifecycle mutation."
    - "After scaffold or generation, require inspection of the generated diff before pruning or reshaping it. Preserve required framework/tool-owned baseline and companion files where applicable, including hygiene/configuration/lock/runtime/package-manager/verification metadata. Manual recreation or deletion of accepted generated baseline requires concrete task-compatible justification."
    - "Make .gitignore an explicit repository-construction concern without introducing a universal mega-ignore. Preserve official framework defaults where applicable, then add only target-specific generated/local artifacts justified by the repository. Generated source, migrations, or codegen output are not automatically ignored; their source-control policy remains target-specific."
    - "If a restrictive task path/file scope excludes a companion file required by an accepted scaffold/generator baseline, fail closed with the existing authority/blocking mechanism and report the mismatch before destructive pruning, silent omission, or ad-hoc manual reconstruction. Discovery of generated output is not implicit scope expansion."
    - "Clarify in Executor semantics that dependency hydration executes an already-declared/pinned/locked dependency contract needed for authorized repository execution or verification and is not, by itself, dependency redesign. A command crosses into dependency/tool-contract mutation when it intentionally adds/removes/changes dependencies, ranges, resolutions, lifecycle execution policy, persistent codegen/tool contracts, or materially rewrites the declared/locked contract; such mutation requires the task authority already governed by Task Protocol. If a nominal hydration step unexpectedly rewrites the contract, stop and classify the gap instead of normalizing the rewrite."
    - "Add focused semantic regressions in scripts/test_validate_skill_library.py that fail against the exact pre-change selected semantics and pass against the candidate, covering cold-successor scenarios A-G: A) a new authorized framework repository fresh-resolves the official scaffold before handwritten skeleton/config; B) an existing pnpm repository follows packageManager/lock/scripts rather than a global/latest CLI; C) required scaffold .gitignore omitted by restrictive scope causes authority/blocking escalation rather than silent deletion; D) locked declared dependencies may be hydrated for authorized verification without being treated as redesign; E) a sufficient one-shot CLI uses a resolved ephemeral mode rather than persistent global installation; F) Homebrew/global/PATH or equivalent machine mutation requires separate machine/operator authority; G) existing framework/native capability solving a commodity need is evaluated before custom implementation unless evidence rejects it."
    - "Keep tests semantic and version-agnostic. Do not freeze current create-next-app flags, package versions, specific ecosystem release commands, or mutable external documentation syntax into generic doctrine. Reuse the existing validator/test architecture only."
    - "Run complete repository-native validation, validate the canonical task and actual report artifacts, prove exact candidate diff scope, publish the source-bearing implementation candidate non-force to dev, create the canonical report-only direct child, publish it non-force, fresh-prove remote refs and lineage, then stop at NEEDS_REVIEW without self-review or self-promotion."
  allowed_existing_files_or_components:
    - "executor/SKILL.md"
    - "scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0053/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Exactly two organizational roles remain ARCHITECT and EXECUTOR. Temporary frontend, UX/accessibility, performance, backend/data, or security specialization remains Executor specialization only."
  - "No Go Agent, Python Agent, TypeScript Agent, generic Go/Python/TypeScript reusable skill, language router case, or file-extension routing rule is introduced."
  - "Repository construction is reuse-first and ecosystem-native, but official/mature tooling is evidence to evaluate rather than blanket permission to expand task scope or mutate the workstation."
  - "Existing repository-pinned toolchain and repository-native commands win over remembered/global/latest tooling unless the task explicitly authorizes an upgrade or contract change."
  - "Least-persistent sufficient acquisition is preferred; ordinary target-task authority never silently grants machine-global or shared-operator-infrastructure mutation."
  - "Generated baseline is inspected before pruning. Required companion files outside restrictive task authority cause a blocking authority gap rather than silent omission or manual reconstruction."
  - ".gitignore hygiene is framework/target aware and minimal; no universal mega-ignore policy is introduced."
  - "Dependency hydration of an already-declared locked contract is distinguished from material dependency/tool-contract mutation without changing Task Protocol semantics."
  - "No new dependency, acquisition service, registry, download manager, package-manager abstraction, generator framework, template engine, daemon, watchdog, alternate runtime, or agent hierarchy is introduced."

forbidden_changes:
  - "Do not modify reuse-first/SKILL.md, protocols/TASK_PROTOCOL.md, .agent/case-router.yaml, README taxonomy, any skill other than executor/SKILL.md, or any sibling repository or evidence target repository such as phat-portfolio or ilets."
  - "Do not create a new skill, validator framework, repository generator, template engine, OSS registry/service, package-manager abstraction, dependency broker, download manager, global tool database, scaffold orchestration engine, alternate runtime, watchdog, daemon, or machine setup framework."
  - "Do not add Go/Python/TypeScript roles or skills, frontend/UX/performance/backend/security organizational roles, or language/file-extension router cases."
  - "Do not install or upgrade tools on the workstation, mutate Homebrew/global npm/pnpm/uv/go state, modify PATH or shell profiles, change runtime managers/Docker engine, start persistent services, or stop/restart Agent Runtime/tunnel as part of this task."
  - "Do not hard-code mutable framework/package versions, current scaffold flags, or current one-shot CLI syntax into reusable doctrine solely because they are valid today."
  - "Do not modify architect-profile, agent-runtime, agent-documents, agent-standards, phat-portfolio, ilets, branch topology, main, tags, releases, repository metadata, or unrelated files."

