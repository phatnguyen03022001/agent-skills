    - repository_content_read
    - repository_content_write
    - github_actions_run_read
  REVIEW:
    - exact_commit_report_resolution
    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "Program synthesis is reproducible without pretending task decomposition is uniquely deterministic."
    evidence_required: "Canonical semantics bind synthesis to immutable source identities, explicit policy, traceability/coverage constraints, and Architect judgment; no text claims one mathematically unique DAG."
  - id: AC-2
    requirement: "Generated program cannot become a second authority source."
    evidence_required: "Protocol/template explicitly exclude execution/lifecycle/mutation/promotion/release authority and contain no mutable execution state."
  - id: AC-3
    requirement: "Program coverage and graph integrity are mechanically bounded."
    evidence_required: "Validator/tests reject duplicate identities, broken dependencies, cycles, missing immutable synthesis identities, malformed required fields, and authority-like mutable state where applicable to the template contract."
  - id: AC-4
    requirement: "V1 stale handling is simple and safe."
    evidence_required: "Any material synthesis-input change invalidates the entire generated program and requires full regeneration; no incremental recomputation mechanism is introduced."
  - id: AC-5
    requirement: "Canonical task authority remains just-in-time and exact."
    evidence_required: "Generated items only inform Architect task materialization; multiple task artifacts may coexist; Executor remains bound to one exact canonical task/repository/base at a time."
  - id: AC-6
    requirement: "The correction is minimal and keeps the ecosystem target-first."
    evidence_required: "No cross-repo mutation, external dependency, orchestration subsystem, registry, new role/lane/protocol version, cost-routing expansion, archival expansion, or scale framework."
  - id: AC-7
    requirement: "GitHub-only execution remains sufficient for this task."
    evidence_required: "Implementation is performed through authorized GitHub content operations, then the existing single bounded validation workflow provides remote deterministic verification; no Mac/local capability is required."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh canonical GitHub truth before mutation. Require dev equals the exact handoff base, main equals 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, branches exactly {dev, main}, TASK-0011 revision 1 exists at that base, and required GitHub-only EXECUTION capabilities are currently available."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect current PROGRAM semantics, Architect skill, templates, validator/tests, and the existing validation workflow. Identify the minimum owner set; do not mutate every allowed file merely because it is listed."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest protocol/template/validator change satisfying AC-1..AC-6. Prefer full-regeneration semantics and direct validation over incremental machinery or new dependencies."
      required: true
    - id: CHECK-4
      command_or_check: "Before each GitHub write, refresh dev and require the expected parent identity. Keep main unchanged and create no branch."
      required: true
    - id: CHECK-5
      command_or_check: "After the implementation push, inspect the resulting exact diff and read the GitHub Actions run created by the existing validate-skill-library workflow for that implementation commit. Require its validation job PASS; do not create rerun/debug loops."
      required: true
    - id: CHECK-6
      command_or_check: "Perform exact semantic acceptance review against AC-1..AC-7, including explicit search for accidental authority duplication, mutable program state, unique-DAG claims, partial invalidation machinery, or cross-repository coupling."
      required: true
    - id: CHECK-7
      command_or_check: "Create TASK-0011/report.yaml as a separate report-only commit, then verify exact report parent/diff, final dev identity, unchanged main, and exact {dev, main} topology before returning NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "existing repository GitHub Actions validator/unit-test workflow + exact semantic/diff inspection"
    expected_signal: "Single bounded validation run PASS on the implementation commit and all AC-1..AC-7 satisfied without new orchestration machinery"

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions: []
execution_ready: true
