structure_authority:
  status: RESOLVED
  source: "existing executor/SKILL.md Execution bundles section"
  rationale: >-
    The protocol already defines EXECUTION BUNDLE as one bounded local/runtime invocation. The reproduced defect is
    Executor-side operational realization on Agent Runtime: one logical bundle was still fragmented into many terminal_exec
    calls. The smallest correction belongs only in the existing Executor bundle section; no protocol, runtime API,
    scheduler, task schema, or new artifact class is required.

objective: >-
  Make Agent Runtime realization of an existing EXECUTION BUNDLE mechanically unambiguous so one logical bounded
  deterministic bundle maps to one actual terminal_exec invocation containing its already-derived inner jobs, rather than
  one terminal_exec per job, while preserving every semantic return, authority, consequence-refresh, failure, publication,
  evidence-attribution, and lifecycle boundary.

scope:
  required_changes:
    - >-
      Update only executor/SKILL.md so when Agent Runtime is the selected local transport, one logical EXECUTION BUNDLE
      MUST be carried by exactly one terminal_exec invocation. The invocation may execute multiple ordered serial jobs and
      safe-parallel subsets internally and must return one compact attributable JOIN covering every included job.
    - >-
      State explicitly that issuing one terminal_exec per mechanically derivable check/job and returning to the
      model/controller after each result is not an EXECUTION BUNDLE and is non-compliant when no permitted semantic return
      condition exists between those jobs.
    - >-
      Require Executor to derive the bounded job set, ordering, guards, stop-on-failure behavior, and compact JOIN shape
      before invoking the bundle. Existing repository-owned verifiers should be reused when they cover jobs; otherwise a
      bounded one-shot command/script may compose existing deterministic commands without becoming durable orchestration.
    - >-
      Permit a logical deterministic suffix to be split into more than one Agent Runtime invocation only at an existing
      semantic/authority/capability/failure/terminal boundary or when one invocation cannot safely and truthfully carry the
      jobs because of a concrete bounded execution limit such as timeout, output bound, command-size/tool limitation, or a
      genuinely interactive/long-running requirement. Any such split must have a named reason; convenience or desire to
      inspect each successful result is insufficient.
    - >-
      Preserve terminal_start/terminal_poll/terminal_control only for genuinely interactive or long-running work and keep
      all current safe-parallel, serial mutation, consequence-refresh, partial-state, no-self-retry, and JOIN attribution rules.
    - >-
      Publish the exact semantic candidate and compact report-only child on dev. Do not promote main in this task; a later
      accepted promotion and architect-profile activation are required before the correction is ecosystem-active.
  allowed_existing_files_or_components:
    - "executor/SKILL.md"
    - ".agent/tasks/TASK-0039/report.yaml"

invariants:
  - "Task Protocol semantics remain unchanged: this task clarifies Executor realization of the already-defined one-invocation bundle contract."
  - "No semantic judgment boundary is removed, automated, or hidden inside a deterministic bundle."
  - "Fresh LOCAL_MUTABLE, REMOTE_MUTABLE, and RUNTIME evidence remains mandatory at the consequence boundary that depends on it."
  - "Bundle failure or ambiguous postcondition stops the remaining suffix, preserves truthful partial state, and returns attributable failure evidence without self-retry or self-chosen recovery."
  - "Commit, push, report publication, promotion, release, Architect review, authoritative verification, and continuation retain independent authority and required evidence even when already-authorized deterministic jobs are serialized inside one invocation."
  - "No Agent Runtime API, runtime intelligence, transaction/rollback guarantee, scheduler, queue, daemon, cache, registry, workflow engine, or persistent execution-plan artifact is added."
  - "Topology remains exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify protocols/TASK_PROTOCOL.md, verification, github-workflow, simplicity, architect, Case Router, model policy, task/report schema, or Agent Runtime."
  - "Do not add bundle_exec, run_repo_phase, apply_repo_bundle, DAG scheduling, programmatic-tool framework, worktree transaction framework, queue, daemon, cache, registry, database, or telemetry framework."
  - "Do not weaken mutable-evidence refresh, fail-closed behavior, per-job JOIN attribution, Git/publication proof, or lifecycle separation to reduce tool-call count."
  - "Do not require arbitrary rollback of partial local mutation; truthful stop-and-report semantics remain authoritative."
  - "Do not create/delete/rename branches, tags, releases, repository settings, or promote main."

