  REVIEW:
    - exact_commit_report_resolution

acceptance_criteria:
  - id: AC-1
    requirement: "Authority, capability, and consequence are explicitly distinct and compose without command-broker semantics."
    evidence_required: "Final protocol/role text states that generic local execution can satisfy ordinary engineering capability, capability does not grant authority, and command-specific governance is not required by default."
  - id: AC-2
    requirement: "Current-phase capability preflight remains meaningful without becoming executable-by-executable ceremony."
    evidence_required: "Final semantics preflight materially required capabilities before mutation but do not require every ordinary subcommand under an established generic execution capability to be separately declared or preflighted."
  - id: AC-3
    requirement: "Safety guards are consequence-based."
    evidence_required: "Final semantics distinguish loose investigation from persistent mutation and require fresh state/identity checks for operations capable of loss, overwrite, publish, external mutation, irreversible change, or material divergence, without using command names as the authority model."
  - id: AC-4
    requirement: "Trusted generic Terminal does not weaken repository, secret, injection, divergence, or release boundaries."
    evidence_required: "Exact inspection confirms repository/task/base binding, GitHub canonical truth, sibling isolation, secret discipline, external-text non-authority, Git/release authority, and cleanup safety remain materially intact."
  - id: AC-5
    requirement: "Behavioral policy and mechanical sandbox claims remain distinct."
    evidence_required: "Final text does not claim a normal shell is mechanically confined unless the selected surface actually enforces confinement."
  - id: AC-6
    requirement: "The correction is bounded and subtraction-compatible."
    evidence_required: "Implementation changes only the smallest necessary existing protocol/role files (README only if concretely necessary), introduces no new mechanism/schema/taxonomy/subsystem, passes repository-owned verification, and leaves main/topology unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start refresh canonical refs and require dev equals the exact TASK-0009 handoff base, main equals 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, branches exactly {dev, main}, TASK-0009 revision 1 resolves at the handoff base, and pinned self-hosting agent-skills fe3fd6de46c6e2220edbcadfb27f12c8dd23b2d6 is available. Preflight all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect exact current TASK_PROTOCOL.md plus Architect/Executor skills and identify only the clauses that materially need trust-model clarification. Preserve all unaffected v3 semantics."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest semantic correction. Review specifically for accidental command lists/taxonomies, new schemas, operator-path leakage, authority weakening, or mechanical-sandbox overclaim."
      required: true
    - id: CHECK-4
      command_or_check: "Run repository-owned artifact validation/unit verification appropriate to agent-skills plus git diff --check on the exact implementation. Require all deterministic checks PASS."
      required: true
    - id: CHECK-5
      command_or_check: "Perform exact semantic acceptance review against AC-1..AC-6 and exact diff scope; confirm DIRECT/micro-maintenance/rebinding/Git/release/lifecycle compatibility remains intact."
      required: true
    - id: CHECK-6
      command_or_check: "Commit/push implementation non-force to dev only after re-reading remote dev and requiring it still equals the exact execution base. Do not create branches or mutate main."
      required: true
    - id: CHECK-7
      command_or_check: "Create .agent/tasks/TASK-0009/report.yaml with exact capability/trust-model semantic evidence, verification results, diff/Git evidence, and no unsupported PASS claims. Commit/push separately, then verify report sole parent is implementation commit, report diff is report-only, dev equals report commit, main unchanged, branches exactly {dev, main}."
      required: true
  authoritative_verification:
    required: true
    mechanism: "repository-owned deterministic validation/tests + exact semantic/diff inspection"
    expected_signal: "All repository-owned checks PASS and AC-1..AC-6 are proven without protocol-v3 expansion"

