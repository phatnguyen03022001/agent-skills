structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "This correction changes existing Executor execution semantics and their existing regression verification only. It must not create a workspace registry, sync subsystem, runtime service, lifecycle, or new canonical owner."

objective: >-
  Close the GOV-E2 GitHub-first local-execution defect so GitHub remains canonical repository truth while any designated canonical local working copy used by Codex, Agent Runtime, Terminal, IDE, or another native execution surface is safely discovered, bound, protected, and reconciled to the final canonical GitHub ref before successful execution completion.

scope:
  required_changes:
    - "Preserve the invariant that authorized GitHub/remote state is canonical repository truth and every local checkout is subordinate execution state."
    - "When current target/operator authority designates a canonical local working copy, require Executor to discover and verify the actual local Git repository and exact owner/repo remote identity rather than infer that a path exists merely from repository naming."
    - "Before local mutation, require fresh remote truth plus safe local-state classification: matching repository/branch/base, clean/behind state when synchronization is needed, and protection of dirty/ahead/unknown operator-owned state."
    - "If the designated canonical local working copy is absent, permit creation from canonical GitHub truth only when the current execution surface and authority permit it and the destination is safely absent/empty; never overwrite, reset, delete, move, stash, or adopt unknown local state merely to create the checkout."
    - "After GitHub publication or any task-authorized canonical ref mutation, refresh canonical GitHub truth and safely reconcile the designated canonical local working copy to that final ref using non-destructive fast-forward/equivalent semantics when possible. Successful task closure must prove the designated local copy resolves the final canonical ref when such a local copy is required by current authority."
    - "If final reconciliation cannot be completed safely because of dirty/ahead/unknown state, missing capability, permission failure, stale remote state, or identity mismatch, preserve the local state and use the existing applicable fail-closed result; do not invent a new lifecycle state or silently claim completion."
    - "Disposable/reference/temporary checkouts must never substitute for required closure of a separately designated canonical local working copy. Temporary work remains cleanup-bound and non-authoritative."
    - "Keep this semantic and capability-oriented: no hard-coded operator path, no runtime-specific command recipe, and no requirement that phone-only/non-local executions create local clones."
    - "Update existing regression verification only as needed to prove these semantics without adding a new framework."
  allowed_existing_files_or_components:
    - "Executor governance semantics"
    - "existing agent-skills regression/validation companions"
    - "read-only exact GOV-E2 evidence from ilets and SF"

invariants:
  - "GitHub/authorized remote state remains SSOT; a local checkout never becomes competing authority."
  - "Executor discretion increases implementation freedom, not repository authority."
  - "Operator-owned dirty/ahead/unknown local state is preserved unless explicit authority permits a destructive operation."
  - "Local reconciliation is conditional on a designated canonical local working copy; phone-only or remote-only execution remains valid without manufacturing local state."
  - "No exact filesystem root, repository naming convention, vendor, tunnel, IDE, or model becomes generic agent-skills policy."
  - "No project registry, workspace database, sync daemon, state engine, orchestration layer, or new lifecycle is introduced."

forbidden_changes:
  - "Do not modify architect-profile, agent-runtime, agent-standards, agent-documents, ilets, SF, main, workflows, releases, or external repositories."
  - "Do not add a repo registry, path registry, workspace manifest, sync service, daemon, scheduler, watcher, state database, new lifecycle status, or runtime-specific integration."
  - "Do not make local existence or local reconciliation a prerequisite for executions whose current authority does not designate a canonical local working copy."
  - "Do not weaken remote exact-base, dirty/ahead-state protection, verification, scope, or material-authority gates."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
