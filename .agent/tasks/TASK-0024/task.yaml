acceptance_criteria:
  - id: AC-1
    requirement: "GitHub-first local execution is explicit and authority-correct."
    evidence_required: "Executor semantics state remote canonical truth, local subordinate execution state, exact local remote identity binding, and no inferred path authority."
  - id: AC-2
    requirement: "Pre-mutation local handling protects operator state without preventing safe execution."
    evidence_required: "Regression evidence distinguishes absent/empty, clean/behind, dirty, ahead, identity-mismatch and stale-remote cases with destructive handling forbidden unless separately authorized."
  - id: AC-3
    requirement: "Successful local execution closure reconciles the designated canonical working copy after publication."
    evidence_required: "Executor semantics require final remote refresh plus safe fast-forward/equivalent reconciliation and exact final-ref proof whenever current authority designates a canonical local working copy."
  - id: AC-4
    requirement: "Disposable execution cannot replace canonical-local closure."
    evidence_required: "Semantics preserve temporary cleanup behavior while making temporary/reference checkouts non-authoritative and insufficient substitutes for a separately designated canonical working copy."
  - id: AC-5
    requirement: "The correction remains minimal and generic."
    evidence_required: "No operator path, runtime-specific command sequence, registry/sync subsystem/new lifecycle, external mutation, workflow change, or phone-only regression is introduced; existing full agent-skills validation remains green."

