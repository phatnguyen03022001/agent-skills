acceptance_criteria:
  - id: AC-1
    requirement: "Exactly one reusable CASE exists: EXECUTE, with navigation-only authority and exactly one required capability key: executor."
    evidence_required: "Exact case artifact plus validator/test evidence and base-to-candidate diff."
  - id: AC-2
    requirement: "CASE remains mechanically separate from BINDING, SPECIALIZATION, MODE, TASK, and STATE, and workflow/lifecycle fields are rejected rather than interpreted."
    evidence_required: "Negative mutation tests for all forbidden dimensions/fields including next/retry/transitions and mode/state confusion."
  - id: AC-3
    requirement: "Case navigation references capability keys only and does not become a second owner/path/SHA registry or duplicate canonical skill semantics."
    evidence_required: "Schema/validator assertions and exact changed-surface review proving no owner/path/SHA/semantic bodies in the case artifact."
  - id: AC-4
    requirement: "Unknown/duplicate/empty/invalid case navigation fails closed deterministically using the existing validator/test surface."
    evidence_required: "Focused positive and negative tests plus full existing validator/unittest regression PASS."
  - id: AC-5
    requirement: "The 12-episode CR-00 pilot reconstructs EXECUTE routing from task identity plus EXECUTE -> executor and then existing task-declared requirements without whole-repository preload or moved authority."
    evidence_required: "Recomputed pilot matrix over the exact CR-00 corpus with exact source identities and no case-taxonomy expansion."
  - id: AC-6
    requirement: "The pilot retains at least 50% median routing-overhead reduction in artifact count or bytes relative to CR-00 observed routing and introduces no new material inference layer."
    evidence_required: "Mechanically recomputed median artifact/byte metrics compared with the accepted CR-00 baseline."
  - id: AC-7
    requirement: "No embedding, classifier, workflow engine, new role, new lifecycle, second capability registry, or unrelated reusable governance change is introduced."
    evidence_required: "Exact changed-path review, forbidden-pattern tests, full validator/unittest regression, and git diff --check."
  - id: AC-8
    requirement: "Implementation/report publication closes on dev with exact remote confirmation; main remains unchanged and topology remains exactly {dev, main}."
    evidence_required: "Exact implementation SHA, report SHA, independent remote-ref observations, unchanged main, final topology proof, and local==remote proof when executed in the designated local mirror."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-resolve TASK-0027 revision 1, exact base, TASK-0026 accepted review/baseline, pinned agent-skills stable authority, dev/main refs, and required local/publication capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Add focused tests first for canonical EXECUTE navigation and all forbidden/invalid shapes; prove the negative cases fail before implementing the minimum validator support."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused case-navigation tests, python3 scripts/validate_skill_library.py, python3 -m unittest scripts/test_validate_skill_library.py, and git diff --check on the exact candidate."
      required: true
    - id: CHECK-4
      command_or_check: "Recompute the exact 12-episode CR-00 pilot using canonical TASK-0026 baseline data and prove the EXECUTE navigation read set preserves >=50% median reduction in artifact count or bytes without new semantic authority."
      required: true
    - id: CHECK-5
      command_or_check: "Verify the exact candidate changed paths are limited to the one case-navigation artifact plus the smallest existing validator/test companions required for deterministic enforcement; no unrelated reusable authority changes."
      required: true
    - id: CHECK-6
      command_or_check: "Push exact candidate to dev, independently prove remote dev == candidate, publish report-only child, independently prove remote dev == report, require main unchanged/topology {dev, main}, reconcile local dev to final remote dev when local, then stop at NEEDS_REVIEW."
      required: true

  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

