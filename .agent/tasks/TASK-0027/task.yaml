structure_authority:
  status: RESOLVED
  source: "CR-00 accepted admission boundary"
  rationale: >-
    Materialize only the smallest reusable static CASE navigation contract proven by CR-00.
    Start with one evidence-backed hot-path case, EXECUTE, and validate the anti-state-machine
    boundary. Do not predeclare an ecosystem-wide taxonomy that the baseline did not prove.

objective: >-
  Materialize CR-01/02 minimum viable Case Router semantics in agent-skills: one machine-readable
  navigation-only CASE=EXECUTE entry that resolves to the existing executor capability key, plus
  deterministic validation proving CASE remains separate from binding, specialization, mode,
  task, and lifecycle state. Pilot it against the accepted CR-00 corpus without implementing a
  classifier, workflow engine, or embedding.

scope:
  required_changes:
    - "Add exactly one small reusable machine-readable case-navigation artifact at a repo-native location chosen by Executor. It must declare navigation authority only, not task/workflow authority."
    - "The initial admitted case set is exactly one case: EXECUTE. EXECUTE means an already-authorized task is entering Executor work. It does not mean NEW, CONTINUE, VERIFY, REVIEW, RED_TEAM, EVOLVE, BLOCKED, PASS, FAIL, or any execution surface."
    - "EXECUTE must route to exactly one existing generic capability key: executor. The case artifact must not contain repository paths, SHAs, owners, skill bodies, task fields, or duplicated capability-registry data. Exact owner/path resolution remains the responsibility of the external capability routing layer."
    - "Represent CASE as a navigation dimension only. The reusable contract must make CASE != BINDING != SPECIALIZATION != MODE != TASK != STATE mechanically enforceable."
    - "Extend the existing agent-skills validation/test surface minimally so the canonical case artifact is validated and malformed navigation contracts fail closed. Reuse existing validator/test machinery; do not create a second framework."
    - "Reject unknown case IDs and reject any attempt to add lifecycle/workflow fields such as next, retry, success, failure, terminal, transition, state, binding, specialization, mode, or task into a case entry."
    - "Reject duplicate case IDs, duplicate capability keys within a case, empty capability loads, unknown/non-canonical capability keys, and direct owner/path/SHA routing embedded in the case artifact."
    - "Pilot CASE=EXECUTE against all 12 accepted CR-00 episodes by reconstructing the navigation sequence from exact task identity plus EXECUTE -> executor, then task-declared execution requirements. Prove this does not move semantic authority and does not require whole-support-repository preload."
    - "Compare the pilot read set with CR-00 observed/minimal metrics. The reusable router is acceptable only if the 12-episode pilot preserves at least the CR-00 median 50% reducible routing-overhead target in artifact count or bytes and introduces no material extra routing inference."
    - "Keep embedding unimplemented. Record no semantic index, vector, similarity threshold, provider, cache, or retrieval store."
    - "Publish the exact implementation candidate and normal Executor report on dev only with independent remote SHA observation after each push; preserve main and topology exactly {dev, main}."

  allowed_existing_files_or_components:
    - "one new small case-navigation artifact"
    - "scripts/validate_skill_library.py"
    - "scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0026/case-routing-baseline.json as read-only pilot evidence"
    - ".agent/tasks/TASK-0027/task.yaml"
    - ".agent/tasks/TASK-0027/report.yaml"
    - "existing repository-native validation fixtures/helpers only when reuse is smaller than adding new machinery"

invariants:
  - "CASE is WHERE/which navigation context to load, not WHAT to implement and not WHAT HAPPENED."
  - "TASK owns WHAT, material boundary, and acceptance."
  - "BINDING owns NEW/CONTINUE semantics under the existing Task Protocol."
  - "SPECIALIZATION remains separate from CASE. Red-team, verifier, ecosystem-evolution, researcher, coder, and similar labels do not become case IDs merely because they affect execution behavior."
  - "MODE/execution surface remains separate from CASE. CHATGPT_GITHUB, CHATGPT_LOCAL, CODEX_CLOUD, CODEX_LOCAL, and AGENT_RUNTIME transport semantics must not appear as cases."
  - "STATE/results remain separate from CASE. PASS, FAIL, BLOCKED, NEEDS_REVIEW, REVERIFY_REQUIRED, terminal states, and transitions must not appear as cases."
  - "The initial reusable case set is intentionally only EXECUTE. Additional cases require later evidence/admission; absence is preferable to speculative taxonomy."
  - "The case artifact is a navigation projection over existing canonical capability authority; it grants no mutation, review, verification, promotion, release, or lifecycle authority."
  - "One case may name capability keys only. Owner/path/SHA resolution stays outside the case artifact."
  - "Embedding remains NOT_ADMITTED."
  - "GitHub remains canonical repository truth and physical topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not add REVIEW, VERIFY, DESIGN, PROGRAM, EVOLVE, PROMOTE, RELEASE, BOOTSTRAP, RED_TEAM, or any other speculative case in this task."
  - "Do not add next, retry, success, failure, terminal, transition, state, binding, specialization, mode, task, branch, repository, owner, path, revision, SHA, model, effort, controller, or transport fields to the case artifact."
  - "Do not create a classifier, intent model, fuzzy router, decision engine, state machine, next map, workflow engine, planner, orchestrator, registry, daemon, service, database, queue, scheduler, cache, persistent capsule, or second capability registry."
  - "Do not create embeddings, vectors, semantic indexes, retrieval stores, similarity search, embedding-provider integration, or derived authority caches."
  - "Do not duplicate or rewrite Architect, Executor, Task Protocol, verification, GitHub workflow, standards, documents, or runtime semantics inside the case artifact."
  - "Do not mutate agent-skills/main or any external repository."
  - "Do not create, rename, or delete branches."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

continuation_policy:
  mode: MANUAL
  stop_conditions:
    - BLOCKED
    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

