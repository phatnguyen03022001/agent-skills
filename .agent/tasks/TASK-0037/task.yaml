      Executor skill reinforces mandatory deterministic-boundary collapse and makes terminal_exec the preferred
      Agent Runtime carrier for bounded non-interactive work without changing the four-tool runtime surface.
    evidence_required: "Exact Executor skill diff plus current Agent Runtime surface identity proof."
  - id: AC-4
