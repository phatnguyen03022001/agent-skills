structure_authority:
  status: RESOLVED
  source: "existing Task Protocol execution semantics plus existing Executor Execution bundles section"
  rationale: >-
    The defect belongs to existing execution scheduling semantics. The smallest correction is wording inside
    the current Task Protocol and Executor skill. No new runtime capability, scheduler, state machine,
    framework, artifact class, or repository structure is authorized.

objective: >-
  Eliminate unnecessary model/runtime synchronization boundaries for deterministic pre-authorized work by
  making bounded execution bundling mandatory across the maximal contiguous mechanically derivable suffix,
  while preserving every semantic, authority, evidence-refresh, failure, publication, and lifecycle boundary.

scope:
  required_changes:
    - >-
      Update protocols/TASK_PROTOCOL.md so a consequence-boundary evidence refresh is explicitly an evidence
      obligation and not automatically a model/runtime handoff. Once all required semantic choices and current
      authority are resolved, Executor MUST execute the maximal contiguous mechanically derivable suffix as one
      bounded execution bundle. Serial internal phases remain valid where ordering or mutation requires them.
    - >-
      Define the exact conditions that require control to return to the model/controller: new material information,
      contradiction, missing or invalidated authority/capability, semantic gap requiring judgment, failed or
      ambiguous postcondition, or a terminal lifecycle result. A successful attributable JOIN must not be followed
      by re-reading or re-confirming unchanged immutable evidence merely for confidence.
    - >-
      Rewrite or clarify the canonical Executor flow so its sequential arrows describe logical procedure, not
      mandatory model/runtime round trips. Fresh LOCAL_MUTABLE, REMOTE_MUTABLE, and RUNTIME evidence required at a
      consequence boundary must still be refreshed at the correct point, but that refresh may occur as an internal
      job of the same bounded deterministic bundle when no semantic decision is needed between jobs.
    - >-
      Update executor/SKILL.md to reinforce the same rule in Executor-local behavior. When Agent Runtime is the
      selected local transport, prefer terminal_exec as the default carrier for bounded non-interactive deterministic
      bundles. Reserve terminal_start/terminal_poll/terminal_control for genuinely interactive or long-running work
      that cannot be truthfully completed as one bounded one-shot invocation.
    - >-
      Preserve existing safe-parallel rules: independent jobs may run in parallel, but the correction optimizes
      model/runtime synchronization count rather than maximizing concurrency. Conflicting writes, migrations,
      canonical ref/publication mutation, and final mutation gates remain serial internally where required.
    - >-
      Publish the exact semantic candidate and compact report-only child on dev. This task does not run the later
      cross-repository latency pilot; the first natural pilot is a separate task after this candidate is accepted.
  allowed_existing_files_or_components:
    - "protocols/TASK_PROTOCOL.md"
    - "executor/SKILL.md"
    - ".agent/tasks/TASK-0037/report.yaml"

invariants:
  - "No semantic judgment boundary is removed or automated away."
  - "Exact repository/task/base binding and phase capability preflight remain mandatory before mutation."
  - "Fresh mutable evidence remains mandatory at the consequence boundary whose truth depends on it."
  - "A bundle failure stops the deterministic suffix, preserves truthful partial state, returns attributable failure evidence, and does not self-retry or choose recovery."
  - "Commit, push, promotion, release, Architect review, authoritative verification, and continuation authority remain independent lifecycle/consequence boundaries exactly as currently governed."
  - "Execution bundles carry no new authority and create no durable scheduler, queue, cache, registry, daemon, workflow engine, transaction manager, or Agent Runtime intelligence."
  - "No rollback/atomicity guarantee is invented for Git or external side effects."
  - "Topology remains exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify agent-runtime or add a new Agent Runtime API such as bundle_exec/run_repo_phase/apply_repo_bundle."
  - "Do not add a DAG scheduler, programmatic-tool framework, speculative executor, worktree transaction framework, queue, daemon, cache, registry, database, or orchestration service."
  - "Do not weaken consequence-boundary refresh, fail-closed behavior, evidence attribution, mutation authority, publication proof, or lifecycle separation to reduce tool calls."
  - "Do not require rollback of arbitrary partial local mutation; stop and report truthful state instead."
  - "Do not modify verification, github-workflow, runtime, Case Router, model policy, task schema, report schema, or unrelated skills unless the task is revised."
  - "Do not create/delete/rename branches, tags, releases, repository settings, or promote main."

