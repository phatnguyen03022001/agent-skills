scope:
  required_changes:
    - >-
      Freshly re-resolve the exact TASK-0034 accepted review/report/candidate evidence in this new binding.
      Reuse its validator, 116-test, py_compile, git diff --check, scope, and counterfactual results only after
      confirming they cover the exact currently required correctness predicates and that governing/predicate
      semantics and relevant dependencies remain applicable.
    - >-
      Do not rerun acceptance-equivalent correctness verification merely because this is a new binding or
      promotion phase. If exact evidence identity drifts, a required predicate is uncovered/new/changed,
      relevant semantics/dependencies changed, stronger assurance is explicitly required, or contradiction
      appears, fail closed or perform only the newly required proof and report the named invalidation.
    - >-
      Immediately before mutation freshly prove current main/dev/topology, old-main ancestry, exact accepted
      candidate identity, and current promotion capability.
    - >-
      Execute one bounded deterministic consequence invocation with ordered serial phases:
      fresh guard -> exact non-force push of candidate to refs/heads/main -> fresh remote post-proof -> compact
      attributable JOIN. Guard failure/ambiguity means zero promotion mutation; successful push without exact
      post-proof is not success.
    - >-
      Publish only the compact TASK-0035 report on dev after promotion. Capture operational_timing under the
      existing protocol semantics if both boundaries are truthfully available.

