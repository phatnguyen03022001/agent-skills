    evidence_required: "Focused Case Router tests, full validator, full unittest regression, git diff --check, and exact changed-path proof on candidate bytes."
  - id: AC-3
    requirement: "Stable promotion is ancestry-safe and exact."
    evidence_required: "Fresh pre-promotion refs, merge-base/ancestor proof, non-force promotion, and post-promotion main == 4a063c41f429207577434600a3571dc17822cd78."
  - id: AC-4
    requirement: "No report/review/task-authority descendant becomes the stable main tip."
    evidence_required: "Exact post-promotion main SHA and comparison against TASK-0027 report/review and TASK-0028 planning commits."
  - id: AC-5
    requirement: "Promotion introduces no semantic expansion or embedding/router-v2 machinery."
    evidence_required: "No reusable file mutation in TASK-0028 and exact candidate boundary review."
  - id: AC-6
    requirement: "Support promotion remains separate from ecosystem activation."
    evidence_required: "Fresh proof architect-profile is unmodified by this task and report statement that authority-lock/activation remains pending."
  - id: AC-7
    requirement: "Final remote topology remains exactly {dev, main}; dev carries TASK-0028 report evidence while main equals the accepted candidate."
