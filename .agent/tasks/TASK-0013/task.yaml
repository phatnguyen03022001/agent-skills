  EXECUTION:
    - exact_remote_ref_read
    - repository_content_read
    - repository_content_write
    - github_actions_run_read
  REVIEW:
    - exact_commit_report_resolution
    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "Sufficient evidence causes a stop, not an open-ended search loop."
    evidence_required: "Canonical semantics require minimum authoritative evidence for current predicates and prohibit unrelated/duplicative gathering after sufficiency except explicit stale/contradiction/missing-proof/audit/risk triggers."
  - id: AC-2
    requirement: "Already-resolved immutable evidence is reusable without becoming hidden authority."
    evidence_required: "Canonical semantics permit same-binding reuse of exact immutable evidence while preserving mandatory refresh of mutable state at consequence boundaries and rejecting persistent caches/registries."
  - id: AC-3
    requirement: "Terminal Executor failure evidence is durable whenever authorized publication remains possible."
    evidence_required: "BLOCKED/capability/stale/reverify-class outcomes can and should produce the existing canonical report artifact when commit/push authority and capability exist; successful verification is not a prerequisite for truthful terminal reporting."
  - id: AC-4
    requirement: "Failure reporting does not manufacture success, review, or publication authority."
    evidence_required: "Verifier FAIL remains FAIL; Executor owns report only; missing report-write capability yields a truthful non-durable terminal result rather than a false canonical claim."
  - id: AC-5
    requirement: "New material paid consumption requires bounded authority."
    evidence_required: "Generic semantics distinguish cost-aware routing from spend authority, prohibit speculative new paid consumption, reuse existing authorized budget/envelope without redundant operator approval, and fail closed when paid authority is missing and no sufficient authorized alternative exists."
  - id: AC-6
    requirement: "DIRECT/micro-maintenance ceremony is changed only from reproduced evidence."
    evidence_required: "Executor documents whether current low-risk paths already avoid redundant ceremony; any mutation is the smallest compatible subtraction and no new lane/lifecycle is created."
  - id: AC-7
    requirement: "Correctness gates remain stronger than latency optimization."
    evidence_required: "Fresh mutable-state checks, exact lineage, required verification, safety, and target authority remain intact; only duplicate reads/execution and unauthorized spend are removed."
  - id: AC-8
    requirement: "Correction remains minimal and protocol-v3 compatible."
    evidence_required: "No new schema version/skill/service/registry/cache/orchestrator/cross-repo mutation; repository validation and tests PASS with exact diff limited to necessary authorized owners."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh canonical GitHub truth. Require dev equals exact TASK-0013 handoff base, main equals 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, topology exactly {dev, main}, TASK-0013 revision 1 exists at base, and required GitHub-only EXECUTION capabilities are currently available."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect only the current semantic owners needed for AC-1..AC-8: Task Protocol, Architect/Executor guidance, Implementation Report contract/template, and relevant validator/tests/workflow coverage. Reuse immutable evidence already resolved in the same binding instead of rereading it without trigger."
      required: true
    - id: CHECK-3
      command_or_check: "Reproduce the terminal-report semantic defect against current authority: prove whether successful-verification-only task wording can suppress canonical failed execution evidence despite available report publication authority."
      required: true
    - id: CHECK-4
      command_or_check: "Implement the smallest compatible corrections for evidence-sufficiency stop, same-binding immutable reuse, truthful terminal reporting, and bounded paid-consumption authority. Audit DIRECT/micro-maintenance and change only if a concrete redundant obligation is proven."
      required: true
    - id: CHECK-5
      command_or_check: "Review explicitly for accidental stale-state reuse, hidden caches, evidence downgrade, false PASS, report ownership drift, redundant operator approval, speculative paid spend, or new framework machinery."
      required: true
    - id: CHECK-6
      command_or_check: "Before each GitHub write, refresh dev and require expected parent identity. Keep main unchanged and create no branch."
      required: true
    - id: CHECK-7
      command_or_check: "After implementation publication, inspect exact implementation diff and use the existing repository validation workflow once as bounded remote proof if its current trigger/coverage supports the modified files. Require authoritative validation PASS for NEEDS_REVIEW; on validation FAIL, publish a truthful BLOCKED report if report publication remains authorized/capable, then stop."
      required: true
    - id: CHECK-8
      command_or_check: "Create TASK-0013/report.yaml as a separate report-only commit for NEEDS_REVIEW or any terminal blocking result when authorized/capable. Verify report parent/diff, final dev identity, unchanged main, and exact {dev, main} topology before return."
      required: true
  authoritative_verification:
    required: true
    mechanism: "existing repository validation workflow + exact semantic/diff inspection"
    expected_signal: "Protocol-v3-compatible operability correction PASS; terminal failure remains durably reportable and no latency/cost optimization weakens authority or evidence"

