  mode: MANUAL
  stop_conditions:
    - BLOCKED
    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

