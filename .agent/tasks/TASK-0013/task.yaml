authority_sources:
  - source: "Current informed maintainer objective: reduce avoidable Architect/Executor latency, duplicate evidence gathering, unnecessary paid/quota consumption, and chat-only failure state while preserving exact authority and verification strength."
    role: "Durable maintainer objective for low-human-loop, low-waste, fail-closed operation."
    precedence: 1
  - source: "phatnguyen03022001/agent-skills@533eaef0dbed13c5bbfdad1195218d8382a38e5c"
    role: "Current protocol-v3 authority, including risk-proportional lanes, cost-aware capability routing, report ownership, durable review, and verification semantics."
    precedence: 2
  - source: "Observed target-pilot failure class: an authorized implementation reached deterministic verification failure, but task wording allowed report publication only after PASS, leaving the blocking evidence non-durable and chat-bound."
    role: "Reproduced evidence that successful-result-only reporting can break successor reconstruction and fail-closed continuity."
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Existing Task Protocol plus Architect/Executor/Implementation Report owners; templates/tests only where required to pin compatibility."
  rationale: "This is a bounded semantic subtraction/hardening pass. No new lane, lifecycle, artifact class, registry, cache, service, schema version, or orchestration system is justified."

objective: >-
  Make protocol-v3 operation stop when sufficient evidence already exists, reuse already-resolved immutable evidence within the same exact binding, preserve truthful durable Executor terminal evidence on failure when publication capability/authority exists, and prevent unauthorized new paid consumption. Audit the DIRECT lane only for reproduced ceremony waste; change it only if current semantics demonstrably force redundant work beyond its stated low-risk purpose.

scope:
  required_changes:
    - >-
      Define an evidence-sufficiency stop rule: for the current decision or execution gate, gather the minimum authoritative evidence needed to prove every material predicate; once those predicates are proven, stop gathering unrelated or duplicative evidence. Expand only for stale mutable state, contradiction, missing required proof, explicit audit scope, or a newly triggered risk boundary.
    - >-
      Define exact immutable-evidence reuse within one active context/binding: when an immutable commit/blob/task/report/authority revision has already been resolved and its identity has not changed, reuse that evidence instead of rereading it merely for ceremony. This creates no persistent cache or cross-session authority. Mutable refs/state must still be refreshed at consequence-appropriate mutation/review/promotion/release boundaries.
    - >-
      Define truthful terminal Executor reporting: when execution stops with BLOCKED, STALE_STATE, AUTHORITY_REQUIRED, CURRENT_PHASE_CAPABILITY_UNAVAILABLE, REVERIFY_REQUIRED, or another existing terminal/blocking result, the Executor must publish the bounded report evidence when the exact task grants report commit/push authority and the current capability can safely do so. A task must not make report publication contingent on successful verification in a way that causes material failed execution evidence to exist only in chat. If report publication itself is unavailable or unauthorized, return the exact non-durable terminal result without falsely claiming canonical persistence.
    - >-
      Reuse the existing report/result vocabulary and artifact ownership if sufficient. Do not add a new lifecycle state or report type merely for failed verification. Update template/contract/validator only if current mechanics cannot represent truthful terminal failure without ambiguity.
    - >-
      Define generic paid-consumption authority: lowest-sufficient-cost routing does not authorize new paid consumption by itself. Do not activate a new paid service, exceed a target-owned budget/envelope, or incur material paid usage without existing target/task/operator authority covering that bounded consumption. Where such authority already exists, do not ask the operator again merely to be safe. If no sufficient authorized zero/covered-cost path exists and paid authority is missing, fail closed with the existing authority-required/blocking semantics rather than spending speculatively.
    - >-
      Keep quota/included-capacity evidence distinct from billing authority. Included/free quota may still be scarce; avoid repeated remote runs when narrower sufficient evidence exists. Do not invent pricing tables, billing state, account pools, quota registries, or spend databases.
    - >-
      Audit current DIRECT and Architect micro-maintenance semantics against the stated low-risk purpose. If existing semantics already permit appropriately small/reversible work without redundant evidence, record NO CHANGE for this subpoint. If a concrete redundant obligation is proven, make only the smallest compatible subtraction; do not create a new lane or weaken durable authority/review for normal BOUNDED/HIGH_ASSURANCE work.
    - >-
      Preserve exact-state correctness: do not remove required fresh-ref checks before consequential writes, exact report/review lineage, required native/remote evidence, or target-owned verification. The goal is to remove duplicate reads and unnecessary execution, not correctness gates.
    - >-
      Add or update narrow tests only where needed to mechanically pin terminal-report durability or prevent contradictory semantics. Prefer doctrine-only correction when current schemas already express the intended states.
    - >-
      Use the existing repository validation workflow as the bounded remote proof after implementation if current workflow coverage already includes the modified semantic owners; do not turn Actions into an iterative debugger.
    - >-
      Produce TASK-0013 Executor report in a separate report-only commit for both success and any terminal blocking result when publication authority/capability remains available, then stop for Governing Architect review or exact terminal handling.

  allowed_existing_files_or_components:
    - protocols/TASK_PROTOCOL.md
    - architect/SKILL.md
    - executor/SKILL.md
    - contracts/IMPLEMENTATION_REPORT.md
    - templates/report.yaml
    - templates/task.yaml
    - verification/SKILL.md
    - github-workflow/SKILL.md
    - README.md
    - scripts/test_validate_skill_library.py
    - scripts/validate_skill_library.py
    - .agent/tasks/TASK-0013/task.yaml
    - .github/workflows/validate-skill-library.yml
  expected_files_are_restrictive: true

invariants:
  - "Protocol remains version 3."
  - "GitHub remote remains canonical repository truth."
  - "No evidence-sufficiency rule may suppress a required fresh mutable-state check at a consequential boundary."
  - "Immutable-evidence reuse is context/binding-local convenience only; no persistent cache, registry, hidden authority, or cross-session memory is introduced."
  - "Executor failure evidence remains Executor-owned; Architect review remains Architect-owned."
  - "A failed verifier never becomes PASS and terminal-report durability never weakens fail-closed execution."
  - "Paid-cost preference never manufactures spend authority; existing bounded spend authority does not require redundant operator reapproval."
  - "Target repositories own budgets, provider constraints, pricing/economic assumptions, and exact verification requirements."
  - "GitHub Actions remains bounded proof, not a default iterative debugger."
  - "No new task lane, lifecycle state, artifact class, skill, schema version, service, orchestrator, registry, cache, queue, daemon, billing system, or quota database."
  - "Branches remain exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify architect-profile, agent-documents, agent-standards, agent-runtime, or any target product repository."
  - "Do not create a capability/evidence cache, persistent immutable-artifact cache, provider registry, pricing registry, spend ledger, quota database, billing service, account pool, credential broker, scheduler, queue, daemon, or workflow engine."
  - "Do not introduce new paid-service activation, provider configuration, secrets, accounts, pricing numbers, or billing APIs."
  - "Do not weaken exact-ref refresh where mutable state can invalidate authority or consequence safety."
  - "Do not weaken required report/review lineage or authoritative verification merely to reduce tool calls."
  - "Do not create another task/report/review artifact shape or lifecycle result unless current inspection proves protocol v3 cannot express the required terminal evidence; if so, return BLOCKED for revised authority instead."
  - "Do not change DIRECT simply because it looks verbose; require a reproduced redundant obligation first."
  - "Do not perform unrelated cleanup, taxonomy expansion, style-only rewrite, or broad framework redesign."

