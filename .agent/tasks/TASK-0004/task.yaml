structure_authority:
  status: RESOLVED
  source: "Existing 15-skill library, protocol-v3 task/report/templates, contracts, validator, and focused tests."
  rationale: "All required changes are bounded evolutions of existing owners. No new skill, role, protocol version, repository, orchestration layer, service, dependency, or workflow is required."

objective: "Perform one final long-horizon governance consolidation so agent-skills remains generic and reusable by many operators while supporting optional operator-specific preferences externally; process becomes proportional to risk, execution handoffs become compact authority locators, lifecycle/review/rebinding semantics become deterministic, Git policy becomes target-aware rather than hard-coded to one branch topology, external normative authority becomes immutable when used, evidence duplication is reduced, and mature governance defaults to preservation unless material evidence admits change."

scope:
  required_changes:
    - "Preserve TASK-0003 sequential multi-repository behavior while clarifying that newly edited self-hosting semantics remain non-authoritative during this execution; operate entirely under pinned d506f5caef3808fc2f7356172b5b648be78b628f authority."
    - "Add generic optional operator-profile support to Architect bootstrap. The profile location/content is supplied by the host/session/operator, never hard-coded into reusable governance. Treat it as durable preference/environment context, not target-repository factual or mutation authority; explicit current user decisions and target-repository canonical facts/task authority must not be silently overridden by a profile."
    - "Replace ambiguous 'self-contained execution handoff' guidance for PROMPT TO COPY with a compact authority-locator contract. Normal prompt content is target owner/repo, branch, exact task ID/revision/path, exact base HEAD, current phase when needed, and a concise instruction to resolve canonical authority/preflight/execute/report. Do not duplicate scope, invariants, forbidden changes, acceptance criteria, capabilities, Git/release authority, verification detail, or protocol boilerplate already available in canonical artifacts unless access to canonical authority is genuinely unavailable."
    - "Define Executor-binding terminal semantics separately from whole-task lifecycle. A binding may be released/rebound only after an explicit execution result/handoff ends current mutation authority and required evidence for that execution is finalized. NEEDS_REVIEW/REPORTED, BLOCKED, STALE_STATE, AUTHORITY_REQUIRED, CURRENT_PHASE_CAPABILITY_UNAVAILABLE, failed terminal execution, or completed execution may terminate the Executor binding when no mutation authority remains; none implies whole-task acceptance/promotion/release."
    - "Remove role contradiction around independent review. Keep exactly two organizational roles: Architect and Executor. The current governing Architect owns final ACCEPT/REJECT/REVISE judgment. Independent reviewer/red-team/verifier sessions are Executor specializations that produce advisory or designated verifier evidence; they do not become a second Architect or independently own product/governance acceptance. Preserve verifier-owned authoritative PASS/FAIL when a project explicitly designates such verification."
    - "Introduce risk-proportional execution lanes without creating another task schema or role: DIRECT for small reversible low-risk changes with clear authority and cheap verification; BOUNDED as the normal task→Executor→verify→Architect-review path; HIGH_ASSURANCE for materially consequential security/protocol/migration/irreversible/release-critical work requiring stronger independence/evidence as specified by the task. DIRECT must not bypass safety, target truth, explicit write authority, or required verification; HIGH_ASSURANCE must not become default ceremony."
    - "Generalize the existing Git workflow owner instead of adding a new skill. Support target-authoritative MAIN_ONLY, DEV_MAIN, and optionally activated DEV_STAGING_MAIN topologies. Never infer or create staging merely because it is supported. Repository-specific branch policy and exact live refs outrank generic defaults. Preserve backward compatibility for current dev/main repositories."
    - "Require any external repository used as normative execution authority to be resolved to an immutable revision before mutation, using existing authority-source/task mechanisms where sufficient. Current documentation, libraries, upstream repos, and examples used only as research/reference evidence need not become normative authority. Do not create a universal dependency registry."
    - "Reduce task/report context duplication. Keep unconditional protocol boilerplate in protocol, task-specific material authority in task.yaml, and evidence recorded once where practical. If introducing optional evidence IDs/references materially reduces repeated report prose, keep it backward-compatible with legacy inline evidence and do not require a new protocol version. Do not redesign canonical artifacts merely for aesthetics."
    - "Add a material-design-readiness gate for consequential implementation: Architect identifies applicable target product/design authority and resolves only material missing decisions before large or consequential coding. Trivial, mechanical, reversible, or well-specified work must not be forced through documentation ceremony. agent-documents remains the reusable owner of detailed documentation structure; do not duplicate that taxonomy here."
    - "Treat operator attention/manual labor as a constrained resource. When an available authorized agent/tool can safely perform an action, do not use the operator as a manual command/RPC bridge. Human input remains appropriate for unavailable capability, physical/local-only action that cannot be automated, unresolved product intent, destructive/irreversible authority, material paid-cost approval, or major informed trade-offs."
    - "Add stable/maintenance change-admission doctrine for mature governance. Absence of a material reproduced problem means NO CHANGE REQUIRED is valid and preferred. Admit governance modification only for evidence-backed defect, stale rule/external reality, recurring missing capability, security issue, compatibility failure, or material cost/usability/maintainability regression, or an explicit durable maintainer objective change. Preference, novelty, elegance, architectural fashion, and hypothetical future scale are insufficient authority. Corrective maintenance remains permitted and should use the smallest safe correction."
    - "Freeze the 15-skill taxonomy by default. A new skill is rejected unless repeated real use demonstrates a materially distinct recurring responsibility that cannot fit an existing owner cleanly; urgent security/correctness evidence may justify exceptional escalation. Do not encode an arbitrary numeric occurrence threshold as an absolute rule."
    - "Add deterministic regression coverage for all new semantics and the real failure modes motivating them: compact non-duplicative handoff, optional profile non-authority/no personal hardcoding, binding-terminal vs task-lifecycle separation, one current Architect acceptance owner, proportional lanes, target-aware branch topologies without implicit staging, immutable external normative authority, design-readiness proportionality, low human-in-loop, maintenance NO_CHANGE admission, and frozen 15-skill default."
  allowed_existing_files_or_components:
    - README.md
    - architect/SKILL.md
    - executor/SKILL.md
    - simplicity/SKILL.md
    - gap-analysis/SKILL.md
