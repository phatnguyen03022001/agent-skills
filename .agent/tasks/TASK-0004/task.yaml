acceptance_criteria:
  - id: AC-1
    requirement: "Optional operator-profile bootstrap is supported generically without hard-coded personal identity/location/defaults, and profile preferences cannot silently replace target-specific factual/task authority."
    evidence_required: "Architect/protocol wording plus focused positive/negative tests including rejection/absence of personal hardcoding."
  - id: AC-2
    requirement: "PROMPT TO COPY is explicitly an authority locator rather than duplicated authority and normal content is bounded to target/task/base/phase plus concise resolve-preflight-execute-report instruction."
    evidence_required: "Architect/protocol/README wording and tests that require non-duplication guidance for canonical task fields."
  - id: AC-3
    requirement: "Executor-binding terminal semantics are distinct from whole-task lifecycle and allow safe sequential rebinding only after mutation authority ends and required execution evidence is finalized."
    evidence_required: "Executor/protocol wording and focused tests for NEEDS_REVIEW/REPORTED and blocked/stale/authority-required terminal binding outcomes without implying acceptance/promotion/release."
  - id: AC-4
    requirement: "Exactly one current governing Architect owns ACCEPT/REJECT/REVISE; independent reviewer/red-team/verifier sessions are Executor specializations/evidence producers and do not create a second Architect role."
    evidence_required: "Architect/protocol/contracts wording and tests eliminating contradictory independent-Architect acceptance semantics while preserving designated verifier evidence."
  - id: AC-5
    requirement: "DIRECT, BOUNDED, and HIGH_ASSURANCE lanes make process proportional to risk without creating another role/schema/framework or letting DIRECT bypass authority/safety."
    evidence_required: "Architect/protocol wording and positive/negative tests covering low-risk direct eligibility, normal bounded flow, and high-assurance triggers."
  - id: AC-6
    requirement: "Existing Git workflow owner supports target-authoritative MAIN_ONLY, DEV_MAIN, and explicitly activated DEV_STAGING_MAIN without implicit staging or branch creation, while existing dev/main behavior remains compatible."
    evidence_required: "github-dev-main-workflow/protocol wording and focused compatibility/negative tests."
  - id: AC-7
    requirement: "External repositories used as normative authority require immutable revision binding before mutation; ordinary research/reference sources remain references and do not acquire authority."
    evidence_required: "Protocol/Architect wording and tests distinguishing normative immutable authority from non-normative research/reference evidence."
  - id: AC-8
    requirement: "Canonical task/report evidence is materially less duplicative where safe, without breaking legacy valid v3 artifacts or creating parallel compact schemas."
    evidence_required: "Template/protocol changes only if justified, legacy fixture PASS, and tests proving either evidence-reference compatibility or equivalent deduplication semantics."
  - id: AC-9
    requirement: "Consequential implementation receives a material-design-readiness check while trivial/reversible/well-specified work is not forced through documentation ceremony."
    evidence_required: "Architect/gap/design/protocol wording and focused proportionality tests."
  - id: AC-10
    requirement: "Operator attention/manual labor is treated as constrained; available authorized agent capability is preferred over manual operator RPC, with explicit bounded exceptions."
    evidence_required: "Architect/protocol wording and deterministic marker tests."
  - id: AC-11
    requirement: "Stable/maintenance governance defaults to preservation and NO CHANGE REQUIRED absent material evidence, while evidence-backed corrective maintenance remains authorized through the normal smallest-safe-correction path."
    evidence_required: "Architect/simplicity/protocol/README wording and tests for admitted vs non-admitted change rationales."
  - id: AC-12
    requirement: "The 15-skill taxonomy is closed by default; new-skill admission requires materially distinct recurring real evidence or exceptional correctness/security justification, with no arbitrary universal numeric threshold."
    evidence_required: "Architect/simplicity/README/validator tests plus exact count of 15 SKILL.md files."
  - id: AC-13
    requirement: "TASK-0003 sequential multi-repository semantics remain intact and existing valid protocol-v3 single-repository workflows remain valid."
    evidence_required: "Existing TASK-0003 and legacy v3 regression suites remain GREEN."
  - id: AC-14
    requirement: "Exact final implementation HEAD passes repository-native verification, exact-SHA verification resolution, py_compile, diff checks, scope inventory, and adversarial inspection with no unauthorized mutation."
    evidence_required: "Exact commit/tree/diff identities and recorded verification results against the exact final_execution_head."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Before first mutation refresh GitHub truth and require repository exactly phatnguyen03022001/agent-skills, branch dev, live HEAD equal exact handoff base_head, main equal d506f5caef3808fc2f7356172b5b648be78b628f, branch set exactly {dev, main}, pinned authority d506f5caef3808fc2f7356172b5b648be78b628f, and required EXECUTION capabilities currently available."
      required: true
    - id: CHECK-2
      command_or_check: "Use causal TDD for governance/validator behavior: add focused failing tests first for AC-1 through AC-13 before corresponding production-governance changes; preserve a clear RED→GREEN evidence chain. Do not manufacture TDD for pure wording where no deterministic test can meaningfully fail, but every machine-checkable contract change must have causal RED."
      required: true
    - id: CHECK-3
      command_or_check: "python3 scripts/validate_skill_library.py"
      required: true
    - id: CHECK-4
      command_or_check: "python3 -m unittest scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-5
      command_or_check: "python3 -m py_compile scripts/validate_skill_library.py scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-6
      command_or_check: "git diff --check"
      required: true
    - id: CHECK-7
      command_or_check: "Run one bounded adversarial audit over the exact final implementation focused on authority duplication, accidental personal hardcoding, role inflation, lane bypass, ambiguous terminal/rebind state, implicit staging, mutable external normative authority, compatibility regression, governance churn incentives, and new-framework creep. Close all material findings or report BLOCKED/NEEDS_REVISION rather than self-accept."
      required: true
    - id: CHECK-8
      command_or_check: "Inspect exact base..final_execution_head diff/tree and prove only authorized paths changed; exactly 15 SKILL.md files remain; no new dependency/workflow/branch/main/tag/release/metadata/other-repository mutation occurred; no hidden nested skill/new top-level directory exists; local hygiene is clean or safely retained with bounded evidence."
      required: true
  authoritative_verification:
    required: true
    mechanism: "Resolve the repository-native Validate skill library workflow result for the exact final_execution_head after implementation push; require validator and unittest job success on that exact SHA."
    expected_signal: "Exact final_execution_head has a successful native validation run whose checked-out commit identity equals final_execution_head; no later dev mutation is treated as verified by that run."

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions: []
execution_ready: true
