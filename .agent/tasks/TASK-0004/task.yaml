invariants:
  - "Operate this entire self-hosting execution under pinned pre-task authority d506f5caef3808fc2f7356172b5b648be78b628f. TASK-0003 implementation on dev is accepted prior content/baseline evidence, not governing self-hosting authority for TASK-0004."
  - "Target only phatnguyen03022001/agent-skills on dev. main remains read-only during execution."
  - "Keep protocol_version exactly 3 and preserve existing valid v3 artifacts/workflows unless an additive backward-compatible optional field is strictly necessary."
  - "Keep exactly 15 top-level skills; create no sixteenth or nested hidden skill."
  - "Keep the library generic/public-reusable. Do not hard-code phatnguyen03022001/architect-profile, MacBook/M3 details, operator identity, personal model defaults, personal paths, secrets, or personal branch preferences into reusable governance."
  - "Do not create a universal founder/business operating system. Product marketing, sales, pricing, growth, legal, and personal preferences remain outside agent-skills unless a future independently evidenced engineering boundary requires otherwise."
  - "Do not create a new organizational role. Architect and Executor remain the only organizational roles."
  - "Do not create a new protocol version, alternate task-lite/task-compact schema, program authority artifact, state service, orchestrator, scheduler, queue, registry, database, workflow engine, launcher, distributed lock, or transaction framework."
  - "Preserve one active repository binding at a time and repository-local task/report/review/verifier/promotion/release lineage."
  - "Maintain GitHub remote truth as canonical Git state; local state remains an execution copy and local divergence is never silently promoted to authority or destroyed."
  - "Process must be proportional to risk: low-risk work must not inherit high-assurance ceremony, and high-risk work must not silently downgrade required evidence."
  - "A mature stable governance system may correctly conclude NO CHANGE REQUIRED; maintenance mode prevents speculative churn but never forbids evidence-backed corrective maintenance."

forbidden_changes:
  - "No mutation of agent-standards, agent-documents, agent-runtime, architect-profile, or any target product repository."
  - "No main mutation, promotion, tag, release, repository metadata mutation, or branch creation during TASK-0004 execution."
  - "No dependency additions or package-manager changes."
  - "No .github/workflow mutation unless an existing workflow is concretely proven unable to verify the authorized change; if so stop BLOCKED for Architect revision rather than broadening scope."
  - "No new skill, new role, new protocol version, new top-level directory, new orchestration/runtime subsystem, or provider-specific execution policy."
  - "No hard-coded operator-profile repository/URL, machine specification, secret, model/provider default, or personal operating preference."
  - "No mandatory staging branch and no implicit branch creation."
  - "No broad rewrite of all skills merely to normalize prose/style. Unchanged skills remain unchanged unless a required invariant has a concrete owner there."

