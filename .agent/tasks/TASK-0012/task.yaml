authority_sources:
  - source: "Current informed operator objective that all target work use the cheapest sufficient authorized capability/evidence path, degrade or fall back cleanly when quota/tool availability changes, avoid paid/limited plugins when unnecessary, and work well both with ChatGPT+GitHub only and with optional Mac/local/Codex capability."
    role: "Durable maintainer objective: make reusable execution routing cost-aware and environment-adaptive without creating provider/account orchestration or weakening required evidence."
    precedence: 1
  - source: "phatnguyen03022001/agent-skills@1361908ae49d9bdf067e61530d080111cc0ae55b"
    role: "Current protocol-v3 authority, including authority/capability/consequence separation, current-phase preflight, least-powerful sufficient surface, GitHub workflow discipline, and generated PROGRAM non-authority semantics to evolve compatibly."
    precedence: 2

structure_authority:
  status: RESOLVED
  source: "Existing protocols/TASK_PROTOCOL.md plus role-local architect/executor and github-workflow guidance, with repository tests only where needed to pin the semantic boundary."
  rationale: "This is a bounded reusable routing correction. No new task schema, provider registry, account registry, billing service, quota database, plugin manager, workflow engine, or new skill is justified."

objective: "Define protocol-v3-compatible capability routing that starts from required semantic capability and required evidence, filters candidate execution surfaces by current authority and sufficiency, then selects the lowest sufficient expected cost/resource burden. Define bounded fallback, degraded-mode, and blocking behavior when tools, quota, rate limits, or paid capacity are unavailable, while keeping provider/account availability runtime evidence rather than persistent authority and keeping target-specific budgets in target-owned documentation/configuration."

scope:
  required_changes:
    - "Define provider-neutral routing order: identify the semantic capability and evidence requirement first; resolve currently available candidate surfaces at the relevant phase; reject surfaces lacking authority or sufficient evidence; among remaining candidates choose the lowest sufficient expected cost/resource burden, with fewer context transfers and lower consequence preferred when materially equivalent."
    - "Clarify that cheapest/free is never allowed to weaken correctness, acceptance evidence, safety, exact identity, or required native/remote verification. A more expensive/limited surface is justified only when cheaper eligible surfaces are materially insufficient."
    - "Define availability and quota as runtime evidence, not durable authority. Known installation, historical availability, configured provider identity, or a previous preflight does not prove current availability after material environment/quota change."
    - "Define fallback semantics: when the selected surface becomes unavailable or quota-limited, attempt only an already-authorized candidate that still satisfies required capability/evidence; otherwise use an explicitly permitted degraded mode if current task/target acceptance allows it, or fail closed with the existing capability-unavailable/blocking semantics. Fallback never manufactures authority or silently lowers required evidence."
    - "Explicitly reject provider/account rotation as a generic quota-evasion or scaling primitive. Multiple legitimate accounts/environments may be selected only when current authority and provider rules permit that identity for the work; reusable governance must not create account pools, rotation logic, credential brokers, quota evasion, or identity registries."
    - "Keep actual project budgets, allowed paid services, provider constraints, SLO/cost envelopes, and deployment economics target-owned. agent-skills owns only generic routing semantics; architect-profile may own operator preferences/environment context; agent-runtime remains only an optional capability surface."
    - "Preserve the existing task capability_requirements shape as semantic requirements. Do not persist volatile provider availability, account identity, remaining quota, pricing snapshots, or mutable routing state in task.yaml or program.generated.json merely to implement this correction."
    - "Clarify verification reuse: prefer one repository-owned deterministic verifier invoked through the cheapest sufficient surface; local shell, Codex, Agent Runtime, and GitHub Actions should call the same verifier when feasible rather than create divergent verification logic. GitHub Actions remains a remote evidence boundary when required, not the default iterative debugger."
    - "Keep mobile/ChatGPT+GitHub-only operation first-class: no rule may make Mac, Agent Runtime, Codex, or local shell mandatory unless the exact task/target materially requires a native capability unavailable from GitHub/ChatGPT."
    - "Keep protocol version 3 and existing PROGRAM/task/report/review/continuation/Git/release authority semantics unchanged except for the minimum routing wording needed."
    - "Add or update repository tests only as needed to mechanically pin the new doctrine and prevent accidental provider registries, account rotation semantics, evidence downgrades, or mandatory-local assumptions."
    - "Use the existing bounded GitHub Actions workflow as the single remote deterministic verification boundary after implementation is pushed; do not modify the workflow unless current inspection proves the authorized semantic files are not already covered."
    - "Produce TASK-0012 Executor report in a separate report-only commit and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - protocols/TASK_PROTOCOL.md
    - architect/SKILL.md
    - executor/SKILL.md
    - github-workflow/SKILL.md
    - README.md
    - scripts/test_validate_skill_library.py
    - scripts/validate_skill_library.py
    - .agent/tasks/TASK-0012/task.yaml
    - .github/workflows/validate-skill-library.yml
  expected_files_are_restrictive: true

invariants:
  - "Protocol remains version 3."
  - "GitHub remote remains canonical repository truth."
  - "Authority, capability availability, consequence, evidence sufficiency, and cost/resource preference remain distinct concepts."
  - "Required evidence and safety outrank cost minimization; FREE/QUOTA/PAID status never creates or removes authority by itself."
  - "Provider/account availability remains runtime evidence; no provider registry, account registry, quota database, billing service, credential broker, account rotation system, scheduler, queue, daemon, workflow engine, or central orchestrator is introduced."
  - "Target repositories own actual budgets and provider-specific product/deployment constraints."
  - "Mac, Agent Runtime, Codex, and local shell remain optional unless exact target/task authority materially requires their capability."
  - "GitHub Actions is not made a mandatory dev loop or iterative debugger."
  - "program.generated.json remains authority NONE and contains no mutable provider/quota/account state."
  - "Branches remain exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify agent-documents, agent-standards, agent-runtime, architect-profile, or any target product repository."
  - "Do not add prompt/transcript archival semantics or tooling in this task."
  - "Do not add scale-trigger semantics in this task."
  - "Do not add actual pricing tables, provider-specific quota numbers, billing APIs, paid-service accounts, secret handling machinery, account pools, account rotation, credential brokers, or provider failover services."
  - "Do not use multiple accounts to bypass provider rate limits, quotas, restrictions, billing controls, or terms."
  - "Do not add a persistent capability/provider registry, availability database, quota cache, scheduler, retry engine, workflow orchestrator, or cross-repository mutable state."
  - "Do not add a new task field/schema merely for cost-class uniformity unless current inspection proves the existing semantic requirements cannot express the bounded routing rule; if a schema change becomes materially necessary, return BLOCKED for revised authority."
  - "Do not modify program.generated.json shape merely to add cost metadata in this task."
  - "Do not add a new skill or expand the closed 15-skill taxonomy."
  - "Do not change GitHub Actions behavior unless current inspection proves the existing workflow cannot verify authorized files; workflow mutation requires revised authority."
  - "Do not perform unrelated cleanup or style-only rewrites."

