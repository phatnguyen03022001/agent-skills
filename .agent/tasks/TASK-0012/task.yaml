acceptance_criteria:
  - id: AC-1
    requirement: "Routing begins from semantic capability and evidence, not provider identity."
    evidence_required: "Canonical semantics resolve required capability/evidence first, then current candidate surfaces, authority/sufficiency filtering, and finally lowest sufficient cost/resource selection."
  - id: AC-2
    requirement: "Cost optimization cannot downgrade required engineering proof."
    evidence_required: "Canonical wording states that cheaper/free surfaces cannot weaken correctness, safety, exact identity, acceptance evidence, or required native/remote verification."
  - id: AC-3
    requirement: "Quota/tool failure has bounded fallback semantics."
    evidence_required: "Unavailable or quota-limited surfaces fall back only to currently available authorized sufficient candidates; otherwise explicitly permitted degraded mode or existing fail-closed capability/blocking result is required."
  - id: AC-4
    requirement: "Provider/account limits do not create account-orchestration machinery."
    evidence_required: "No account/provider registry, rotation, credential broker, quota DB, or limit-evasion semantics; multiple legitimate identities never become a generic scaling primitive."
  - id: AC-5
    requirement: "Ownership remains federated and target-first."
    evidence_required: "agent-skills owns generic routing only; target owns actual budgets/provider constraints; profile may supply preferences/environment context; runtime remains optional capability."
  - id: AC-6
    requirement: "Verification stays single-source and environment-adaptive."
    evidence_required: "Guidance prefers one repository-owned verifier reused by available surfaces; Actions remains bounded remote evidence rather than mandatory iterative development; mobile ChatGPT+GitHub remains sufficient when native capability is not required."
  - id: AC-7
    requirement: "Correction remains minimal and protocol-v3 compatible."
    evidence_required: "No new schema/skill/dependency/service/registry/orchestrator/cross-repo mutation; repository validator/tests pass and exact diff touches only necessary authorized owners."
  - id: AC-8
    requirement: "GitHub-only execution is sufficient for TASK-0012."
    evidence_required: "Implementation uses authorized GitHub content operations and exactly the existing bounded validation workflow for remote deterministic verification; no Mac/Agent Runtime/Codex is required."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh canonical GitHub truth. Require dev equals the exact TASK-0012 handoff base, main equals 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, topology exactly {dev, main}, TASK-0012 revision 1 exists at base, and all required GitHub-only EXECUTION capabilities are currently available."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect current Task Protocol capability semantics, Architect/Executor surface selection, github-workflow verification guidance, relevant README/test doctrine, and workflow trigger coverage. Select the minimum semantic owner set; allowed scope is not a requirement to touch every file."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest provider-neutral cost/quota/fallback routing correction satisfying AC-1..AC-7. Prefer doctrine plus narrow regression tests over new schema or runtime machinery."
      required: true
    - id: CHECK-4
      command_or_check: "Review explicitly for accidental evidence downgrade, provider/account registry semantics, quota-evasion logic, mandatory-local/Codex/runtime assumptions, duplicated verifier logic, or target-budget ownership leakage."
      required: true
    - id: CHECK-5
      command_or_check: "Before each GitHub write, refresh dev and require expected parent identity. Keep main unchanged and create no branch."
      required: true
    - id: CHECK-6
      command_or_check: "After implementation push, inspect exact implementation diff and the single GitHub Actions run created by the existing validate-skill-library workflow for that exact implementation SHA. Require Validate and Unit tests PASS, attempt 1 unless GitHub itself proves an infrastructure-only retry is unavoidable; do not use rerun/debug loops."
      required: true
    - id: CHECK-7
      command_or_check: "Perform exact semantic acceptance review against AC-1..AC-8, then create TASK-0012/report.yaml as a separate report-only commit. Verify report parent/diff, final dev identity, unchanged main, and exact {dev, main} topology before returning NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "existing repository GitHub Actions validator/unit-test workflow + exact semantic/diff inspection"
    expected_signal: "Single bounded implementation validation run PASS and AC-1..AC-8 satisfied without provider/account orchestration or evidence downgrade"

