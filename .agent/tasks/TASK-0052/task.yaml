    role: "Owns Executor-specific restrictive execution, local hygiene, and safety boundaries; current semantics protect filesystem cleanup but do not explicitly establish the required process/resource ownership invariant."
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Existing executor/SKILL.md Local Hygiene/Restrictive Execution ownership and existing doctrine regression surface in scripts/test_validate_skill_library.py"
  rationale: "Keep the rule in the existing Executor owner and extend only the existing semantic regression test surface. No Task Protocol, validator-core, router, Runtime, language-skill, or new framework change is required."

objective: "Make Executor process/resource cleanup fail closed on positive current-task ownership and explicitly exclude shared execution substrate from ordinary target-task cleanup authority, while preserving legitimate task-owned cleanup and separately authorized infrastructure maintenance."

scope:
  required_changes:
    - "Fresh-bind TASK-0052 revision 1 at its exact handoff base and prove current remote dev/main, selected agent-skills authority ancestry, clean target identity, and required execution capabilities before mutation."
    - "Refine executor/SKILL.md in the existing restrictive-execution/local-hygiene boundary so a process, service, container, or other execution resource may be terminated or lifecycle-mutated only when ownership by the current authorized task/run is positively established and current task authority permits that cleanup."
    - "Preserve legitimate cleanup of positively task-owned children, descendants, test servers, and explicitly task-owned local services/containers when the active task permits it."
    - "State that Agent Runtime, the secure tunnel, execution transport/controller ancestors, and other shared operator execution infrastructure are not task-owned merely because they carry, support, block, or appear related to the current target task. Ordinary target-task authority therefore does not authorize signaling, stopping, restarting, or reconfiguring them."
    - "Make unknown PID, PGID, process-tree, process-name, port, service, container, or equivalent ownership fail closed. Broad process-name/tree/port cleanup mechanisms may only act on a target set whose current-task ownership is already positively proven; matching or apparent relevance is not ownership proof."
    - "Preserve a separate authority path: an explicitly authorized infrastructure-maintenance task may govern bounded Agent Runtime/tunnel lifecycle action. Do not encode an absolute never-terminate-Runtime rule."
    - "Add a bounded semantic regression in the existing scripts/test_validate_skill_library.py doctrine-test surface covering: A) exact task-owned PID/PGID cleanup may be allowed; B) an unknown process occupying a port must not be signaled; C) ordinary target work must not stop/restart Agent Runtime or tunnel; D) a separately authorized bounded Runtime-maintenance task resolves that separate authority instead of inheriting the ordinary-target prohibition blindly."
    - "Run complete repository-native validation, validate the actual report, publish the implementation candidate non-force to dev, create a report-only direct child, publish it non-force, fresh-prove exact lineage/refs, then stop at NEEDS_REVIEW without self-approval."
  allowed_existing_files_or_components:
    - "executor/SKILL.md"
    - "scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0052/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Process/resource cleanup is an authority-and-ownership semantic boundary, not a sandbox, executable blacklist, host confinement mechanism, or hostile-code defense."
  - "Positive ownership by the current authorized task/run plus task cleanup authority is required before Executor termination or lifecycle mutation of an execution resource."
  - "Positively task-owned children, descendants, test servers, and explicitly task-owned services/containers remain eligible for bounded cleanup."
  - "Shared execution substrate is not task-owned by use, ancestry, port occupancy, process naming, apparent fault relevance, or because it supports the active task."
  - "Unknown ownership fails closed; broad process-name, tree, PID/PGID, port, service, or container matching is never a substitute for positive ownership proof."
  - "Separately authorized infrastructure maintenance remains possible and must resolve its own exact authority before bounded Runtime/tunnel lifecycle action."
  - "Exactly two organizational roles remain Architect and Executor. No language-specific role or reusable Go/Python/TypeScript skill is introduced."
  - "Selected/current Agent Runtime child/session process-group isolation remains unchanged; no Runtime or tunnel implementation change is authorized."

forbidden_changes:
  - "Do not modify protocols/TASK_PROTOCOL.md, .agent/case-router.yaml, README taxonomy, any skill other than executor/SKILL.md, or any sibling repository."
  - "Do not create Go, Python, or TypeScript skills or roles, language router cases, or language-specific process-cleanup policy."
  - "Do not modify agent-runtime or tunnel source/configuration, and do not add a Runtime watchdog, supervisor, kill interceptor, self-defense daemon, process manager, PID registry, ownership database, policy engine, sandbox, or equivalent machinery."
  - "Do not blacklist kill, pkill, killall, python, bash, or other executables as the enforcement model."
  - "Do not broaden ordinary target-task authority into shared infrastructure maintenance and do not make shared infrastructure absolutely untouchable under separately authorized maintenance authority."
  - "Do not add a new validator solely for this semantic rule, new organizational role, dependency, top-level ownership boundary, router case, unrelated cleanup, word-count cleanup, taxonomy refactor, branch, tag, release, or repository metadata change."

