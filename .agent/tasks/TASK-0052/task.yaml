acceptance_criteria:
  - id: AC-1
    requirement: "Executor may terminate or lifecycle-mutate an execution process/resource only when ownership by the current authorized task/run is positively established and current task authority permits cleanup."
    evidence_required: "Executor source text plus focused doctrine regression explicitly encode positive current-task/run ownership and cleanup-authority preconditions."
  - id: AC-2
    requirement: "Legitimate task-owned descendant and local-resource cleanup remains allowed."
    evidence_required: "Source and cold-successor regression prove that a task-started server with exact PID/PGID ownership, its descendants, and explicitly task-owned services/containers remain eligible for authorized cleanup."
  - id: AC-3
    requirement: "Ordinary target-task authority excludes shared execution substrate from cleanup/lifecycle authority."
    evidence_required: "Source and cold-successor regression explicitly cover Agent Runtime, secure tunnel, transport/controller ancestors, and other shared operator execution infrastructure, including the case where they appear to cause task problems."
  - id: AC-4
    requirement: "Unknown ownership fails closed."
    evidence_required: "Focused regression proves that a process occupying a needed port without positive current-task ownership is not signaled or treated as task-owned."
  - id: AC-5
    requirement: "Broad cleanup mechanisms do not become ownership proof."
    evidence_required: "Source/test review proves process-name, tree, PID/PGID, port, service, container, pkill-style, or equivalent broad selection is permitted only after the selected target set is positively proven task-owned."
  - id: AC-6
    requirement: "Separately authorized infrastructure maintenance remains possible."
    evidence_required: "Source and cold-successor regression prove an explicitly authorized bounded Runtime-maintenance task resolves its separate authority rather than being blocked by an absolute never-touch-Runtime rule."
  - id: AC-7
    requirement: "The architecture remains bounded to existing owners."
    evidence_required: "Exact candidate diff proves only executor/SKILL.md and the existing doctrine test file changed; two-role semantics, 15-skill taxonomy, router, Task Protocol, Runtime source, and language-skill absence remain unchanged."
  - id: AC-8
    requirement: "All current agent-skills native validators/tests required by repository authority pass."
    evidence_required: "python3 scripts/validate_skill_library.py, python3 -m unittest scripts/test_validate_skill_library.py, python3 -m unittest scripts.test_reconcile_env, git diff --check, and actual task/report artifact validation all PASS on the relevant exact states."
  - id: AC-9
    requirement: "A fresh Executor reading canonical authority answers the bounded cold-successor scenarios consistently without a new behavioral framework."
    evidence_required: "Existing doctrine regression surface explicitly proves scenarios A-D and fails if the rule permits unknown/shared cleanup, forbids legitimate task-owned cleanup, or makes Runtime maintenance absolutely impossible."

