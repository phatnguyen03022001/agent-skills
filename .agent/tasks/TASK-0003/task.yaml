structure_authority:
  status: RESOLVED
  source: "Existing Architect/Executor skills, Task Protocol, README, validator, tests, and canonical v3 task/report machinery at d506f5caef3808fc2f7356172b5b648be78b628f."
  rationale: "Sequential rebinding is a bounded evolution of existing repository-binding semantics. It does not require a new role, skill, protocol version, task schema, orchestrator, registry, queue, database, or cross-repository authority artifact."

objective: "Evolve protocol v3 so a ChatGPT Architect or Executor chat may work across multiple repositories sequentially while preserving exactly one active repository binding at a time, fresh repository-local task/handoff/base authority for every rebind, independent evidence/review/promotion lineage per repository, and backward compatibility for existing single-repository v3 workflows."

scope:
  required_changes:
    - "Replace permanent one-session-one-repository Architect semantics with one-active-target-at-a-time semantics. Architect may switch repositories only after explicitly identifying the next owner/repo, refreshing canonical GitHub truth, and discarding previous repository-specific assumptions."
    - "Permit an Executor chat to be reused across repositories only sequentially. The current task/repository binding remains immutable while active; rebinding requires the prior execution to be terminal/finalized and requires a fresh exact repository-local task, handoff, branch, and base identity."
    - "Preserve repository-local authority: authority for repository A never grants authority for repository B, and report/review/verifier/promotion/release lineage remains independent for each repository."
    - "Define cross-repository PROGRAM only as Architect/operator presentation for an ordered set of repository-local tasks. PROGRAM must not become a universal task authority, persisted shared mutable lifecycle object, orchestrator, transaction, registry, queue, scheduler, or database."
    - "Align TASK LAUNCH presentation with the operator-facing fields Chat, Executor, Model, Effort, Progress, and concise explanation, followed separately by a self-contained PROMPT TO COPY; presentation remains non-authoritative and non-persisted."
    - "Allow concrete program progress such as 'Program 2/4 · agent-standards · execution' while forbidding fake percentages when no real denominator exists."
    - "Preserve generic least-powerful-sufficient execution-surface selection, low human-in-the-loop behavior, and bounded cost/quota discipline without hard-coding personal machines, Codex/Luna, tunnel names, or provider-specific defaults into reusable governance."
    - "Add focused TDD/validator coverage for repository switching/rebinding, authority non-carryover, program non-authority, task-launch presentation, and backward compatibility."
  allowed_existing_files_or_components:
    - README.md
    - architect/SKILL.md
    - executor/SKILL.md
    - protocols/TASK_PROTOCOL.md
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
  expected_files_are_restrictive: true

invariants:
  - "Operate this self-hosting execution entirely under pinned pre-task authority d506f5caef3808fc2f7356172b5b648be78b628f; newly edited semantics are not authority during this execution."
  - "This execution targets only phatnguyen03022001/agent-skills on dev."
  - "Keep protocol_version exactly 3 and preserve existing valid single-repository v3 behavior."
  - "Exactly one repository binding may be active for a given Architect or Executor execution context at a time."
  - "Repository switching/rebinding is sequential, explicit, fail-closed, and never carries Git/task/capability/promotion/release authority across repositories."
  - "Every new repository binding requires fresh repository-local task identity, branch identity, handoff, and exact base HEAD."
  - "PROGRAM is presentation/orchestration context only and never an authority source or shared mutable lifecycle object."
  - "There remain only two organizational roles: Architect and Executor; reviewer/verifier/red-team/debugger/researcher/coder remain Executor specializations."
  - "Keep exactly the current 15 top-level skills."
  - "Do not hard-code operator-specific Mac paths, machine specs, Codex/Luna, tunnel names, or provider/model defaults into reusable governance."
  - "Do not introduce speculative staging behavior; branch creation is not authorized by this task."
  - "Do not mutate agent-standards, agent-documents, or agent-runtime during this execution."

forbidden_changes:
  - "Do not create a sixteenth skill, new protocol version, alternate task schema, universal multi-repository task, program authority artifact, orchestrator, scheduler, queue, database, registry, workflow engine, distributed lock, transaction mechanism, launcher framework, or extra organizational role."
  - "Do not create branches or mutate main."
  - "Do not promote, tag, publish a release, or mutate repository metadata."
  - "Do not add dependencies."
  - "Do not modify .github/workflows/validate-skill-library.yml unless a concrete blocker proves it necessary; if required, stop as BLOCKING because workflow mutation is not authorized."
  - "Do not modify templates unless existing canonical envelopes are proven incapable of expressing the required fresh repository-local binding; if so stop as BLOCKING for Architect revision rather than broadening scope."
  - "Do not modify agent-standards, agent-documents, or agent-runtime."

gap_policy:
