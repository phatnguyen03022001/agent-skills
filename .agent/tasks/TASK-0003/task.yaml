acceptance_criteria:
  - id: AC-1
    requirement: "Architect semantics allow sequential repository switching in one conversation while enforcing exactly one explicit active target and fresh GitHub truth before repository-specific work."
    evidence_required: "Architect skill/protocol wording plus focused validator/unit tests including rejection of ambiguous simultaneous target semantics."
  - id: AC-2
    requirement: "Executor semantics allow sequential rebinding only after the prior execution is terminal/finalized; an active task/repository binding remains immutable."
    evidence_required: "Executor skill/protocol wording plus focused positive and negative tests."
  - id: AC-3
    requirement: "Authority cannot carry from repository A to repository B; every rebind requires fresh repository-local task/handoff/branch/base identity."
    evidence_required: "Protocol/Executor wording and tests proving missing/fresh identity behavior fails closed."
  - id: AC-4
    requirement: "Report, review, verifier, promotion, and release lineage remain independent per repository."
    evidence_required: "Protocol wording and focused assertions that no cross-repository lineage shortcut is introduced."
  - id: AC-5
    requirement: "PROGRAM is presentation only for ordered repository-local tasks and creates no universal task authority, shared mutable state, or orchestration framework."
    evidence_required: "Architect/protocol/README wording and negative validator/test assertions for forbidden authority/framework concepts."
  - id: AC-6
    requirement: "TASK LAUNCH supports Chat, Executor, Model, Effort, Progress, concise explanation, then separate self-contained PROMPT TO COPY, without becoming persisted authority."
    evidence_required: "Architect skill/protocol/README wording and focused tests."
  - id: AC-7
    requirement: "Existing valid single-repository protocol-v3 workflows remain valid and unchanged in effective semantics."
    evidence_required: "Backward-compatibility tests using existing valid v3 artifacts plus validator PASS."
  - id: AC-8
    requirement: "No new role, skill, dependency, protocol version, template, workflow, branch, staging machinery, runtime, orchestrator, queue, registry, database, or cross-repository authority artifact is introduced."
    evidence_required: "Exact base..final diff/tree inventory and validator/test assertions."
  - id: AC-9
    requirement: "The exact final implementation HEAD passes repository-native verification and only authorized paths changed."
    evidence_required: "Validator, unit tests, py_compile, git diff --check, exact changed-path inventory, exact final HEAD, and clean final checkout evidence."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Before first implementation mutation, prove repository_content_write, exact_remote_ref_read, and native_verification_execution are currently available; verify live repository == phatnguyen03022001/agent-skills, branch == dev, live HEAD == handoff base_head, and branch set remains exactly {dev, main}."
      required: true
    - id: CHECK-2
      command_or_check: "Use TDD: add focused failing tests first for Architect sequential switch, Executor terminal rebind, authority non-carryover, fresh repository-local binding identity, PROGRAM non-authority, TASK LAUNCH fields/progress, and legacy single-repository v3 compatibility; capture causal RED before production-governance edits."
      required: true
    - id: CHECK-3
      command_or_check: "python3 scripts/validate_skill_library.py"
      required: true
    - id: CHECK-4
      command_or_check: "python3 -m unittest scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-5
      command_or_check: "python3 -m py_compile scripts/validate_skill_library.py scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-6
      command_or_check: "git diff --check"
      required: true
    - id: CHECK-7
      command_or_check: "Inspect exact base..final_execution_head diff and prove only authorized paths changed; exactly 15 SKILL.md locations remain; no dependency/workflow/branch/main/tag/release/metadata mutation occurred; no other repository was mutated; final checkout/local hygiene is clean or safely retained with bounded evidence."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

