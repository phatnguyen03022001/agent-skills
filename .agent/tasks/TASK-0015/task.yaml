acceptance_criteria:
  - id: AC-1
    requirement: >-
      Executor procedure captures started_at_utc after exact binding resolution and immediately before capability preflight,
      and captures terminal_decision_at_utc at terminal decision before report publication, whenever a trustworthy current UTC
      clock is available at those boundaries.
    evidence_required: "Exact executor/SKILL.md diff and boundary-semantics audit"
  - id: AC-2
    requirement: >-
      New reports governed by the corrected semantics include operational_timing when both trustworthy boundary timestamps
      were captured; omission is allowed only for unavailable/untrustworthy timing and partial/invented/reconstructed or
      commit-derived timing is forbidden.
    evidence_required: "Exact Executor/report-contract/template consistency audit"
  - id: AC-3
    requirement: >-
      Backward compatibility is preserved: historical and existing protocol-v3 reports without timing remain valid, timing
      has exactly two RFC 3339 UTC fields, no duration field is stored, timing remains non-authoritative, and queue/approval
      latency remains distinct from Executor processing time.
    evidence_required: "Backward-compatibility, field/non-authority, and latency-boundary audit"
  - id: AC-4
    requirement: >-
      Revision-3 implementation changes only executor/SKILL.md, contracts/IMPLEMENTATION_REPORT.md, and templates/report.yaml;
      accepted terminal identity semantics and all unrelated governance remain unchanged.
    evidence_required: "Exact base-to-candidate changed-file and semantic-scope audit"
  - id: AC-5
    requirement: >-
      Executor publishes report_revision 2 at .agent/tasks/TASK-0015/report.yaml as a report-only direct child of the verified
      correction candidate and stops at NEEDS_REVIEW with main unchanged.
    evidence_required: "Exact candidate/report parentage, report revision, and final-ref evidence"

