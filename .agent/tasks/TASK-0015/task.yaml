structure_authority:
  status: RESOLVED
  source: "TASK-0015 revision-1 review plus existing agent-skills ownership boundaries"
  rationale: >-
    Revision 1 already established acceptable terminal identity semantics and the compatible timing field shape.
    This revision changes only forward timing-capture behavior in Executor procedure/report semantics so new reports
    actually produce audit evidence when a trustworthy current clock is available. The start boundary is after exact
    task binding is resolved and immediately before capability preflight, avoiding a circular requirement to know the
    task timing rule before canonical task resolution.

objective: >-
  Correct TASK-0015 revision 1 so optional protocol-v3 timing schema remains backward-compatible while forward
  collection is deterministic: newly produced Executor reports capture started_at_utc after exact task binding is
  resolved and immediately before capability preflight, and capture terminal_decision_at_utc when the terminal task
  result is reached before report publication, whenever a trustworthy current UTC clock is available at those boundaries.
  Omit the entire timing block only when trustworthy timing cannot be obtained. Preserve the already-acceptable terminal
  identity semantics.

scope:
  required_changes:
    - >-
      In executor/SKILL.md, add the smallest forward timing-capture procedure: after the exact task/repository/base binding
      has been resolved and immediately before capability preflight, capture started_at_utc from a trustworthy current UTC
      clock when the current surface provides one; when the Executor reaches its terminal task result, before report
      publication, capture terminal_decision_at_utc from a trustworthy current UTC clock.
    - >-
      In executor/SKILL.md, require a newly produced report to include operational_timing when both timestamps were
      truthfully captured. If a trustworthy current clock is unavailable at either required boundary, omit the entire
      operational_timing block rather than inventing, approximating, partially populating, reconstructing, or deriving
      either timestamp from Git commit times.
    - >-
      In contracts/IMPLEMENTATION_REPORT.md, distinguish schema compatibility from forward collection: historical and
      existing protocol-v3 reports without operational_timing remain valid, but new reports governed by this accepted
      semantics include the two-field block whenever trustworthy timestamps were captured at both boundaries; omission
      is valid only when trustworthy timing was unavailable for the attempt.
    - >-
      Define started_at_utc as the post-binding/pre-preflight operational start boundary. Approval-to-start or queue latency
      remains separately derivable from repository lifecycle evidence and MUST NOT be conflated with Executor processing time.
    - >-
      Keep operational_timing non-authoritative operational telemetry. It cannot affect PASS, quality, acceptance,
      authority, capability, identity, independence, lifecycle, promotion, release, or performance compliance.
    - >-
      Keep the timing shape exactly started_at_utc and terminal_decision_at_utc as RFC 3339 UTC. Elapsed duration remains
      derived and MUST NOT be stored as elapsed_seconds or another canonical duration field.
    - >-
      Update the comment/guidance in templates/report.yaml only as needed to reflect that the block is backward-compatible
      optional/unavailable-clock omittable but forward-captured when trustworthy timing exists. Do not add fields.
    - >-
      Preserve revision-1 terminal identity changes in protocols/TASK_PROTOCOL.md, architect/SKILL.md, and executor/SKILL.md
      without redesigning or changing their accepted identity semantics.
    - >-
      Verify the exact correction candidate, publish report_revision 2 by updating the existing canonical report path as
      a report-only direct child, and stop at NEEDS_REVIEW.
  allowed_existing_files_or_components:
    - executor/SKILL.md
    - contracts/IMPLEMENTATION_REPORT.md
    - templates/report.yaml
    - .agent/tasks/TASK-0015/task.yaml
    - .agent/tasks/TASK-0015/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "protocol_version remains 3; no protocol-version bump"
  - "Exactly two organizational roles remain Architect and Executor"
  - "Revision-1 terminal identity semantics remain unchanged"
  - "PROMPT TO COPY remains unchanged and does not absorb terminal identity"
  - "Exact operator-specific footer punctuation remains outside agent-skills"
  - "Historical/existing protocol-v3 reports without timing remain valid; no backfill"
  - "New reports include timing when both trustworthy boundary timestamps are available"
  - "started_at_utc is post-binding and immediately pre-capability-preflight; it is not queue/approval latency"
  - "Clock unavailability permits omission of the entire timing block; partial, invented, reconstructed, or commit-derived timing is forbidden"
  - "Timing contains exactly started_at_utc and terminal_decision_at_utc; no stored derived duration"
  - "Timing remains non-authoritative operational telemetry"
  - "No telemetry service, database, registry, dashboard, collector, workflow engine, runtime feature, or orchestration mechanism"
  - "Continuation, promotion, release, review, capability, Git-authority, and lifecycle semantics remain unchanged"

forbidden_changes:
  - "Modify protocols/TASK_PROTOCOL.md or architect/SKILL.md semantically in revision 3"
  - "Change revision-1 terminal identity semantics"
  - "Modify architect-profile, agent-standards, agent-documents, agent-runtime, or any target product repository"
  - "Hard-code the operator-specific middle-dot footer or other exact visual rendering into agent-skills"
  - "Add elapsed_seconds, token counts, cost accounting, model latency, tool-call counts, provider telemetry, or timing-quality scoring"
  - "Create metrics/telemetry infrastructure, database, registry, dashboard, cron, workflow, or orchestrator"
  - "Backfill or rewrite historical TASK-0001 through TASK-0014 artifacts"
  - "Modify dependencies, package manifests, GitHub Actions, CI workflows, branch topology, tags, releases, or main"
  - "Create a branch, PR, issue, tag, or release"

