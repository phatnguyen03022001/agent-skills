    - remote_ref_read

acceptance_criteria:
  - id: AC-1
    requirement: "Exact TASK-0032 review is ACCEPTED and names candidate c4d6d4e7e7ecde58444d8da7bd5e26f8735562a3; prior correctness evidence remains applicable with no identified predicate/identity invalidation."
    evidence_required: "Exact immutable review/candidate/evidence resolution plus explicit invalidation check."
  - id: AC-2
    requirement: "No acceptance-equivalent full correctness suite is rerun solely for promotion; prior validator/116-test/py_compile/diff-check evidence is reused."
    evidence_required: "Report states reused immutable evidence and names any newly run proof; zero unexplained full-suite rerun."
  - id: AC-3
    requirement: "Immediately before promotion, main is exactly db03b97b5c42c9c64ad8dce76bc694530e41a206, topology is exactly {dev, main}, old main is an ancestor of the exact candidate, and current promotion capability is available."
    evidence_required: "Fresh consequence-boundary refs/topology/ancestry/capability proof."
  - id: AC-4
    requirement: "One bounded deterministic consequence invocation performs guard -> exact non-force promotion -> fresh post-proof and returns an attributable JOIN; guard failure means zero promotion mutation."
    evidence_required: "Compact bundle/JOIN evidence with exact stage/result and fresh post-promotion main identity."
  - id: AC-5
    requirement: "agent-skills/main equals c4d6d4e7e7ecde58444d8da7bd5e26f8735562a3 after promotion; only TASK-0033 report evidence is then published on dev; topology remains {dev, main}."
    evidence_required: "Fresh remote refs/topology, exact report commit, and final local hygiene evidence."
  - id: AC-6
    requirement: "The execution provides truthful existing-schema operational timing when both required boundaries are available, without making timing part of correctness or acceptance."
    evidence_required: "Optional operational_timing block with exactly started_at_utc and terminal_decision_at_utc, or explicit omission if either boundary was unavailable."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-resolve exact task/base, TASK-0032 accepted review/candidate, current refs/topology, existing immutable correctness evidence, required current capabilities, and whether any correctness predicate/identity dependency is invalidated."
      required: true
    - id: CHECK-2
      command_or_check: "Reuse unchanged TASK-0032 validator/116-test/py_compile/diff-check correctness evidence; do not rerun it absent a named invalidation/new predicate."
      required: true
    - id: CHECK-3
      command_or_check: "Run one bounded deterministic consequence bundle: fresh main/dev/topology and ancestry guard; if all guards pass, exact non-force push candidate to refs/heads/main; fresh-prove main equals candidate; return compact JOIN."
      required: true
    - id: CHECK-4
      command_or_check: "Publish compact TASK-0033 report on dev, then freshly prove final dev/main/topology and close local hygiene."
      required: true

