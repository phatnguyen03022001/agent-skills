objective: >-
  Promote the exact accepted TASK-0032 candidate c4d6d4e7e7ecde58444d8da7bd5e26f8735562a3
  to agent-skills/main with no acceptance-equivalent reverification ceremony, reusing unchanged immutable
  correctness evidence and collapsing the deterministic promotion consequence into one bounded runtime
  invocation, then publish compact execution evidence on dev.

scope:
  required_changes:
    - >-
      Reuse the exact TASK-0032 ACCEPTED immutable candidate correctness evidence for
      c4d6d4e7e7ecde58444d8da7bd5e26f8735562a3. Do not rerun validator, the 116-test suite,
      py_compile, or git diff --check solely because promotion begins.
    - >-
      Before promotion, freshly prove only consequence-sensitive/current predicates required for the
      mutation: exact current main/dev/topology, accepted review/candidate identity, old-main ancestry,
      and current promotion capability. If candidate/review/governing identity has drifted, a newly
      required correctness predicate is not covered by prior evidence, stronger assurance is explicitly
      required, or contradiction appears, fail closed or perform only the newly required proof rather
      than silently reusing unrelated evidence.
    - >-
      Execute the deterministic promotion consequence as one bounded runtime invocation with ordered
      serial phases: fresh guard -> exact non-force push of candidate to refs/heads/main -> fresh remote
      post-proof -> compact attributable JOIN. A failed/ambiguous guard must cause zero promotion mutation;
      a successful push without exact post-proof is not success.
    - >-
      Publish only the compact TASK-0033 report on dev after the promotion consequence, preserving
      main exactly at the accepted candidate and topology exactly {dev, main}.
    - >-
      Capture operational_timing only under the existing protocol semantics for this performance-validation
      execution: started_at_utc after exact binding and immediately before capability preflight, and
      terminal_decision_at_utc before report publication. Omit the whole timing block if either boundary
      cannot be captured truthfully.

invariants:
  - "No candidate bytes are modified."
  - "TASK-0032 accepted correctness predicates remain satisfied by exact immutable evidence unless a specific dependency/predicate invalidation is proven."
  - "No full-suite rerun is permitted merely for promotion ceremony."
  - "Promotion is non-force and exact; no merge/cherry-pick/rebase/substitute candidate is permitted."
  - "Case Router, protocol, taxonomy, model policy, branch policy, runtime semantics, and support repositories other than the main ref movement remain unchanged."
  - "Agent Runtime remains transport only; no runtime intelligence, scheduler, queue, cache, registry, daemon, callback, transaction abstraction, or telemetry framework is introduced."
  - "Topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not modify architect/SKILL.md, protocols/TASK_PROTOCOL.md, executor/SKILL.md, validators, tests, templates, contracts, Case Router, runtime, model policy, or candidate content."
  - "Do not rerun acceptance-equivalent deterministic correctness verification unless a specific invalidated/newly required predicate is named in the report."
  - "Do not force-push or create/delete/rename branches, tags, releases, dependencies, services, registries, caches, schedulers, or queues."
  - "Do not mutate architect-profile in this task."

