acceptance_criteria:
  - id: AC-1
    requirement: "Architect guidance defines durable-objective-first judgment, evidence-based challenge of current authority, and canonical-as-governing-not-infallible semantics without making Architect free to ignore explicit authority."
    evidence_required: "Architect skill + Task Protocol wording and focused validator/test assertions."
  - id: AC-2
    requirement: "Material user decisions are classified by impact and ambiguity/casual assent is not treated as informed approval for material regressions or destructive/irreversible changes."
    evidence_required: "Architect skill/protocol wording plus negative tests for required doctrine markers."
  - id: AC-3
    requirement: "Operator-supplied model/effort and known-vs-current capability availability are explicit; reusable governance does not hard-code personal mode labels, machine paths, or provider-specific execution policy."
    evidence_required: "Architect/protocol/README inspection plus forbidden-token regression tests scoped to the new generic operator guidance."
  - id: AC-4
    requirement: "A least-powerful-sufficient execution-surface rule and bounded escalation semantics exist, and mandatory current-execution verification capability known up front must be preflighted before first mutation."
    evidence_required: "Protocol/Architect/Executor wording and focused tests proving the preflight invariant."
  - id: AC-5
    requirement: "GitHub/local drift semantics preserve authorized remote truth without deleting, auto-pushing, or silently adopting local dirty/ahead work; remote drift invalidates stale execution authority."
    evidence_required: "GitHub workflow/Executor/Protocol wording and focused tests."
  - id: AC-6
    requirement: "Local Hygiene Contract requires one isolated run-owned root for temporary local work and makes cleanup part of completion when the run created local artifacts."
    evidence_required: "Protocol/Executor/report contract/template wording and validator tests."
  - id: AC-7
    requirement: "Recursive cleanup is fail-closed: only proven current-run or explicitly disposable runtime-owned roots are eligible; ownership/run identity, realpath containment, non-symlink target, and post-run creation/disposable proof are required; home/workspace/repository roots, ancestors, pre-existing paths, sibling projects, unresolved variables, and arbitrary user-supplied paths are forbidden cleanup targets."
    evidence_required: "Protocol/Executor contract plus deterministic negative tests for each safety class."
  - id: AC-8
    requirement: "Interruption preserves required diagnostic evidence; retained artifacts carry bounded reason/identity; missing cleanup proof returns retained/blocked state rather than destructive fallback."
    evidence_required: "Protocol/report contract/template and tests for closed local-hygiene outcomes."
  - id: AC-9
    requirement: "Executor report can record optional local-hygiene result PASS, RETAINED_FOR_EVIDENCE, or BLOCKED without invalidating legacy v3 reports that lack the field."
    evidence_required: "Report template/validator/tests including backward-compatibility fixture."
  - id: AC-10
    requirement: "Architect-only TASK LAUNCH output contains exactly Chat, Role, operator-supplied Model, operator-supplied Effort, Progress, and short explanation, followed separately by self-contained PROMPT TO COPY; it remains presentation, not persisted authority."
    evidence_required: "Architect skill + README/protocol wording and validator/test coverage that no reusable launch artifact is introduced."
  - id: AC-11
    requirement: "Protocol remains v3; exactly 15 skills remain; no new dependency/workflow/role/skill/runtime/template/launcher is added; changes stay within the restrictive file set."
    evidence_required: "Final tree/diff inspection, validator PASS, unit tests, py_compile, git diff --check, and exact changed-file inventory."

