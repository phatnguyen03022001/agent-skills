      command_or_check: "Before the first implementation mutation, prove the currently available execution environment can satisfy repository_content_write, exact_remote_ref_read, and native_verification_execution for this task. If native verification is operator-assisted local execution, establish an isolated OS-temp run root and safe-cleanup strategy before mutation. Capture the preflight evidence in the report."
      required: true
    - id: CHECK-2
      command_or_check: "Use TDD: add focused failing tests first for durable-objective judgment markers, availability/preflight semantics, GitHub/local drift, TASK LAUNCH non-authority semantics, local-hygiene closed outcomes, and fail-closed cleanup invariants; capture valid RED before production-governance changes."
      required: true
    - id: CHECK-3
      command_or_check: "python3 scripts/validate_skill_library.py"
      required: true
    - id: CHECK-4
      command_or_check: "python3 -m unittest scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-5
      command_or_check: "python3 -m py_compile scripts/validate_skill_library.py scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-6
      command_or_check: "git diff --check"
      required: true
    - id: CHECK-7
      command_or_check: "Inspect exact base..final_execution_head diff and prove only authorized paths changed; exactly 15 SKILL.md locations remain; no dependency/workflow/main/branch/tag/release/metadata mutation occurred; no new reusable file or operator-specific mode/path/provider token was introduced; local temporary artifacts created for verification were safely cleaned or explicitly retained with bounded evidence."
      required: true
  authoritative_verification:
