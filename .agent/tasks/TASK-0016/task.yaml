      command_or_check: "Refresh refs and confirm current dev contains pinned candidate 8258c93725af4e073add2659bf1d5e88d64304ff, main remains 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, topology is exactly {dev, main}, and GitHub releases remain empty"
      required: true
    - id: CHECK-2
      command_or_check: "Compare pinned main to pinned candidate and account for every material non-task semantic file in the 49-commit delta"
      required: true
    - id: CHECK-3
      command_or_check: "Resolve exact closure evidence for surviving semantics, treating historical missing reviews as blockers only when surviving material semantics remain unclosed"
      required: true
    - id: CHECK-4
      command_or_check: "Trace the last validator/test mutations and prove current executable assurance from exact persisted evidence or classify the missing predicate as a blocker"
      required: true
    - id: CHECK-5
      command_or_check: "Inspect current protocol-v3/release identity surfaces for concrete unresolved contradictions without reopening accepted questions by preference"
      required: true
    - id: CHECK-6
      command_or_check: "Publish only TASK-0016/report.yaml as the direct child of the exact planning base, verify main unchanged, and stop at NEEDS_REVIEW"
      required: true
  authoritative_verification:
