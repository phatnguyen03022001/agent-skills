acceptance_criteria:
  - id: AC-1
    requirement: "Pinned release-candidate ancestry and topology are proven without mutation."
    evidence_required: "Exact current refs, main-to-candidate compare metadata, release count, and topology evidence"
  - id: AC-2
    requirement: "Every material surviving main-to-dev semantic change has a release-closure disposition."
    evidence_required: "Changed-file/current-state mapping to ACCEPTED review or exact later subsuming evidence, with concrete blockers for any uncovered semantics"
  - id: AC-3
    requirement: "Historical artifact incompleteness is separated from current semantic release risk."
    evidence_required: "TASK-0007..TASK-0009 review absence is evaluated by surviving semantic coverage rather than retroactive symmetry"
  - id: AC-4
    requirement: "Validator/test assurance for the current candidate is truthful and sufficient or explicitly blocked."
    evidence_required: "Last validator/test mutation lineage plus exact persisted verification evidence and later-change impact analysis"
  - id: AC-5
    requirement: "Current protocol/release surfaces contain no unclassified material ambiguity."
    evidence_required: "Bounded consistency audit covering only current changed semantics, accepted closure, README/release identity, and known blockers"
  - id: AC-6
    requirement: "Audit ends with one deterministic release-preparation classification and report-only lineage."
    evidence_required: "Exactly one structural_observations classification RELEASE_PREPARATION_READY or BLOCKERS_FOUND; report-only child; main unchanged"

