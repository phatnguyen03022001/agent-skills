invariants:
  - "The audited semantic candidate remains exactly 8258c93725af4e073add2659bf1d5e88d64304ff."
  - "main remains unchanged at 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 during this task."
  - "No semantic implementation, protocol, contract, skill, template, validator, test, README, workflow, or release metadata mutation occurs."
  - "Missing historical review.yaml alone is not treated as a release blocker without a surviving unclosed semantic claim."
  - "Surviving material semantics require durable closure evidence; age, adjacency, or convenience are not evidence."
  - "Accepted tasks are not reopened without concrete contradictory current-state evidence."
  - "No release version is selected, no tag/release is created, and no promotion occurs."
  - "No Agent Runtime, central orchestrator, registry, telemetry backend, framework expansion, or new role/lifecycle model is introduced."

