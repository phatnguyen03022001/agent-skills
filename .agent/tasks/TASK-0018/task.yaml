    - contracts/IMPLEMENTATION_REPORT.md
    - templates/review.yaml
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
  expected_files_are_restrictive: true

invariants:
  - "No reusable governance, protocol, contract, skill, template, validator, test, README, workflow, dependency, or repository metadata semantics change during EXECUTION."
  - "Protocol version remains 3 and backward-compatible semantics remain unchanged."
  - "The curated taxonomy remains exactly 15 top-level skills."
  - "Branches remain exactly {dev, main}."
  - "main remains 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 during EXECUTION."
  - "No tag or GitHub Release is created before persisted ACCEPTED TASK-0018 review and exact later continuations."
  - "Intended first stable release identity is v1.0.0 only while tag/release namespace remains empty."
  - "Accepted exact evidence is reused when immutable identity is unchanged; no broad duplicate audit or CI rerun is required for ceremony."

forbidden_changes:
  - "Do not modify any existing semantic file during EXECUTION."
  - "Do not mutate main, create tags, publish releases, create PRs/issues/branches, or change branch topology during EXECUTION."
  - "Do not add release automation, changelog framework, package publishing, generated release machinery, registry, dashboard, database, queue, workflow, or another release system."
  - "Do not backfill historical reviews or rewrite historical task/report/review artifacts."
  - "Do not expand the taxonomy, change protocol version, or redesign promotion/release semantics."
  - "Do not rerun GitHub Actions solely to restate already accepted immutable evidence."
  - "Do not use or probe Agent Runtime."
  - "Do not use Codex."

