structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0016 release-lineage readiness audit plus accepted TASK-0017 review-operational-timing correction and current exact repository state."
  rationale: >-
    TASK-0016 established RELEASE_PREPARATION_READY for the semantic lineage through
    8258c93725af4e073add2659bf1d5e88d64304ff. TASK-0017 then introduced one bounded
    accepted governance correction with exact-candidate Actions proof. The remaining release-preparation
    work is to prove that the exact current dev lineage remains release-ready, bind the first stable
    release identity, and preserve explicit review -> promotion -> release separation without creating
    semantic churn or a release framework.

objective: >-
  Prepare the exact current agent-skills lineage for its first stable release without changing reusable
  governance semantics: reuse accepted release-readiness evidence where identities remain valid, verify
  the bounded post-audit delta including TASK-0017, confirm exact branch/tag/release state, establish
  v1.0.0 as the intended first stable release identity, publish the canonical report-only child, and stop
  at NEEDS_REVIEW. Promotion and release remain separately continuation-gated after ACCEPTED review.

scope:
  required_changes:
    - "Do not modify any existing semantic repository file during EXECUTION."
    - >-
      Treat 560cdf8a76c9866de17e2b5783d651bc8a941157 as the exact pre-task release candidate snapshot.
      Treat 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 as the pinned stable main base.
    - >-
      Reuse TASK-0016 ACCEPTED release-readiness evidence for the lineage it already audited instead of
      repeating a full 56-commit semantic audit. Revalidate only predicates that are mutable or changed
      after that audit, especially TASK-0017 exact candidate/report/review lineage and its exact-candidate
      GitHub Actions proof.
    - >-
      Confirm current main-to-candidate history is linear with no divergence, topology is exactly {dev, main},
      and no unreviewed semantic mutation exists after TASK-0017 ACCEPTED review.
    - >-
      Confirm GitHub tag namespace and GitHub Releases are empty at execution start. If either is not empty,
      fail closed and report the exact existing release identity rather than inventing another version.
    - >-
      Establish v1.0.0 as the intended first stable release identity only if the repository still has no tags
      and no releases and no canonical evidence requires another version. This task does not create the tag.
    - >-
      Confirm README.md contains no stale unreleased-candidate claim requiring a release-preparation semantic
      correction. Do not edit README merely to add version marketing or release ceremony.
    - >-
      Confirm exact candidate semantics remain protocol version 3, exactly fifteen curated top-level skills,
      and current deterministic validator/test contracts remain intact. Reuse exact accepted evidence where
      immutable identity is unchanged; do not rerun remote CI merely for ceremony.
    - >-
      Publish only .agent/tasks/TASK-0018/report.yaml as a report-only direct child of the exact execution base
      and stop at NEEDS_REVIEW.
    - >-
      Post-review path is continuation-gated: after persisted ACCEPTED review, a later exact PROMOTION
      continuation may non-force fast-forward main to the exact accepted TASK-0018 lineage. Only after that
      promotion is independently confirmed may a later exact RELEASE continuation create v1.0.0 at the
      promoted main commit and publish the GitHub Release.
    - >-
      At PROMOTION or RELEASE continuation, fail closed on ref drift, unexpected tag/release presence,
      unavailable required capability, non-fast-forward topology, or any mismatch in exact accepted lineage.

  allowed_existing_files_or_components:
    - .agent/tasks/TASK-0018/task.yaml
    - .agent/tasks/TASK-0016/task.yaml
    - .agent/tasks/TASK-0016/report.yaml
    - .agent/tasks/TASK-0016/review.yaml
    - .agent/tasks/TASK-0017/task.yaml
    - .agent/tasks/TASK-0017/report.yaml
    - .agent/tasks/TASK-0017/review.yaml
    - README.md
    - protocols/TASK_PROTOCOL.md
