      command_or_check: "Resolve TASK-0018 revision 1 at exact handoff base; require topology {dev, main}; require main at pinned stable base; require tag namespace and GitHub Releases empty; preflight EXECUTION capabilities."
      required: true
    - id: CHECK-2
