acceptance_criteria:
  - id: AC-1
    requirement: "Current release candidate remains linearly promotable and exact."
    evidence_required: "main-to-560cdf8a76c9866de17e2b5783d651bc8a941157 is ahead-only with no divergence and topology is exactly {dev, main}."
  - id: AC-2
    requirement: "Previously accepted release-readiness evidence is reused without leaving the post-audit delta unchecked."
    evidence_required: "Report binds TASK-0016 ACCEPTED release-readiness evidence and independently resolves TASK-0017 accepted candidate/report/review plus exact-candidate Actions PASS."
  - id: AC-3
    requirement: "First stable release identity is conflict-free."
    evidence_required: "Tag namespace and GitHub Releases are empty and v1.0.0 is recorded only as intended future release identity, not created during EXECUTION."
  - id: AC-4
    requirement: "No semantic preparation churn is introduced."
    evidence_required: "README has no stale release claim requiring correction, execution changes no existing semantic file, and report publication is the only execution mutation."
  - id: AC-5
    requirement: "Release-critical invariants remain intact."
    evidence_required: "Protocol v3, exactly 15 curated skills, validator/test authority, terminal identity, Executor/report timing, Architect-review timing, and current release-separation semantics remain unchanged."
  - id: AC-6
    requirement: "Promotion and release remain exact, separate, and fail-closed."
    evidence_required: "Task/report explicitly require persisted ACCEPTED review before PROMOTION and independently confirmed promotion before v1.0.0 tag/release publication."

