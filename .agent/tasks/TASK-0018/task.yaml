      required: true
    - id: CHECK-4
      command_or_check: "Compare pinned main to exact pre-task candidate; prove ahead-only/no divergence; inspect changed semantic-file set only as needed to confirm no semantic mutation after accepted TASK-0017 review."
      required: true
    - id: CHECK-5
