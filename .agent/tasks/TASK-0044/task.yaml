  source: "Existing agent-skills scripts and Executor local execution procedure."
  rationale: "One explicit stateless file transformation supplies the requested missing behavior. Existing Git/native transport is reused; no environment manager, new skill or Runtime primitive."
objective: "Provide a bounded local env reconciliation command that preserves opaque operator values and blocks startup on unresolved configuration."
scope:
  required_changes:
    - "Add scripts/reconcile_env.py using only Python stdlib, with explicit --example PATH and --env PATH arguments, read-only default/check and explicit --write. Operate only on those files, never discover other env files, source/execute assignments, fetch secrets or print file contents."
    - "For the documented supported single-line dotenv subset, preserve template comments/blanks and key order, preserve each existing assignment value verbatim including quote/escape text, insert a quoted literal <thiếu key> for every missing example key instead of adopting template values, and group existing extra keys below. Preserve operator-only comments deterministically; idempotent output is required."
    - "Support ordinary identifier keys, optional export prefix, comments/blanks and single-line unquoted/single-quoted/double-quoted assignments. Fail before writing on duplicate keys, malformed or unsupported multiline/ambiguous syntax, symlinks/non-regular inputs or identical source/destination; no attempt at a full dotenv grammar. Error messages must not contain values or source lines."
    - "Write atomically through a private same-directory temporary file with cleanup on failure. New env files are private; existing permissions are preserved or tightened, never widened. Preserve the existing file on parse/validation failure; no persistent backup, daemon, new dependency or background watcher."
    - "Return nonzero when reconciliation is needed in check mode, any placeholder remains after write, or malformed input occurs; document the distinction. Print only a compact non-secret result/count. This command cannot certify provider credentials."
    - "Add one compact README command and a bounded pointer in Executor local startup procedure: when authorized local target startup uses an env example, reconcile via the repo-native equivalent or this command before starting; unresolved placeholders stop startup for missing operator configuration. No secret values are returned to the model."
  allowed_existing_files_or_components:
    - scripts/reconcile_env.py
    - scripts/test_reconcile_env.py
    - README.md
    - executor/SKILL.md
invariants:
