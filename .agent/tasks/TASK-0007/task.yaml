acceptance_criteria:
  - id: AC-1
    requirement: "Canonical continuation is topology-neutral and can represent exact refs for MAIN_ONLY, DEV_MAIN, DEV_STAGING_MAIN, and differently named target-authoritative topologies without fake dev/main fields."
    evidence_required: "Causal regression demonstrates the old literal-key limitation; final template/validator tests demonstrate topology-neutral exact ref identities and at least main-only, two-ref, and three-ref/differently-named cases."
  - id: AC-2
    requirement: "Existing valid expanded v3 continuations with expected_refs.dev/main and legacy PROMOTE_TO_MAIN remain accepted as compatibility input without becoming the canonical new representation."
    evidence_required: "Backward-compatibility tests pass for the legacy shape/action and protocol text states the compatibility boundary explicitly."
  - id: AC-3
    requirement: "Promotion continuation no longer assumes a branch literally named main for canonical new artifacts; the exact promotion target ref is explicit and target-authoritative."
    evidence_required: "Final canonical continuation fixture/template and focused tests prove promotion to a differently named stable ref can be represented and semantically validated without PROMOTE_TO_MAIN."
  - id: AC-4
    requirement: "Contradictory lifecycle snapshot fields and invalid phase/action pairings fail deterministic validation while valid review/verification/promotion/release combinations pass."
    evidence_required: "Focused negative and positive tests exercise expected_state.lifecycle versus prior_lifecycle_state and each continuation phase/action relationship."
  - id: AC-5
    requirement: "ACCEPTED review requires exact_report_identity_verified=true; non-accepted review states do not gain false acceptance authority."
    evidence_required: "Causal regression shows accepted/false passed before fix; final tests reject ACCEPTED+false and accept the corresponding exact-identity-verified case while preserving REVISION_REQUIRED/BLOCKED semantics."
  - id: AC-6
    requirement: "The correction remains bounded to protocol correctness and preserves all existing major authority/safety boundaries."
    evidence_required: "Exact diff shows only authorized files required for F-01/F-05/F-06 subset; no ownership/sparsity/taxonomy/TASK-LAUNCH cleanup or new subsystem appears."
  - id: AC-7
    requirement: "Repository deterministic verification passes on the exact final implementation state."
    evidence_required: "python3 scripts/validate_skill_library.py, python3 -m unittest scripts.test_validate_skill_library, and git diff --check all pass on the exact final implementation HEAD."
  - id: AC-8
    requirement: "Publication lineage is exact and main/topology remain untouched."
    evidence_required: "Implementation commits are non-force descendants of the TASK-0007 handoff base; separate report-only commit changes only .agent/tasks/TASK-0007/report.yaml; final main remains 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 and branches remain exactly {dev, main}."

