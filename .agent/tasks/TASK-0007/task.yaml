structure_authority:
  status: RESOLVED
  source: "Existing protocol, github-workflow, continuation/review templates, validator, and validator tests."
  rationale: "The defects can be corrected inside current owners. No new skill, protocol version, manifest, registry, shared state, orchestrator, schema package, or top-level path is justified."

objective: "Strengthen protocol-v3 correctness without broad simplification: make canonical continuation identities topology-neutral while retaining compatibility with valid expanded v3 dev/main continuations, enforce the material lifecycle/phase/action relationships that are currently structurally accepted despite contradiction, and require exact reviewed-report identity verification before an Architect review can be ACCEPTED."

scope:
  required_changes:
    - "Use causal TDD against the exact authorized base. Before production changes, add focused regressions that reproduce: (1) canonical continuation requiring literal expected_refs.dev/main and therefore being unable to express a MAIN_ONLY, staging, differently named, or otherwise target-authoritative topology without fake refs; (2) contradictory continuation lifecycle/phase/action combinations passing current validation; and (3) an ACCEPTED review with independence.exact_report_identity_verified=false passing current validation."
    - "F-01: introduce one topology-neutral canonical continuation representation for exact expected refs. Canonical new continuations must represent zero or more exact target-authoritative refs without requiring field names dev or main. Use explicit ref identity plus exact commit identity; do not infer branch names, roles, topology, or promotion target from generic governance."
    - "Keep protocol_version 3 and preserve backward compatibility for existing valid expanded v3 continuation artifacts using expected_refs.dev/main. The legacy shape remains interpretable/accepted compatibility input; the new canonical template should demonstrate the topology-neutral form. Do not silently reinterpret an old field to mean something different."
    - "Remove the generic assumption that promotion necessarily means a branch literally named main. Canonical new continuation data must identify the exact promotion target ref when promotion is the authorized next action. Preserve legacy PROMOTE_TO_MAIN compatibility for existing v3 artifacts, but canonical new representation/action semantics must be topology-neutral."
    - "F-05 relational subset: preserve lifecycle state as derived and preserve prior_result only where it can carry a genuinely distinct operation result. When expected_state.lifecycle and prior_lifecycle_state describe the same continuation snapshot, require them to agree rather than allowing contradictory duplicate lifecycle state. Do not collapse prior_result into lifecycle or invent a universal result=lifecycle equation."
    - "Enforce phase/action relationships for canonical continuation validation. REVIEW may request Architect review or stop; VERIFICATION may run authoritative verification or stop; PROMOTION may perform the topology-neutral promotion action (and legacy PROMOTE_TO_MAIN only as compatibility input) or stop; RELEASE may perform the existing release actions/final verification or stop. Do not let a phase authorize an unrelated action merely because both tokens are independently recognized."
    - "F-06 exact-review subset: an Architect review with state ACCEPTED must require independence.exact_report_identity_verified=true. REVISION_REQUIRED/BLOCKED remain able to record false when exact identity is not established. Preserve separate_session_from_executor and existing review ownership semantics."
    - "Prefer semantic validation over new mandatory ceremony. Add only the validation/helpers/tests needed for these relationships. Do not broaden this task into closing every free-form string field, rewriting the parser, or redesigning all protocol artifacts."
    - "Update TASK_PROTOCOL.md and github-workflow/SKILL.md only as needed to define the topology-neutral continuation semantics, compatibility treatment, exact target-ref promotion semantics, and relational invariants. Update contracts only if a directly affected normative contract otherwise becomes contradictory."
    - "Run deterministic focused tests plus the repository-owned validator/unit suite and git diff --check on the exact final implementation. Produce TASK-0007 report evidence in a separate report-only commit and stop at Governing Architect review."
  allowed_existing_files_or_components:
    - protocols/TASK_PROTOCOL.md
    - github-workflow/SKILL.md
    - templates/continuation.yaml
    - templates/review.yaml
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
    - contracts/ARCHITECT_REVIEW.md
    - contracts/IMPLEMENTATION_REPORT.md
    - .agent/tasks/TASK-0007/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Protocol version remains 3; existing valid expanded v3 artifacts remain valid and unsupported versions still fail closed."
  - "Target repositories remain authoritative for branch names, ref roles, and topology. Generic governance must not require dev/main, main-only, staging, or any other fixed topology."
  - "Exact expected refs remain mandatory stale-state evidence when a continuation relies on them; topology-neutral does not mean approximate or inferred identity."
  - "Promotion authority remains distinct from continuation serialization and from release authority. Continuation never manufactures promotion/release authority."
  - "Legacy expected_refs.dev/main and PROMOTE_TO_MAIN compatibility does not make those names canonical for new artifacts."
  - "expected_state.lifecycle and prior_lifecycle_state cannot contradict when both represent the same bound snapshot. prior_result remains a distinct concept and is not mechanically collapsed into lifecycle."
  - "An ACCEPTED Architect review cannot exist with exact_report_identity_verified=false. Acceptance still does not manufacture verifier PASS, promotion authority, release authority, or later capability availability."
  - "Task/handoff/base-SHA binding, authority!=capability, Executor-report/Architect-review separation, exact reviewed_report.commit, promotion_candidate_head, one-active-target, repository-local lineage, and fail-closed stale-state semantics remain unchanged."
  - "No shared mutable cross-repository authority, registry, queue, database, orchestrator, compatibility service, or new lifecycle engine is introduced."
  - "F-02/F-03/F-04/F-07/F-08/F-09/F-11/F-12 are not implementation authority in this task. F-10 remains NO_CHANGE_REQUIRED."
  - "Branches remain exactly {dev, main}; main remains read-only during execution."

forbidden_changes:
  - "Do not perform the ownership/subtraction wave: no TASK LAUNCH presentation cleanup, no normative-owner deduplication, no task/report sparsification, no architect_binding removal, no confirmation-boolean cleanup, no taxonomy-owner redesign, and no broad prose-size reduction."
  - "Do not rename protocol version, existing serialized review states, lifecycle states, or legacy fields merely for aesthetics."
  - "Do not create protocol v4, a migration framework, compatibility registry, shared schema package, generated schema, new parser, new validator subsystem, or new skill."
  - "Do not weaken exact SHA/ref checks, fail-closed behavior, review independence, promotion/release separation, or repository-local authority."
  - "Do not modify README.md, architect/SKILL.md, executor/SKILL.md, templates/task.yaml, templates/report.yaml, templates/handoff.yaml, simplicity/SKILL.md, cloud-run-basics, unrelated skills, historical tasks/reports, other repositories, repository metadata, tags, releases, or branch topology."
  - "Do not create branches, mutate main, force-push, rebase, rewrite history, promote, tag, release, or create review.yaml under this task."

