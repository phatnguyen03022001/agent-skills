  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start resolve TASK-0007 revision 1 and pinned self-hosting agent-skills@0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1; refresh refs; require live dev equals the exact TASK-0007 handoff base, main equals 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1, branches exactly {dev, main}; preflight all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Causal RED on the exact base: reproduce literal dev/main continuation limitation, at least one invalid lifecycle/phase/action contradiction currently accepted, and ACCEPTED review with exact_report_identity_verified=false currently accepted. Record exact failing tests before production edits."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest backward-compatible v3 correction inside existing protocol/template/validator owners. No new subsystem or broad cleanup."
      required: true
    - id: CHECK-4
      command_or_check: "Run focused new regression tests proving topology-neutral canonical refs/promotion target, legacy v3 compatibility, lifecycle equality, phase/action relations, and exact accepted-review identity semantics. Require all focused tests PASS."
      required: true
    - id: CHECK-5
      command_or_check: "Run python3 scripts/validate_skill_library.py, python3 -m unittest scripts.test_validate_skill_library, and git diff --check on the exact final implementation HEAD; require exit 0."
      required: true
    - id: CHECK-6
      command_or_check: "Before implementation publication inspect exact base-to-final diff and prove every changed file is authorized and every semantic change maps to F-01/F-05/F-06 subset. Commit/push non-force to dev; main stays untouched."
      required: true
    - id: CHECK-7
      command_or_check: "Create .agent/tasks/TASK-0007/report.yaml only after final verification. Commit/push it separately, then verify its sole parent is the final implementation commit, its diff is report-only, dev equals the report commit, main remains unchanged, and branches remain exactly {dev, main}."
      required: true
