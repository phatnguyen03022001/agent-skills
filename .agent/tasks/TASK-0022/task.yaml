structure_authority:
  status: RESOLVED
  source: "Operator-closed GOV-D rollout and accepted GOV-B/GOV-C semantics."
  rationale: >-
    GOV-D adds one reusable generic evaluation corpus inside an existing repository-native test/fixture ownership area and
    the smallest existing regression-test support needed to keep that corpus structurally valid. It creates no new top-level
    governance owner, role, lifecycle, protocol version, decision engine, classifier, or framework.

objective: >-
  Materialize a small generic paired governance-evaluation corpus that can detect both Architect over-governance and Executor
  under-governance without turning consequence-based judgment into a category matrix. Preserve expected outcomes as test fixtures,
  not executable authority, so GOV-E can use them for historical dry-runs and real agent pilots.

scope:
  required_changes:
    - >-
      Persist one machine-readable generic decision-ownership evaluation corpus in the smallest existing repository-native
      test/fixture location. Do not create a new top-level directory or a second governance semantic owner.
    - >-
      Keep the corpus intentionally small: six to eight paired scenarios. Every pair must hold the implementation domain/surface
      substantially constant while changing the material consequence, so one variant remains local Executor judgment and the
      paired variant requires Architect authority or revision.
    - >-
      Cover these consequence contrasts without encoding target-specific product rules: local route implementation vs changing
      public route/contract semantics; mechanical SQL organization vs changing persistence semantics; internal helper/module vs
      creating a cross-component reusable/shared ownership boundary; use of an already-approved dependency vs introducing a
      materially new dependency/cost/topology consequence; generated/local companion mechanics vs changing an externally meaningful
      generated/public contract; implementing already-frozen auth/security behavior vs changing the trust boundary; preference-only
      alternate local HOW vs a HOW that creates a material consequence; and, if needed for the sixth-to-eighth pair budget,
      unexpected local companion work vs a cross-component ownership move.
    - >-
      Each case must record a stable case identity, pair identity, short scenario, evaluation kind, expected outcome, and concise
      consequence-based rationale sufficient for a later model/pilot evaluator to judge behavior. Expected outcomes are regression
      expectations only; they do not grant task authority or replace Architect judgment on live repository truth.
    - >-
      Include both over-governance and under-governance failure expectations. A case where Architect unnecessarily prescribes or
      revises valid local HOW must fail; a case where Executor proceeds through a material semantic/authority change without
      escalation must fail.
    - >-
      Add the smallest deterministic regression checks needed to keep the corpus structurally sound: unique case IDs, complete
      two-case pairs, allowed evaluation kinds/outcomes, required fields, bounded pair count, and no target-specific IELTS/SF rule
      leakage. Do not implement a materiality classifier, decision matrix, policy engine, prompt scorer, model runner, or new eval framework.
    - >-
      Preserve current protocol/Architect/Executor/report/review semantics unchanged unless a direct contradiction is reproduced.
      GOV-D evaluates the accepted model; it does not redesign it.
    - >-
      Run the existing validator, full existing unit-test suite including the new eval-integrity regressions, and git diff --check
      on one exact candidate; publish the candidate to dev; require the unchanged Validate skill library GitHub Actions workflow to
      PASS on that exact SHA; publish the canonical Executor report; stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - "existing repository-native validation/test fixture ownership area"
    - "existing validator regression test suite"
    - ".agent/tasks/TASK-0022/report.yaml"

invariants:
  - "The eval corpus tests decision ownership/outcome, not preferred wording."
  - "Materiality remains consequence-based rather than category-based."
  - "Executor-local and Architect-material variants are paired rather than encoded as a universal classifier."
  - "The corpus is regression evidence, not live task authority."
  - "No IELTS-specific or SF-specific product semantics become generic governance rules."
  - "No new role, lifecycle, task dialect/version, decision engine, eval framework, registry, cache, compiler, orchestrator, or PROGRAM delegation is introduced."

forbidden_changes:
  - "Do not change Task Protocol, Architect, Executor, task/report/review contracts or templates, task normalization, timing semantics, lifecycle, PROGRAM semantics, workflows, dependencies, README, release machinery, topology, main, or historical artifacts unless a direct contradiction makes the task BLOCKING rather than locally fixable."
  - "Do not modify agent-standards, agent-documents, agent-runtime, architect-profile, ilets, SF, or any external repository."
  - "Do not create a materiality classifier, decision matrix, model-scoring service, prompt benchmark framework, new top-level eval system, or automated Architect replacement."

