acceptance_criteria:
  - id: AC-1
    requirement: "The corpus is small, generic, paired, and consequence-sensitive."
    evidence_required: "Six to eight complete pairs cover both local and material variants with stable identities, expected outcomes, and consequence-based rationales; no target-specific product doctrine appears."
  - id: AC-2
    requirement: "The evals detect both over-governance and under-governance."
    evidence_required: "At least one pair makes preference-only Architect intervention an expected failure and at least one pair makes un-escalated Executor material-authority drift an expected failure; local alternatives remain allowed when material consequences stay fixed."
  - id: AC-3
    requirement: "The suite does not become a classifier or second governance model."
    evidence_required: "Implementation contains fixture/corpus data and bounded integrity tests only; no decision engine, category matrix, model runner, prompt scorer, framework, new role/lifecycle/version, or semantic duplication is introduced."
  - id: AC-4
    requirement: "Eval integrity is deterministic and regression-safe."
    evidence_required: "Tests reject duplicate/missing IDs, incomplete pairs, unsupported kinds/outcomes, malformed required fields, pair-count drift, and explicit target-specific rule leakage while accepting the canonical corpus."
  - id: AC-5
    requirement: "Accepted GOV-B/GOV-C governance remains unchanged."
    evidence_required: "Exact candidate diff is bounded to the corpus/test ownership plus canonical report; protocol, roles, contracts/templates, workflows, dependencies, external repositories, main, and historical evidence remain unchanged."
  - id: AC-6
    requirement: "Exact candidate verification passes before review."
    evidence_required: "python3 scripts/validate_skill_library.py, the full unit-test suite, git diff --check, and the unchanged Validate skill library GitHub Actions workflow all PASS on the same exact candidate SHA before report publication."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Resolve TASK-0022 revision 1 at exact handoff base, accepted TASK-0021 authority, exact {dev, main} topology, and all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect current test/fixture conventions and choose the smallest existing repository-native location; do not create a new top-level eval framework."
      required: true
    - id: CHECK-3
      command_or_check: "Build the paired corpus and integrity regressions without implementing a materiality classifier or changing accepted governance semantics; inspect exact diff for target-specific leakage and out-of-scope surfaces."
      required: true
    - id: CHECK-4
      command_or_check: "Run python3 scripts/validate_skill_library.py, the full repository unit-test suite, and git diff --check on the exact candidate; all must PASS."
      required: true
    - id: CHECK-5
      command_or_check: "Publish the exact candidate to dev and require the unchanged Validate skill library workflow to conclude success for that exact SHA."
      required: true
    - id: CHECK-6
      command_or_check: "Publish the canonical report only after exact-candidate verification, verify final refs/topology and unchanged main, then stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
