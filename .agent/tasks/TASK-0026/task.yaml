  - source: "phatnguyen03022001/architect-profile/.agent/tasks/TASK-0017/review.yaml@68350ff54749b2548a2bb5f4f7cc40f2c0d29cd8"
    role: "accepted OPM-02 guardrail: admit a future case/navigation map only when real pilots prove repeated material context or decision-routing waste"
