structure_authority:
  status: RESOLVED
  source: "Closed GOV-G rollout."
  rationale: >-
    GOV-G may persist one bounded gate-evidence artifact under TASK-0025 and extend the existing regression test companion only as needed to encode adversarial stable-adoption cases. It must not change reusable governance semantics during the gate itself.

objective: >-
  Perform the final fail-closed adversarial regression and adoption gate for the accepted agent-skills governance redesign, then non-force promote the exact independently verified candidate to stable main only if every compatibility, decision-ownership, pilot, local-reconciliation, ownership, and verification gate passes without requiring a semantic correction.

scope:
  required_changes:
    - "Re-resolve exact current dev/main refs, TASK-0025 revision 1, accepted TASK-0024 review, exact GOV-A..F evidence, and required capabilities before mutation."
    - "Create one compact .agent/tasks/TASK-0025/gate.md evidence artifact recording exact identities, adversarial cases, results, and promotion decision."
    - "Extend only the existing scripts/test_validate_skill_library.py regression companion as needed to make the stable gate executable and repeatable; do not change reusable governance semantics merely to make tests pass."
    - "Run the full existing validator, full unittest suite, git diff --check, and focused stable-gate regressions on the exact candidate."
    - "Require the existing Validate skill library GitHub Actions workflow to run successfully for the exact candidate SHA before any stable promotion. The candidate must therefore contain a legitimate bounded regression-companion change that triggers the existing workflow; do not modify workflow triggers merely to manufacture a run."
    - "Adversarially verify backward compatibility for explicit expanded-v3 tasks, sparse-v3 normalization/defaults, fail-closed missing authority, Executor discretion when only implementation prescription is absent, LOCAL/FOLLOW_UP/BLOCKING consequence boundaries, scope/component semantics, material structure semantics, report/review evidence behavior, and the paired over/under-governance corpus."
    - "Re-evaluate the historical TASK-0044 replay and fresh IELTS TASK-0045 plus SF TASK-0008 pilots: local-HOW churn must be reduced without weakening public/trust/data/material authority, and both fresh pilots must remain one-revision accepted examples rather than being reinterpreted to fit the redesign."
    - "Adversarially verify GitHub-first local execution: path names never grant authority; absent/empty, clean/behind, dirty/ahead/unknown, identity mismatch, stale remote, temporary checkout, post-publication reconciliation, and phone/remote-only cases retain their accepted consequences."
    - "Resolve the GOV-F follow-up concerning Architect-owned GitHub mutations without adding synchronization machinery: an Architect remote-only review/task-authority write may temporarily advance GitHub beyond a local copy, but no later local mutation may trust or use that stale copy without fresh GitHub resolution and safe reconciliation under existing Executor semantics. Do not require instant mirroring, a daemon, watcher, registry, or background sync service."
    - "Verify ownership remains narrow: generic governance only in agent-skills; operator-specific filesystem/presentation preferences only in architect-profile; agent-runtime remains execution capability only; no standards/documents/runtime mutation is required."
    - "If and only if every gate passes and main is still exactly 76f2d3877d1698f91eb5a6117e2301ed49480379 with a proven fast-forward ancestry path to the exact candidate, non-force promote that exact candidate to main. Do not promote the later report commit."
    - "After successful promotion, publish the canonical report-only child on dev, refresh both refs, safely reconcile the designated /Users/tienphat/Developer/agent-skills working copy to final dev, and prove its exact owner/repo remote identity and final dev ref before NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - ".agent/tasks/TASK-0025"
    - "scripts/test_validate_skill_library.py"
    - "read-only accepted governance evidence in agent-skills"
    - "read-only exact accepted pilot/profile evidence from ilets, SF, and architect-profile"

invariants:
  - "This is a gate, not a redesign task. A real semantic defect blocks promotion and becomes separately authorized follow-up work."
  - "GitHub/authorized remote state remains repository SSOT; local state remains subordinate execution state."
  - "Executor discretion increases HOW freedom, never authority."
  - "Missing authority fails closed; missing implementation prescription does not."
  - "Material consequences remain governed even when local-HOW prescription is reduced."
  - "Historical expanded-v3 meaning is preserved; sparse-v3 remains serialization into one semantic model rather than a second dialect."
  - "Phone-only/remote-only execution remains valid without manufacturing local state."
  - "No instant-mirror requirement, project registry, path registry, sync daemon, watcher, state database, orchestration layer, or new lifecycle is introduced."
  - "No operator-specific path, presentation convention, model, tunnel, IDE, or provider leaks into generic agent-skills semantics."

forbidden_changes:
  - "Do not modify executor, architect, Task Protocol, contracts, templates, validator semantics, reusable corpus semantics, workflows, README, or any other reusable governance content during GOV-G. If such a semantic correction is needed, fail closed and open separate authority."
  - "Do not modify architect-profile, agent-runtime, agent-standards, agent-documents, ilets, SF, or any external repository."
  - "Do not force-push, rewrite history, create staging, create branches, PRs, issues, tags, releases, or mutate repository metadata."
  - "Do not promote main if any required test, exact-candidate workflow, evidence identity, ancestry, pilot, ownership, or adversarial case is FAIL/UNKNOWN where PASS is required."
  - "Do not promote the report commit to main."

