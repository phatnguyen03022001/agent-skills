acceptance_criteria:
  - id: AC-1
    requirement: "Current agent-skills semantics pass the complete existing validation and backward-compatibility surface without semantic mutation during the gate."
    evidence_required: "Exact candidate full validator/unittest/diff results plus focused expanded-v3, sparse normalization, authority/discretion, scope/structure, lifecycle, report/review, and paired-corpus regression evidence."
  - id: AC-2
    requirement: "The redesign is neither over-governing nor under-governing under adversarial cases."
    evidence_required: "Gate evidence proves preference-only/local-HOW alternatives remain Executor-owned while public/trust/data/ownership/persistence/dependency/material consequences still require Architect authority."
  - id: AC-3
    requirement: "Historical and fresh pilot evidence supports stable adoption."
    evidence_required: "Exact TASK-0044 replay plus IELTS TASK-0045 and SF TASK-0008 accepted identities show reduced local-HOW churn, no material-authority regression, and no reinterpretation of failed/unknown evidence as PASS."
  - id: AC-4
    requirement: "GitHub-first local execution and Architect-owned remote mutation compose without hidden local authority or new synchronization machinery."
    evidence_required: "Regression/gate evidence covers local-state classifications and proves remote-only Architect writes may leave a local copy temporarily behind only because the next local mutation must re-resolve GitHub and safely reconcile before use; no instant mirror/daemon/registry is required."
  - id: AC-5
    requirement: "Repository ownership remains correct and minimal."
    evidence_required: "No external mutation; no operator-specific leakage into agent-skills; accepted architect-profile owns Developer/<repo-name>, scratch, task-presentation and communication preferences; agent-runtime remains capability only."
  - id: AC-6
    requirement: "The exact stable candidate receives authoritative existing CI verification."
    evidence_required: "Validate skill library GitHub Actions run completes success with head_sha exactly equal to the candidate; no workflow mutation is used to create the signal."
  - id: AC-7
    requirement: "Stable main promotion is exact, non-force, ancestry-safe, and candidate-bound."
    evidence_required: "Fresh refs prove main remained exactly 76f2d3877d1698f91eb5a6117e2301ed49480379 until promotion, that it is an ancestor of the verified candidate, and final main equals exactly the candidate rather than the report child."
  - id: AC-8
    requirement: "Post-promotion dev/report and designated local closure are exact and non-destructive."
    evidence_required: "Report-only direct child on dev, final {dev, main} topology, main=candidate, dev=report, exact local owner/repo binding, safe final dev reconciliation, and preserved operator-owned local state."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Resolve TASK-0025 revision 1 at exact handoff base, fresh {dev, main}, accepted TASK-0024 review, exact GOV-A..F evidence, current workflow, and required capabilities before write."
      required: true
    - id: CHECK-2
      command_or_check: "Build the bounded stable-gate regression additions in the existing unittest companion and gate.md only; fail if satisfying a case requires reusable semantic changes."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused adversarial cases plus python3 scripts/validate_skill_library.py, python3 -m unittest scripts/test_validate_skill_library.py, and git diff --check on the exact candidate."
      required: true
    - id: CHECK-4
      command_or_check: "Publish the exact candidate to dev, require the existing Validate skill library workflow for that exact SHA to complete success, and fail closed on failed/skipped/cancelled/mismatched verification."
      required: true
    - id: CHECK-5
      command_or_check: "Immediately before promotion refresh dev/main and prove main is still the exact old stable SHA and is an ancestor of the verified candidate; non-force fast-forward main to exactly the candidate only after every gate passes."
      required: true
    - id: CHECK-6
      command_or_check: "Publish report.yaml only on dev as the direct report-only child, verify final main=candidate and dev=report with topology exactly {dev, main}, reconcile the designated local agent-skills copy safely to final dev, and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "existing .github/workflows/validate-skill-library.yml on push to dev"
    expected_signal: "completed success with head_sha exactly equal to the implementation/gate candidate"

