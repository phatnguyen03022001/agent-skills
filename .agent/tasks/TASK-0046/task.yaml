acceptance_criteria:
  - id: AC-1
    requirement: "Live README and Task Protocol no longer imply that every semantically valid historical protocol-v3 artifact serialization must be parseable by the current constrained validator."
    evidence_required: "Exact final wording and focused regression assertions preserve backward-compatible v3 semantics while explicitly separating semantic validity from validator serialization support."
  - id: AC-2
    requirement: "The exact accepted historical TASK-0013 reproducer is no longer falsely represented as protocol-invalid solely because its serialization includes unsupported block-scalar syntax."
    evidence_required: "Read-only regression against exact .agent/tasks/TASK-0013/task.yaml plus immutable identity/history proof; result must distinguish unsupported serialization or inability to determine validity from semantic protocol invalidity without modifying TASK-0013 bytes."
  - id: AC-3
    requirement: "Currently supported malformed or semantically invalid artifacts remain rejected."
    evidence_required: "Existing and focused negative tests over supported serialization remain green and preserve current fail-closed validation behavior."
  - id: AC-4
    requirement: "Currently supported semantically valid artifacts remain accepted."
    evidence_required: "Existing and focused positive tests over supported serialization remain green."
  - id: AC-5
    requirement: "No parser creep or general YAML support is introduced."
    evidence_required: "Exact candidate diff and targeted tests show no generic block-scalar implementation, third-party YAML parser, new dependency or expanded grammar beyond the current deterministic subset."
  - id: AC-6
    requirement: "Existing agent-skills validator and library tests remain green on the exact candidate."
    evidence_required: "Fresh full repository validator and complete scripts.test_validate_skill_library suite PASS on exact candidate bytes, plus any repository-native companion tests required by the final changed surfaces."
  - id: AC-7
    requirement: "Narrow regression coverage mechanically locks the semantic-validity versus serialization-support boundary."
    evidence_required: "Focused new tests exercise exact TASK-0013 unsupported serialization and representative supported valid/invalid artifacts without relying on historical-byte mutation."
  - id: AC-8
    requirement: "Exact implementation candidate diff remains wholly inside the authorized live contract/documentation and validator/test surfaces."
    evidence_required: "Execution-base-to-candidate changed-path proof contains only README.md, protocols/TASK_PROTOCOL.md, scripts/validate_skill_library.py and scripts/test_validate_skill_library.py, with no unrelated or historical artifact changes."
  - id: AC-9
    requirement: "Actual TASK-0046 task/report artifacts validate where applicable under the constrained validator's supported serialization."
    evidence_required: "Read-only artifact validation of the canonical TASK-0046 task and authored report succeeds when their serialization is supported; unsupported-serialization classification must not be mislabeled as protocol invalidity."
  - id: AC-10
    requirement: "Candidate and report publication are non-force to dev with main unchanged and final local/remote closure proven."
    evidence_required: "Fresh commit-parent/diff/ref/topology proof after publication: dev equals exact report commit, main equals its pre-execution identity, no new branch exists, local HEAD equals origin/dev and working tree is clean."
