structure_authority:
  status: RESOLVED
  source: "Existing README, Task Protocol, constrained stdlib validator and validator regression suite."
  rationale: "The defect belongs in existing compatibility wording plus the existing validator outcome boundary. No parser expansion, dependency, registry, migration layer or new reusable subsystem is justified."
objective: "Make protocol-v3 compatibility truthful by separating artifact semantic validity from whether the current constrained mechanical validator supports the artifact's YAML serialization, while preserving historical canonical evidence and the parser's deliberately narrow deterministic subset."
scope:
  required_changes:
    - "Update only the minimum README and Task Protocol wording needed to state that protocol-v3 semantic validity and current validator serialization support are distinct. Existing valid historical v3 artifacts remain valid canonical evidence even when their YAML serialization is outside the validator's current deterministic subset; backward compatibility does not require every constrained validator to parse every historical YAML form."
    - "Update the existing constrained validator only as narrowly required so an artifact whose serialization is outside the supported subset is not classified, reported or implied to be PROTOCOL_INVALID solely because parsing is unsupported. The validator may distinguish outcomes equivalent to supported serialization plus valid artifact, supported serialization plus invalid artifact, and serialization outside the validator subset where artifact validity cannot be mechanically determined. Exact names, exit-code choices and internal implementation are Executor-local HOW unless current code structure requires a narrower choice."
    - "Use the exact historical .agent/tasks/TASK-0013/task.yaml behavior as a read-only regression reproducer/evidence case where appropriate. Its block-scalar serialization must remain byte-unchanged and need not become parseable by the constrained validator."
    - "Preserve rejection of malformed or semantically invalid artifacts that use serialization already supported by the constrained parser, and preserve acceptance of valid artifacts using currently supported serialization. Do not weaken existing schema, protocol-version, closed-value, structure or fail-closed validation semantics for parseable input."
    - "Add narrow regression tests that prove the compatibility boundary without adding generic block-scalar handling or any broader YAML grammar. Tests must demonstrate the exact TASK-0013 unsupported-serialization case is not falsely represented as protocol-invalid, while supported valid and supported invalid cases retain their current semantic outcomes."
    - "Run the repository-native validator/library suite and focused compatibility regressions on the exact candidate. Validate the actual TASK-0046 task/report artifacts where the constrained validator supports their serialization, run git diff --check, and prove the exact candidate diff stays within the authorized live surfaces."
    - "Publish the implementation candidate and then .agent/tasks/TASK-0046/report.yaml as truthful non-force children on dev under existing Task Protocol lineage. Freshly prove final remote/local equality, clean state, unchanged main and no branch creation, then stop for Governing Architect review."
  allowed_existing_files_or_components:
    - README.md
    - protocols/TASK_PROTOCOL.md
    - scripts/validate_skill_library.py
    - scripts/test_validate_skill_library.py
  expected_files_are_restrictive: true
invariants:
  - "Protocol version remains exactly 3; no protocol-v4 migration or alternate dialect is introduced."
  - "All pre-existing .agent/tasks historical task.yaml, report.yaml and review.yaml bytes remain unchanged, including exact TASK-0013 evidence."
  - "Unsupported serialization means only that this constrained validator cannot determine protocol validity from those bytes; it does not itself prove semantic invalidity or require migration, rewrite or reserialization."
  - "The constrained parser remains deliberately narrow and stdlib-only; future constrained validators are not obligated to parse every YAML serialization historically accepted under protocol v3."
  - "Currently supported serialization retains existing strict validation semantics for malformed, invalid and valid artifacts."
  - "Repository topology remains exactly the existing dev/main branches; main is read-only and unchanged."
forbidden_changes:
  - "Do not implement a general YAML parser, generic block-scalar parser, broad YAML compatibility layer or parser feature solely to parse historical artifacts."
  - "Do not add PyYAML or any new dependency solely for compatibility, and do not add a compatibility registry, history database, migration framework, service, role, lifecycle, parser framework or reusable subsystem."
  - "Do not modify, migrate, rewrite, reserialize, copy-replace or bulk-normalize TASK-0013 or any other historical task/report/review artifact."
  - "Do not weaken current validation strictness for serialization already supported by the constrained parser."
  - "Do not modify templates, contracts, skills, workflow files, dependency manifests, repository settings, tags, releases or unrelated files unless a concrete blocker proves the task contract insufficient; such a blocker requires revision rather than scope expansion."
  - "Do not create branches, mutate main, force-push, rewrite history, promote, tag, release or mutate repository metadata."
  - "Do not author review.yaml."
