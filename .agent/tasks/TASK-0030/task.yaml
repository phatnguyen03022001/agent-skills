structure_authority:
  status: RESOLVED
  source: "existing protocol-v3 roles and execution surfaces"
  rationale: >-
    This task changes reusable execution procedure only. The optimization is a bounded invocation pattern,
    not a scheduler, service, runtime brain, cache, queue, state machine, or new organizational role.

objective: >-
  Preserve the same fail-closed assurance predicates while materially reducing model/runtime synchronization
  boundaries. Define evidence validity and invalidation precisely, refresh mutable evidence only at consequence
  boundaries, and allow one bounded deterministic execution bundle to run independently attributable checks
  concurrently only when isolation/resource predicates prove parallel execution safe.

scope:
  required_changes:
    - "Define four evidence-validity classes for an active exact binding: IMMUTABLE, LOCAL_MUTABLE, REMOTE_MUTABLE, and RUNTIME. Exact commit/blob/task/review/skill/candidate identities may be reused while unchanged; local state is invalidated by relevant local/observation mutation; GitHub refs/topology must be freshly resolved at consequential canonical boundaries; runtime capability/auth/quota evidence is short-lived and never authority."
    - "Replace ambiguous reusable wording such as 'before any ref mutation' with consequence-specific language distinguishing observation mutation (for example fetch/remote-tracking refs), authorized target-ref mutation, and canonical publication mutation."
    - "Define consequence-boundary refresh rules: fresh mutable evidence immediately before an authorized consequence that depends on it, and fresh proof after canonical publication/ref mutation. Do not reread immutable exact-SHA evidence for ceremony inside the same binding."
    - "Define EXECUTION BUNDLE as one bounded local/runtime invocation containing multiple deterministic checks and returning one compact independently attributable JOIN result. It carries no authority/state and creates no durable cache."
    - "Parallelize bundle jobs only when all are proven to have no shared mutable state, no ordering dependency, no conflicting externally rate-limited dependency, no material resource contention, and independently attributable results. Otherwise serialize them. Same write surface, database/port/temp/cache conflicts, migrations, publication/ref mutation, and final mutation gates remain serial."
    - "When a mandatory full suite semantically subsumes a focused suite, do not run focused tests first on the happy path. Focused tests are diagnostic after failure unless the task gives them distinct acceptance authority."
    - "Resolve the TASK-0029 post-report self-reference: a report must not claim a same-commit post-publication predicate as durable PASS before it can exist. Canonical report stores candidate/pre-publication evidence; fresh remote publication identity is independently resolved after push and at review/consequence boundaries. Local mirror reconciliation is operational LOCAL_MUTABLE hygiene, not remote canonical authority."
    - "Keep Executor final publication closure fail-closed: remote report ref, main/topology constraints, and local mirror hygiene when required must still be checked after publication; the optimization changes where evidence is consumed, not whether predicates exist."
    - "Dogfood the new model while verifying TASK-0030: run at least four safe independent deterministic verification jobs through at most two bounded runtime invocations, produce a compact JOIN result, then perform mutation/publication serially."
    - "Mechanically compare the dogfood verification synchronization count with an equivalent one-command-per-check serial plan and prove at least 50% fewer model/runtime synchronization boundaries without removing any assurance predicate. Wall-clock timing may be recorded only as non-authoritative telemetry when trustworthy boundaries are available; it is not an acceptance gate."

  allowed_existing_files_or_components:
    - "protocols/TASK_PROTOCOL.md"
    - "executor/SKILL.md"
    - "verification/SKILL.md"
    - "optimization/SKILL.md"
    - "github-workflow/SKILL.md"
    - "contracts/IMPLEMENTATION_REPORT.md"
    - "contracts/ARCHITECT_REVIEW.md"
    - "templates/report.yaml and templates/review.yaml only if required to remove self-referential/pending-final-refresh ambiguity"
    - "scripts/validate_skill_library.py and scripts/test_validate_skill_library.py only for mechanically enforceable changed semantics"
    - ".agent/tasks/TASK-0030/report.yaml"
    - "run-owned temporary commands/fixtures used for the dogfood bundle and synchronization measurement"

invariants:
  - "Protocol version remains 3 and TASK-0029 sparse/expanded compatibility remains intact."
  - "Assurance predicates are preserved; optimization targets synchronization boundaries, not rule deletion."
  - "Authority, capability, evidence validity, and consequence remain distinct."
  - "Remote mutable GitHub truth is never cached across a consequence boundary merely because the Executor itself made no mutation."
  - "Agent Runtime remains transport only for CHATGPT_LOCAL."
  - "Case Router remains exactly EXECUTE -> executor and byte-identical."
  - "No new CASE, role, lane, lifecycle, task/report/review family, branch, service, dependency, or persistent execution state is introduced."
  - "Topology remains exactly {dev, main}; main is not mutated by this task."

forbidden_changes:
  - "Do not build a scheduler, orchestrator, daemon, queue, database, execution registry, persistent cache, workflow engine, or parallel-agent framework."
  - "Do not modify agent-runtime or make Agent Runtime decide workflow/policy."
  - "Do not create an execution-bundle service or durable bundle artifact."
  - "Do not parallelize jobs with shared mutable state, ordering dependencies, rate-limit conflict, material resource contention, or ambiguous attribution."
  - "Do not weaken fresh remote proof before/after canonical publication mutation."
  - "Do not add embedding/vector/semantic retrieval."
  - "Do not mutate agent-skills/main or create/delete/rename branches."
  - "Do not expand TASK-0030 into live historical task-ledger validation; that remains a separate adversarial-cleanup concern."

