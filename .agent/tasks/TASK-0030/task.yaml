acceptance_criteria:
  - id: AC-1
    requirement: "Evidence classes and invalidation rules are explicit, consequence-based, and do not create authority or persistent cache semantics."
    evidence_required: "Exact reusable semantic diff plus focused tests/validation where mechanically applicable."
  - id: AC-2
    requirement: "EXECUTION BUNDLE is a bounded invocation pattern only; safe-parallel eligibility requires all isolation/resource/attribution predicates and unsafe cases remain serial."
    evidence_required: "Executor/verification/optimization guidance plus positive and negative examples/tests."
  - id: AC-3
    requirement: "Remote refs/topology are freshly resolved at canonical consequence boundaries while immutable exact-SHA evidence is reused without ceremony and local/runtime evidence is invalidated at the correct events."
    evidence_required: "Focused consequence-boundary scenarios including external remote drift between observations."
  - id: AC-4
    requirement: "Post-report publication closure has no self-referential PASS/PENDING ambiguity: canonical report evidence, fresh remote publication proof, review binding, and local operational hygiene have explicit owners/timing."
    evidence_required: "Protocol/contract/template behavior and regression tests covering report publication followed by fresh remote review."
  - id: AC-5
    requirement: "Focused-before-full redundancy is removed when the full mandatory suite subsumes it, while separately authoritative focused checks remain supported."
    evidence_required: "Procedure text and focused regression examples."
  - id: AC-6
    requirement: "TASK-0030 dogfood runs at least four safe independent deterministic checks in <=2 runtime invocations and proves >=50% synchronization-boundary reduction against equivalent serial execution with the same predicates."
    evidence_required: "Compact run-owned bundle manifest/result and mechanical boundary count; no persistent telemetry subsystem."
  - id: AC-7
    requirement: "Full repository regression remains green; protocol v3, expanded compatibility, sparse serialization, Case Router bytes, taxonomy, and branch topology remain unchanged."
    evidence_required: "Full validator/unit suite, py_compile for changed Python, git diff --check, exact changed paths, Case Router blob identity, and simplicity review."
  - id: AC-8
    requirement: "Implementation candidate and compact report child are published on dev with fresh remote proof; main remains unchanged and final local mirror hygiene is checked without treating local state as canonical authority."
    evidence_required: "Candidate/report SHAs, fresh remote refs/topology, and truthful terminal local-hygiene evidence."

