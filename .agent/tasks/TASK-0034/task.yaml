acceptance_criteria:
  - id: AC-1
    requirement: "Task Protocol explicitly distinguishes fresh-binding re-resolution from evidentiary applicability of canonical immutable prior evidence."
    evidence_required: "Exact changed protocol text plus ownership review proving no new validity class/lifecycle/cache semantics."
  - id: AC-2
    requirement: "Architect task-authoring semantics explicitly require exact current-predicate coverage before prior immutable evidence may satisfy a new binding; same candidate identity alone is insufficient."
    evidence_required: "Exact changed architect text mapped to the clarified Task Protocol semantics."
  - id: AC-3
    requirement: "Read-only counterfactuals prove both sides: a fresh binding with exact re-resolved prior artifact and unchanged covered predicate may reuse the prior result without rerunning its producer; changed artifact identity or a new/changed uncovered predicate rejects reuse/fails closed or performs only the newly required proof."
    evidence_required: "Compact positive and negative counterfactual classification in report."
  - id: AC-4
    requirement: "The correction remains only semantic closure in Task Protocol + Architect rule and introduces no registry/DAG/cache/matrix/runtime/continuation machinery or unrelated optimization."
    evidence_required: "Exact base-to-candidate diff and forbidden-surface guard."
  - id: AC-5
    requirement: "Repository-native validator/tests, py_compile where applicable, and git diff --check remain green; exact candidate and compact report child are published on dev with main unchanged and topology {dev, main}."
    evidence_required: "One bounded deterministic verification result plus fresh dev/main/topology proof."

