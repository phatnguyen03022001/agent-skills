objective: >-
  Close the remaining evidence-reuse semantic seam without adding machinery: a fresh task/repository binding
  must discard cached/context-local resolution assumptions and freshly re-resolve exact prior canonical evidence,
  while the evidentiary result of that immutable artifact may satisfy the current predicate only when the exact
  prior evidence actually covers that predicate and the relevant predicate semantics/dependencies remain applicable.

scope:
  required_changes:
    - >-
      Clarify protocols/TASK_PROTOCOL.md so rebinding ends context-local resolution reuse and stale assumptions,
      but does not by itself erase the evidentiary applicability of a canonically re-resolved immutable prior
      artifact. In a fresh binding, prior immutable evidence may satisfy a current predicate only after exact
      artifact identity is freshly re-established and its coverage of the exact current predicate is confirmed.
    - >-
      Tighten architect/SKILL.md so the existing immutable-evidence reuse rule explicitly requires prior evidence
      to cover the exact currently required predicate under still-applicable governing/predicate semantics; same
      candidate identity alone is never sufficient.
    - >-
      Keep all semantics referential to the existing IMMUTABLE/LOCAL_MUTABLE/REMOTE_MUTABLE/RUNTIME validity
      classes and existing execution-bundle model. Do not create a claim object, EvidenceKey, registry, cache,
      invalidation matrix artifact, semantic-DAG artifact, new validity class, or persistence mechanism.

allowed_existing_files_or_components:
  - protocols/TASK_PROTOCOL.md
  - architect/SKILL.md
  - .agent/tasks/TASK-0034/report.yaml

invariants:
  - "Canonical evidence must be freshly re-resolved after rebinding before it is relied on; hidden chat/context cache is never authority."
  - "Prior immutable evidence is reusable only for predicates it actually proved and that remain semantically applicable."
  - "Candidate identity drift, prior evidence identity drift, uncovered/new predicate requirements, changed predicate semantics, contradiction, or explicit stronger assurance prevents unrelated prior evidence from being treated as sufficient."
  - "No finer-grained authority dependency engine is introduced; the current conservative governing-authority guard remains acceptable unless a later measured over-invalidation defect proves otherwise."
  - "No continuation/lifecycle redesign, runtime change, output-capture change, model-policy change, new CASE, new schema, new service, or new framework is introduced."
  - "Topology remains exactly {dev, main}; agent-skills/main is not mutated by this task."

forbidden_changes:
  - "Do not modify executor/SKILL.md, Agent Runtime, validators, tests, templates, contracts, taxonomy, Case Router, model policy, branch policy, or support repositories."
  - "Do not add doctrine-token validation, evidence registries, claim graphs, invalidation tables/files, caches, databases, schedulers, callbacks, transaction abstractions, or telemetry machinery."
  - "Do not optimize unrelated authority-set over-invalidation or pre-authorized continuation in this task."
  - "Do not mutate agent-skills/main or architect-profile."

