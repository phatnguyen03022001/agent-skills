    role: "current optimization priority"
    precedence: 4

structure_authority:
  status: RESOLVED
  source: "existing protocol-v3 sparse/default semantics"
  rationale: >-
    This task aligns canonical examples, role-local procedure, and validator coverage with semantics
    that already exist. It must not create protocol v4, task-lite/task-compact variants, another
    lifecycle, another authority layer, or another artifact family.

objective: >-
  Make proportional protocol-v3 serialization the canonical default for new task/report/review
  artifacts so small and normal work stops copying default controls and transcript-style evidence,
  while preserving the same semantic authority, fail-closed behavior, acceptance quality, and full
  backward compatibility for existing expanded v3 artifacts.

scope:
  required_changes:
    - "Change the canonical task/report/review example/template surfaces so the default authored shape is sparse and material: identity + positive WHAT/BOUNDARY/PROOF + only non-default controls, and compact evidence/index fields rather than redundant process narration."
    - "Preserve one canonical protocol-v3 semantic model. Omitted task controls must continue to normalize only through the existing protocol-v3 defaults table; omission must never imply extra authority, PASS, capability, branch permission, promotion, release, or hidden success."
    - "Align Architect role-local guidance so task authoring defaults to material WHAT, material BOUNDARY, PROOF, and non-default controls only; it must not serialize Executor-local HOW or repeat protocol defaults for ceremony."
    - "Align Executor role-local/report guidance so reports default to exact identity + AC/check evidence index + candidate/publication identity + only material gaps/deviations/blockers. Successful process transcripts and machine-reconstructible repeated facts must not be copied into prose merely for ceremony."
    - "Align Architect review guidance/template so review defaults to exact reviewed-report identity, material compliance/contradictions, final judgment, candidate/promotion disposition when applicable, and follow-up only when material. Do not duplicate the Executor report transcript."
    - "Update validator/tests only as required to prove sparse new artifacts and historical/expanded v3 artifacts are both valid under the same protocol version and semantic rules. Do not weaken fail-closed checks."
    - "Add regression tests proving omitted/default task controls normalize identically to their explicit expanded v3 equivalents for the controls already owned by the protocol defaults table."
    - "Add report/review compatibility tests proving only contract-authorized redundant/optional evidence may be omitted; exact report identity, candidate/acceptance evidence, blockers/deviations when present, and durable review binding remain reconstructible and mandatory where the existing contracts require them."
    - "Run a bounded serialization pilot over at least 6 representative existing v3 episodes covering DIRECT-or-small, normal BOUNDED, promotion/activation, blocked/retry, and HIGH_ASSURANCE-like evidence shapes where canonical examples exist. Produce a temporary mechanically computed before/after byte comparison; do not persist a new telemetry subsystem."
    - "Require the median combined task+report+review byte reduction across the pilot to be at least 40% for semantically equivalent sparse representations. If this threshold is not achieved without semantic/evidence loss, fail closed and report the reason instead of forcing a cosmetic reduction."
    - "Require the canonical task/report/review template/example combined byte size to fall by at least 40% from the exact execution base unless a validator/contract necessity is independently proven; comments and explanatory prose do not count as semantic compression."
    - "Use TASK-0029 itself as a dogfood check: its Executor report should be a compact evidence index under existing protocol-v3 authority, not a chronological terminal transcript."

  allowed_existing_files_or_components:
    - "templates/task.yaml"
    - "templates/report.yaml"
    - "templates/review.yaml"
    - "protocols/TASK_PROTOCOL.md only for narrow non-semantic clarification necessary to keep sparse/default wording internally consistent; no new semantics"
    - "contracts/IMPLEMENTATION_CONTRACT.md"
    - "contracts/IMPLEMENTATION_REPORT.md"
    - "contracts/ARCHITECT_REVIEW.md"
    - "architect/SKILL.md"
    - "executor/SKILL.md"
    - "scripts/validate_skill_library.py"
    - "scripts/test_validate_skill_library.py"
    - "repository-native fixtures/tests directly required by the validator"
    - ".agent/tasks/TASK-0029/report.yaml"
    - "temporary run-owned pilot fixtures/scripts outside canonical reusable surfaces"

invariants:
  - "Protocol version remains 3."
  - "There is exactly one task model; no task-lite, task-compact, report-lite, review-lite, alternate schema, or fourth execution lane is introduced."
  - "Rich semantics do not require verbose serialization; sparse encoding must preserve the same normalized semantic model."
  - "Architect owns material WHAT, material BOUNDARY, and PROOF; Executor owns local HOW unless consequences change."
  - "GitHub remains canonical durable truth; compact artifacts must remain repository-reconstructible across fresh chats and successor agents."
  - "Fail-closed authority/capability/promotion/release semantics cannot be weakened to save bytes."
  - "Case Router remains exactly EXECUTE -> executor and is outside this task's mutation scope."
  - "Embedding remains NOT_ADMITTED."
  - "No scheduler/orchestrator/daemon/queue/cache/vector database or runtime intelligence is introduced."
  - "Physical branch topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not create protocol v4 or another artifact schema/family."
  - "Do not make omission grant authority, capability, PASS, write permission, branch creation, promotion, release, or continuation."
  - "Do not delete evidence needed to reconstruct exact task/report/review identity, material acceptance, blockers, deviations, candidate identity, or durable Architect judgment."
  - "Do not add new CASE values or change Case Router semantics."
  - "Do not implement local parallel execution, scheduler logic, execution batching, evidence epochs, embeddings, semantic retrieval, or runtime orchestration in this task."
  - "Do not mutate agent-skills/main."
  - "Do not create, rename, or delete branches."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

