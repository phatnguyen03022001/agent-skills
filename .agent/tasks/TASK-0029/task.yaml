    - repository_content_write
    - exact_commit_report_resolution
    - remote_ref_read

acceptance_criteria:
  - id: AC-1
    requirement: "Canonical task/report/review authored defaults are materially sparse while preserving the single protocol-v3 semantic model and existing fail-closed defaults."
    evidence_required: "Exact changed templates/contracts/role guidance plus validator tests proving sparse and expanded v3 compatibility."
  - id: AC-2
    requirement: "Sparse task omission is semantics-preserving only for controls already covered by the canonical v3 defaults table; explicit expanded equivalents normalize identically."
    evidence_required: "Focused normalization equivalence tests for every changed omission path."
  - id: AC-3
    requirement: "Compact report/review artifacts retain exact durable identity and material acceptance evidence while eliminating redundant successful-process narration and reconstructible repetition."
    evidence_required: "Focused sparse report/review fixtures and negative tests showing mandatory identity/material evidence still fails closed when removed."
  - id: AC-4
    requirement: "At least 6 representative historical v3 episodes are reserialized in run-owned fixtures with no semantic/evidence loss and show >=40% median combined byte reduction."
    evidence_required: "Mechanically computed per-episode before/after byte counts, median reduction, scenario coverage, and validator/semantic-equivalence proof."
  - id: AC-5
    requirement: "Canonical task/report/review template/example combined bytes decrease >=40% from exact base, or the task blocks with independently proven contract necessity rather than weakening semantics."
    evidence_required: "Exact-base and candidate byte counts with reproducible calculation."
  - id: AC-6
    requirement: "Full repository validation/regression remains green and historical expanded protocol-v3 artifacts require no migration or backfill."
    evidence_required: "Full validator/unit suite, representative historical fixture validation, py_compile where applicable, and git diff --check."
  - id: AC-7
    requirement: "No new schema, lifecycle, CASE, service, scheduler, retrieval mechanism, branch, dependency, or authority layer is introduced."
    evidence_required: "Exact changed-path/diff proof and simplicity review."
  - id: AC-8
    requirement: "Implementation candidate and compact report-only child are published on dev with independent remote SHA proof; main remains unchanged and topology remains exactly {dev, main}."
    evidence_required: "Candidate SHA, report SHA, fresh remote refs/topology, and local==remote proof when using the designated local mirror."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-resolve exact TASK-0029/base, active authority-set architect-profile/main@89dacd43b7a200a7b9cd36d9545f23c930eb4f44, pinned agent-skills@4a063c41f429207577434600a3571dc17822cd78, branch topology, and clean local ownership before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Measure exact-base bytes for canonical task/report/review templates and selected pilot episodes before editing; keep measurements run-owned/non-authoritative."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused sparse-vs-expanded normalization and mandatory-evidence negative tests."
      required: true
    - id: CHECK-4
      command_or_check: "Run the full stdlib validator/unit regression suite and any repo-native verification required by changed surfaces."
      required: true
    - id: CHECK-5
      command_or_check: "Recompute >=40% median pilot reduction and >=40% combined canonical-template reduction mechanically from raw byte counts; fail closed on mismatch or semantic loss."
      required: true
    - id: CHECK-6
      command_or_check: "Run py_compile for modified Python, git diff --check, exact changed-path proof, simplicity check, and verify Case Router remains byte-identical/outside diff."
      required: true
    - id: CHECK-7
      command_or_check: "Commit/push exact implementation candidate on dev, independently prove remote dev == candidate, create only the compact TASK-0029 report child, push it, independently prove remote dev == report SHA, require main unchanged/topology {dev, main}, and reconcile designated local dev to final remote dev before NEEDS_REVIEW."
      required: true

  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

