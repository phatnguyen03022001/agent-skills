    evidence_required: ""

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: ""
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: false
  push: false
  promote_to_main: false

blocking_decisions: []
execution_ready: false
