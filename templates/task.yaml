  status: UNRESOLVED
  source: ""
  rationale: ""

objective: ""

scope:
  required_changes:
    - ""
  allowed_existing_files_or_components:
    - ""
  expected_files_are_restrictive: true

invariants:
  - no unrelated cleanup or adjacent fixes
  - no undocumented scope expansion
  - no architecture, roadmap, canonical spec, or public-contract change without revised Architect authority
  - no unauthorized dependency change
  - no unauthorized structural reorganization
  - no orphan source files
  - no speculative scale structure

forbidden_changes:
  - ""

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
